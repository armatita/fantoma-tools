var lang = 'en';
function t(key) { return STRINGS[lang][key]; }

/* Numbers are always formatted with a decimal POINT, in both languages.
   toFixed does that regardless of locale; toLocaleString would not. */
function mm(value, places) {
  return value.toFixed(places === undefined ? 1 : places);
}


/* --------------------------------------------------------------------------
   The document, so far
   -------------------------------------------------------------------------- */
var DOC_VERSION = 1;

/* The whole project is this one object, and it is what a .protoplaca.json file
   contains. Nothing derived lives in it -- no mesh, no screen coordinates --
   so the file cannot ever disagree with itself.

   Components are a position and a size rather than an outline polygon. You
   arrive at a component by measuring a real part with calipers, and what you
   read off is a width and a height; an outline is not something anyone types.
   Outlines stay possible later for the odd L-shaped board without changing
   what is already written here. */
function blankDoc() {
  return {
    format: 'protoplaca',
    version: DOC_VERSION,
    units: 'mm',
    name: '',
    plate: { w: 120, h: 80, thickness: 3 },
    profile: defaultProfile(),
    components: [],       // see normComponent for the fields
    bosses: [],           // see normBoss
    wires: [],            // see normWire
    texts: [],            // see normText
    guides: []            // { axis: 'x' | 'y', v: mm }
  };
}

/* --------------------------------------------------------------------------
   The print profile
   --------------------------------------------------------------------------
   A boss is a tube: a hole of some diameter with a wall around it. Neither
   number is a property of the design -- they are properties of your printer,
   your filament, and in the case of inserts, the particular inserts you
   bought. So they live here, once, rather than on every boss.

   EVERY NUMBER BELOW IS A PLACEHOLDER. The self-tap and clearance figures are
   the conventional tapping and clearance sizes, which is inference from a
   standard rather than a measurement. The insert figures are worse: they vary
   by brand and by length, and the only way to know yours is to push one in.
   The calibration coupon exists to replace all of them, and the panel says so
   rather than letting them look authoritative.
   -------------------------------------------------------------------------- */
function defaultProfile() {
  return {
    // Whose printer these numbers describe. Results mean nothing without it:
    // the same 1.6 mm pilot measured 0.925 mm under one slicer profile and
    // 1.580 mm under another, from settings alone.
    source: 'Elegoo Centauri Carbon \u00b7 PLA \u00b7 FINISH profile',
    minHole: 1.5,         // below this a round hole stops being round
    wall: 2,              // mm of material around the hole
    holes: {
      // size:   [ self-tap, heat-set insert, clearance ]
      M1_4:{ selftap: 1.1,  insert: 2.6, clearance: 1.6 },
      M1_7:{ selftap: 1.35, insert: 2.9, clearance: 2.0 },
      M2:  { selftap: 1.6,  insert: 3.2, clearance: 2.4 },
      M2_5:{ selftap: 2.1, insert: 3.6, clearance: 2.9 },
      M3:  { selftap: 2.5, insert: 4.0, clearance: 3.4 },
      M4:  { selftap: 3.3, insert: 5.6, clearance: 4.5 }
    },
    holeSource: defaultHoleSource()
  };
}

/* --------------------------------------------------------------------------
   Where each number came from
   --------------------------------------------------------------------------
   Three states, and the tool never promotes between them on its own:

     measured  - confirmed on a real print, on the machine named in `source`
     standard  - an ISO tapping or clearance size; a table, not a measurement
     assumed   - extrapolated or invented, because nothing better was to hand

   `measured` beats the other two by a margin worth showing. On the real
   control panel a 1.6 mm pilot came out 0.925 mm -- 42 % undersize -- and on
   the test coupon, same drawing, it came out 1.580 mm. Nothing in a table
   predicts that; only a print does.

   Promotion is deliberate and manual. Editing a number does NOT mark it
   measured, because you might be trying a value rather than reporting one,
   and a guess must never be promoted to a measurement without measuring.
   -------------------------------------------------------------------------- */
var SOURCES = ['measured', 'standard', 'assumed'];

function defaultHoleSource() {
  return {
    // M2 and M3 self-tap pilots: swept on T2 and both took their screws
    // without splitting or stripping at 2-3 mm of engagement.
    M1_4: { selftap: 'standard', insert: 'assumed',  clearance: 'standard' },
    M1_7: { selftap: 'assumed',  insert: 'assumed',  clearance: 'assumed'  },
    M2:   { selftap: 'measured', insert: 'assumed',  clearance: 'standard' },
    M2_5: { selftap: 'standard', insert: 'assumed',  clearance: 'standard' },
    M3:   { selftap: 'measured', insert: 'assumed',  clearance: 'standard' },
    M4:   { selftap: 'standard', insert: 'assumed',  clearance: 'standard' }
  };
}

function holeSourceOf(b) {
  var row = doc.profile.holeSource[b.size];
  return (row && row[b.fixing]) || 'assumed';
}

function holeTooSmall(b) {
  return b.fixing !== 'insert' && holeDia(b) < numOr(doc.profile.minHole, 1.5);
}

/* M1.7 is not an ISO metric size, but it turns up constantly in small modules
   and consumer teardowns, so it is here. Its figures are interpolated from its
   neighbours rather than taken from a table -- one step further from measured
   than the rest, and the rest are only standard sizes to begin with. */
var SIZES = ['M1_4', 'M1_7', 'M2', 'M2_5', 'M3', 'M4'];
var FIXINGS = ['selftap', 'insert', 'clearance'];

function sizeLabel(key) { return key.replace('_', '.'); }

function holeDia(b) {
  var row = doc.profile.holes[b.size] || doc.profile.holes.M3;
  return numOr(row[b.fixing], 2.5, 0.2, 40);
}

function bossOuterDia(b) {
  return holeDia(b) + 2 * numOr(doc.profile.wall, 2, 0.4, 20);
}

var doc = blankDoc();

/* Selection is held as a kind and an id, never as a reference to the object.

   Two reasons. Undo replaces the whole document with a fresh parse, so an
   object reference kept across it would point at something no longer in the
   drawing. And more than one kind of thing is selectable now -- a component or
   a boss -- so the selection has to say which, rather than every reader
   guessing from context. */
var sel = { kind: null, id: null };

function select(kind, id) { sel.kind = kind; sel.id = id; }
function deselect() { sel.kind = null; sel.id = null; }
function hasSelection() { return sel.kind !== null; }

function findIn(list, id) {
  for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
  return null;
}

/* The grid pitch is how you are working, not what you designed, so it is a
   preference of this browser rather than part of the document. */
var gridPitch = 1;        // mm; 0 means no grid and no snapping

function selectedComponent() {
  return sel.kind === 'component' ? findIn(doc.components, sel.id) : null;
}

function selectedBoss() {
  return sel.kind === 'boss' ? findIn(doc.bosses, sel.id) : null;
}

function selectedWire() {
  return sel.kind === 'wire' ? findIn(doc.wires, sel.id) : null;
}

function selectedText() {
  return sel.kind === 'text' ? findIn(doc.texts, sel.id) : null;
}

/* Whatever is selected, of whichever kind. Used by the things that do not
   care -- delete, and the "is anything selected" hint. */
function selectedAny() {
  return selectedComponent() || selectedBoss() || selectedWire() || selectedText();
}


/* --------------------------------------------------------------------------
   Coordinates
   --------------------------------------------------------------------------
   World coordinates are millimetres with 0,0 at the plate's bottom-left
   corner, X right and Y up — the modelling convention, chosen so the mesh
   generator never has to flip an axis. The screen has Y increasing downward,
   so the flip happens HERE and in no other place in the program. If a part
   ever comes out mirrored, these four lines are the entire suspect list.
   -------------------------------------------------------------------------- */
var RULER = 22;           // px: width of the left ruler, height of the top one

var view = { scale: 4, x0: -10, y0: -10 };   // px per mm, and the world point
                                             // at the plot area's bottom-left

var plot = { x0: RULER, y0: RULER, x1: 0, y1: 0 };   // px, filled in on resize

function sx(wx) { return plot.x0 + (wx - view.x0) * view.scale; }
function sy(wy) { return plot.y1 - (wy - view.y0) * view.scale; }
function wx(px) { return view.x0 + (px - plot.x0) / view.scale; }
function wy(py) { return view.y0 + (plot.y1 - py) / view.scale; }

function snap(value) {
  if (!gridPitch) return value;
  return Math.round(value / gridPitch) * gridPitch;
}


/* --------------------------------------------------------------------------
   Reading a document
   --------------------------------------------------------------------------
   Everything that enters the program from outside -- a file you opened, or
   what this browser remembered from last time -- comes through here first.
   Both routes use the same code, so a bug in one cannot hide in the other.

   Unknown fields are carried through untouched. A file written by a later
   version of Protoplaca will contain sections this build has never heard of;
   dropping them on load would mean that merely opening a project quietly
   destroyed part of it.
   -------------------------------------------------------------------------- */
var MIN_COMP = 1;         // mm: anything smaller is a mis-drag, not a part
var idSeq = 0;

function copyInto(target, source) {
  for (var k in source) {
    if (Object.prototype.hasOwnProperty.call(source, k)) target[k] = source[k];
  }
  return target;
}

function numOr(value, fallback, lo, hi) {
  var v = typeof value === 'number' ? value : parseFloat(value);
  if (!isFinite(v)) return fallback;
  if (lo !== undefined) v = Math.max(lo, v);
  if (hi !== undefined) v = Math.min(hi, v);
  return v;
}

function pairOr(value, fallback, lo) {
  if (!value || typeof value.length !== 'number' || value.length < 2) return fallback.slice();
  return [numOr(value[0], fallback[0], lo), numOr(value[1], fallback[1], lo)];
}

function colourOr(value, fallback) {
  return (typeof value === 'string' && /^#[0-9a-fA-F]{6}$/.test(value)) ? value : fallback;
}

function nextId(taken, prefix) {
  var id;
  do { id = (prefix || 'c') + (++idSeq); } while (taken && taken[id]);
  return id;
}

function normComponent(raw, taken) {
  var c = copyInto({}, raw && typeof raw === 'object' ? raw : {});
  c.id = (typeof c.id === 'string' && c.id && !taken[c.id]) ? c.id : nextId(taken);
  taken[c.id] = true;
  c.name = typeof c.name === 'string' ? c.name.slice(0, 40) : '';
  c.at = pairOr(c.at, [0, 0]);
  c.size = pairOr(c.size, [20, 20], MIN_COMP);
  c.colour = colourOr(c.colour, '#4dd8ff');
  c.standoff = numOr(c.standoff, 6, 0, 200);    // clear space under the board
  c.board = numOr(c.board, 1.6, 0, 50);         // the PCB itself
  c.body = numOr(c.body, 10, 0, 300);           // whatever stands on top of it
  return c;
}

/* A boss may belong to a component. When it does, its height is the
   component's standoff -- they are the same measurement described twice, and
   if they disagree the board sits crooked or does not sit at all. The value is
   still written into the file so the document stays self-contained and the
   mesh generator never has to chase a reference to find a height. */
function normBoss(raw, taken, componentIds) {
  var b = copyInto({}, raw && typeof raw === 'object' ? raw : {});
  b.id = (typeof b.id === 'string' && b.id && !taken[b.id]) ? b.id : nextId(taken, 'b');
  taken[b.id] = true;
  b.at = pairOr(b.at, [0, 0]);
  b.size = SIZES.indexOf(b.size) >= 0 ? b.size : 'M3';
  b.fixing = FIXINGS.indexOf(b.fixing) >= 0 ? b.fixing : 'selftap';
  b.height = numOr(b.height, 6, 0.4, 200);
  // A reference to a component that is not in the file is not a reference.
  b.of = (typeof b.of === 'string' && componentIds[b.of]) ? b.of : null;
  return b;
}

function normProfile(raw) {
  var d = defaultProfile();
  var out = copyInto({}, raw && typeof raw === 'object' ? raw : {});
  out.wall = numOr(out.wall, d.wall, 0.4, 20);
  out.minHole = numOr(out.minHole, d.minHole, 0.1, 20);
  out.source = typeof out.source === 'string' ? out.source.slice(0, 80) : d.source;
  var holes = copyInto({}, (raw && raw.holes) || {});
  for (var i = 0; i < SIZES.length; i++) {
    var key = SIZES[i];
    var row = copyInto({}, holes[key] || {});
    for (var j = 0; j < FIXINGS.length; j++) {
      row[FIXINGS[j]] = numOr(row[FIXINGS[j]], d.holes[key][FIXINGS[j]], 0.2, 40);
    }
    holes[key] = row;
  }
  out.holes = holes;

  var src = copyInto({}, (raw && raw.holeSource) || {});
  for (var a = 0; a < SIZES.length; a++) {
    var sk = SIZES[a];
    var srow = copyInto({}, src[sk] || {});
    for (var b2 = 0; b2 < FIXINGS.length; b2++) {
      var fk = FIXINGS[b2];
      if (SOURCES.indexOf(srow[fk]) < 0) srow[fk] = d.holeSource[sk][fk];
    }
    src[sk] = srow;
  }
  out.holeSource = src;
  return out;
}

/* --------------------------------------------------------------------------
   Wires
   --------------------------------------------------------------------------
   A path of points in PLATE coordinates, each optionally carrying `of`: the
   component it is attached to.

   World coordinates rather than component-local offsets, deliberately. An
   anchored point then travels with its component exactly as a boss does --
   one pattern in this file, not two -- and a point whose component has been
   deleted degrades to a free point exactly where it already was, instead of
   jumping to wherever a local offset happens to land.

   AWG fixes the conductor; it does NOT fix the outside diameter, because the
   jacket does. Silicone-jacketed 24 AWG is appreciably fatter than PVC 24 AWG.
   So the gauge supplies a default and the OD stays editable per wire, and the
   defaults below are typical PVC hookup wire -- assumed, not measured.
   -------------------------------------------------------------------------- */
var AWGS = [30, 28, 26, 24, 22, 20, 18];
var AWG_OD = { 30: 0.8, 28: 0.9, 26: 1.1, 24: 1.4, 22: 1.7, 20: 2.1, 18: 2.4 };
var WIRE_PALETTE = ['#e0534f', '#4dd8ff', '#5ee88f', '#ffb648', '#f4f4f2', '#b45cff'];

function odForAwg(awg) { return AWG_OD[awg] || 1.4; }

function normPoint(raw, componentIds) {
  var pt = { at: pairOr(raw && raw.at, [0, 0]) };
  if (raw && typeof raw.of === 'string' && componentIds[raw.of]) pt.of = raw.of;
  return pt;
}

function normWire(raw, taken, componentIds) {
  var w = copyInto({}, raw && typeof raw === 'object' ? raw : {});
  w.id = (typeof w.id === 'string' && w.id && !taken[w.id]) ? w.id : nextId(taken, 'w');
  taken[w.id] = true;
  w.name = typeof w.name === 'string' ? w.name.slice(0, 40) : '';
  w.colour = colourOr(w.colour, WIRE_PALETTE[0]);
  w.awg = AWGS.indexOf(w.awg) >= 0 ? w.awg : 24;
  w.od = numOr(w.od, odForAwg(w.awg), 0.1, 20);
  w.slack = numOr(w.slack, 20, 0, 500);

  var src = (raw && raw.path && raw.path.length) ? raw.path : [];
  w.path = [];
  for (var i = 0; i < src.length; i++) w.path.push(normPoint(src[i], componentIds));
  return w;
}

function wirePoints(w) {
  var out = [];
  for (var i = 0; i < w.path.length; i++) out.push(w.path[i].at);
  return out;
}

/* Raised lettering on the plate. `of` is not offered: a label belongs to the
   plate, not to a component, because it is usually naming the empty space
   beside one rather than the part itself. */
function normText(raw, taken) {
  var x = copyInto({}, raw && typeof raw === 'object' ? raw : {});
  x.id = (typeof x.id === 'string' && x.id && !taken[x.id]) ? x.id : nextId(taken, 'x');
  taken[x.id] = true;
  x.text = typeof x.text === 'string' ? x.text.slice(0, 40) : 'TEXT';
  x.at = pairOr(x.at, [10, 10]);
  x.size = numOr(x.size, 4, 1, 100);          // cap height
  x.stroke = numOr(x.stroke, 0.8, 0.2, 10);   // pen width
  x.height = numOr(x.height, 0.6, 0.1, 10);   // how far it stands proud
  x.align = (x.align === 'centre') ? 'centre' : 'left';
  return x;
}

function normGuide(raw) {
  if (!raw || typeof raw !== 'object') return null;
  if (raw.axis !== 'x' && raw.axis !== 'y') return null;
  var v = numOr(raw.v, NaN);
  return isFinite(v) ? { axis: raw.axis, v: v } : null;
}

/* Returns { doc: <document>, newer: <bool> }, or throws with a message meant
   to be read by a person. */
function normDoc(raw) {
  if (!raw || typeof raw !== 'object' || raw.format !== 'protoplaca') {
    throw new Error(t('errNotProject'));
  }
  var out = copyInto({}, raw);
  var fileVersion = numOr(raw.version, DOC_VERSION);

  out.format = 'protoplaca';
  // Keep a newer file's own version number. This build preserved the parts it
  // did not understand, so calling the result version 1 would be a lie.
  out.version = Math.max(fileVersion, DOC_VERSION);
  out.units = 'mm';
  out.name = typeof raw.name === 'string' ? raw.name.slice(0, 60) : '';

  var rawPlate = raw.plate && typeof raw.plate === 'object' ? raw.plate : {};
  out.plate = copyInto({}, rawPlate);
  out.plate.w = numOr(rawPlate.w, 120, 10, 2000);
  out.plate.h = numOr(rawPlate.h, 80, 10, 2000);
  out.plate.thickness = numOr(rawPlate.thickness, 3, 0.4, 100);

  var taken = {};
  var list = (raw.components && raw.components.length) ? raw.components : [];
  out.components = [];
  for (var i = 0; i < list.length; i++) out.components.push(normComponent(list[i], taken));

  out.profile = normProfile(raw.profile);

  var componentIds = {};
  for (var k = 0; k < out.components.length; k++) componentIds[out.components[k].id] = true;

  var bl = (raw.bosses && raw.bosses.length) ? raw.bosses : [];
  out.bosses = [];
  for (var m = 0; m < bl.length; m++) out.bosses.push(normBoss(bl[m], taken, componentIds));

  var wl = (raw.wires && raw.wires.length) ? raw.wires : [];
  out.wires = [];
  for (var n = 0; n < wl.length; n++) out.wires.push(normWire(wl[n], taken, componentIds));

  var xl = (raw.texts && raw.texts.length) ? raw.texts : [];
  out.texts = [];
  for (var q = 0; q < xl.length; q++) out.texts.push(normText(xl[q], taken));

  var gs = (raw.guides && raw.guides.length) ? raw.guides : [];
  out.guides = [];
  for (var j = 0; j < gs.length; j++) {
    var g = normGuide(gs[j]);
    if (g) out.guides.push(g);
  }

  return { doc: out, newer: fileVersion > DOC_VERSION };
}


/* --------------------------------------------------------------------------
   Undo
   --------------------------------------------------------------------------
   The document is small enough that a snapshot is just its JSON, so undo is a
   stack of strings rather than a pile of inverse operations with bugs of
   their own.

   It exists because the tool saves as you work. Without autosave a deletion
   costs nothing -- you close without saving. With it, the previous state is
   already overwritten, so undo is not a convenience here, it is the only way
   back.
   -------------------------------------------------------------------------- */
var undoStack = [];
var redoStack = [];
var UNDO_LIMIT = 60;

function snapshot() {
  undoStack.push(JSON.stringify(doc));
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack.length = 0;
}

function restore(from, to) {
  if (!from.length) return;
  to.push(JSON.stringify(doc));
  doc = JSON.parse(from.pop());
  if (!selectedAny()) deselect();
  syncControls();
  scheduleSave();
  draw();
}

function undo() { restore(undoStack, redoStack); }
function redo() { restore(redoStack, undoStack); }


/* --------------------------------------------------------------------------
   Components on the canvas
   -------------------------------------------------------------------------- */
var HANDLE = 7;           // px, square side

function withAlpha(hex, alpha) {
  var n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + alpha + ')';
}

function compRectPx(c) {
  return {
    x: sx(c.at[0]),
    y: sy(c.at[1] + c.size[1]),           // screen y of the TOP edge
    w: c.size[0] * view.scale,
    h: c.size[1] * view.scale
  };
}

/* The eight grips of a selection box, in screen pixels. Each carries which
   world edges it moves -- ex/ey of -1, 0 or 1 for the low edge, neither, or
   the high edge -- so one piece of arithmetic drives all eight. */
function handlesOf(c) {
  var r = compRectPx(c);
  var mx = r.x + r.w / 2, my = r.y + r.h / 2;
  return [
    { id: 'nw', x: r.x,       y: r.y,       ex: -1, ey:  1 },
    { id: 'n',  x: mx,        y: r.y,       ex:  0, ey:  1 },
    { id: 'ne', x: r.x + r.w, y: r.y,       ex:  1, ey:  1 },
    { id: 'e',  x: r.x + r.w, y: my,        ex:  1, ey:  0 },
    { id: 'se', x: r.x + r.w, y: r.y + r.h, ex:  1, ey: -1 },
    { id: 's',  x: mx,        y: r.y + r.h, ex:  0, ey: -1 },
    { id: 'sw', x: r.x,       y: r.y + r.h, ex: -1, ey: -1 },
    { id: 'w',  x: r.x,       y: my,        ex: -1, ey:  0 }
  ];
}

function handleAt(p) {
  var c = selectedComponent();
  if (!c) return null;
  var hs = handlesOf(c);
  for (var i = 0; i < hs.length; i++) {
    if (Math.abs(hs[i].x - p.x) <= HANDLE && Math.abs(hs[i].y - p.y) <= HANDLE) return hs[i];
  }
  return null;
}

function distToSegment(px, py, ax, ay, bx, by) {
  var vx = bx - ax, vy = by - ay;
  var len2 = vx * vx + vy * vy;
  var t = len2 ? ((px - ax) * vx + (py - ay) * vy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  var dx = px - (ax + t * vx), dy = py - (ay + t * vy);
  return Math.sqrt(dx * dx + dy * dy);
}

function wireAt(p) {
  for (var i = doc.wires.length - 1; i >= 0; i--) {
    var w = doc.wires[i];
    var tol = Math.max(4, w.od * view.scale / 2 + 2);
    for (var k = 1; k < w.path.length; k++) {
      var a = w.path[k - 1].at, b = w.path[k].at;
      if (distToSegment(p.x, p.y, sx(a[0]), sy(a[1]), sx(b[0]), sy(b[1])) <= tol) return w;
    }
  }
  return null;
}

function wireVertexAt(p) {
  var w = selectedWire();
  if (!w) return null;
  for (var i = 0; i < w.path.length; i++) {
    if (Math.abs(sx(w.path[i].at[0]) - p.x) <= HANDLE
     && Math.abs(sy(w.path[i].at[1]) - p.y) <= HANDLE) return { wire: w, index: i };
  }
  return null;
}

/* Topmost first: later components are drawn on top, so they are picked first. */
function componentAt(p) {
  var x = wx(p.x), y = wy(p.y);
  for (var i = doc.components.length - 1; i >= 0; i--) {
    var c = doc.components[i];
    if (x >= c.at[0] && x <= c.at[0] + c.size[0]
     && y >= c.at[1] && y <= c.at[1] + c.size[1]) return c;
  }
  return null;
}

/* Trim a label until it fits the box it is sitting in. Better a shortened
   name than one that spills over its own component and onto its neighbour. */
function fitLabel(text, maxWidth) {
  if (ctx.measureText(text).width <= maxWidth) return text;
  var out = text;
  while (out.length > 1 && ctx.measureText(out).width > maxWidth) out = out.slice(0, -1);
  return out;
}

function drawComponents() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (var i = 0; i < doc.components.length; i++) {
    var c = doc.components[i];
    var r = compRectPx(c);

    ctx.fillStyle = withAlpha(c.colour, 0.22);
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = c.colour;
    ctx.lineWidth = 1;
    ctx.strokeRect(crisp(r.x), crisp(r.y), Math.round(r.w), Math.round(r.h));

    // The name, and under it the two numbers you would otherwise go to the
    // panel to read -- but only where there is honestly room for them. A label
    // that overflows its component is worse than no label.
    var lines = [];
    if (c.name) lines.push(c.name);
    if (showDims) {
      lines.push(round2(c.size[0]) + ' \u00d7 ' + round2(c.size[1]));
      lines.push('(' + round2(c.at[0]) + ', ' + round2(c.at[1]) + ')');
    }
    if (!lines.length) continue;

    var lineH = 12;
    if (r.w < 36 || r.h < lines.length * lineH + 4) continue;

    var cx = r.x + r.w / 2;
    var top = r.y + r.h / 2 - (lines.length - 1) * lineH / 2;
    for (var k = 0; k < lines.length; k++) {
      ctx.font = (k === 0 && c.name ? '11px' : '10px')
        + ' ui-monospace, Menlo, Consolas, monospace';
      ctx.fillStyle = (k === 0 && c.name) ? c.colour : withAlpha(c.colour, 0.75);
      ctx.fillText(fitLabel(lines[k], r.w - 8), cx, top + k * lineH);
    }
  }
}

function bossAt(p) {
  var x = wx(p.x), y = wy(p.y);
  for (var i = doc.bosses.length - 1; i >= 0; i--) {
    var b = doc.bosses[i];
    var r = bossOuterDia(b) / 2;
    var dx = x - b.at[0], dy = y - b.at[1];
    if (dx * dx + dy * dy <= r * r) return b;
  }
  return null;
}

function drawBosses() {
  for (var i = 0; i < doc.bosses.length; i++) {
    var b = doc.bosses[i];
    var cx = sx(b.at[0]), cy = sy(b.at[1]);
    var outer = bossOuterDia(b) / 2 * view.scale;
    var hole = holeDia(b) / 2 * view.scale;

    // The ring of material, then the hole through it. Drawn as an annulus so
    // what you see is what the mesh will be: a tube, not a disc.
    ctx.fillStyle = withAlpha(COL.boss, 0.30);
    ctx.beginPath();
    ctx.arc(cx, cy, outer, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = COL.bg;
    ctx.beginPath();
    ctx.arc(cx, cy, hole, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = COL.boss;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, outer, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, hole, 0, Math.PI * 2); ctx.stroke();

    // With dimensions on, a boss says what it is. This is what makes the
    // calibration coupon readable on screen: eighteen identical-looking rings
    // become a labelled grid, and the editor becomes the coupon's legend.
    if (showDims && outer > 11) {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.font = '9px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillStyle = COL.boss;
      ctx.fillText(sizeLabel(b.size), cx, cy + outer + 3);
      if (outer > 16) {
        ctx.fillStyle = withAlpha(COL.boss, 0.7);
        ctx.fillText(t(b.fixing), cx, cy + outer + 13);
      }
    }

    // A heat-set insert is a different operation with a different failure
    // mode, so it should not look like a drilled hole. Ticks mark it.
    if (b.fixing === 'insert' && hole > 3) {
      ctx.beginPath();
      for (var a = 0; a < 4; a++) {
        var ang = a * Math.PI / 2 + Math.PI / 4;
        ctx.moveTo(cx + Math.cos(ang) * hole, cy + Math.sin(ang) * hole);
        ctx.lineTo(cx + Math.cos(ang) * outer, cy + Math.sin(ang) * outer);
      }
      ctx.stroke();
    }
  }
}

/* Wires are drawn at their real insulated width. That is not decoration: six
   24 AWG wires are 8.4 mm of jacket side by side, and seeing that they will
   not fit through a gap is the reason to draw the plan before building it. */
function drawWires() {
  for (var i = 0; i < doc.wires.length; i++) {
    var w = doc.wires[i];
    if (w.path.length < 1) continue;

    var pts = wirePoints(w);
    var live = (wireDraw && wireDraw.id === w.id) ? wireDraw.live : null;

    ctx.strokeStyle = w.colour;
    ctx.lineWidth = Math.max(1.5, w.od * view.scale);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.85;

    ctx.beginPath();
    ctx.moveTo(sx(pts[0][0]), sy(pts[0][1]));
    for (var k = 1; k < pts.length; k++) ctx.lineTo(sx(pts[k][0]), sy(pts[k][1]));
    ctx.stroke();

    if (live) {
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(sx(pts[pts.length - 1][0]), sy(pts[pts.length - 1][1]));
      ctx.lineTo(sx(live[0]), sy(live[1]));
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.globalAlpha = 1;
    ctx.lineWidth = 1;

    // An anchored end is marked, so it is visible which ends will follow a
    // component when it moves and which are free.
    for (var a = 0; a < w.path.length; a++) {
      if (!w.path[a].of) continue;
      ctx.strokeStyle = w.colour;
      ctx.beginPath();
      ctx.arc(sx(w.path[a].at[0]), sy(w.path[a].at[1]), 3.5, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (showDims && w.name && pts.length > 1) {
      // On the middle of the LONGEST run, not on a vertex: a vertex is usually
      // a corner tucked against a component, which is the one place a label
      // has nothing to sit on.
      var bestLen = -1, bi = 1;
      for (var m = 1; m < pts.length; m++) {
        var seg = Math.hypot(pts[m][0] - pts[m - 1][0], pts[m][1] - pts[m - 1][1]);
        if (seg > bestLen) { bestLen = seg; bi = m; }
      }
      var ax = sx(pts[bi - 1][0]), ay = sy(pts[bi - 1][1]);
      var bx2 = sx(pts[bi][0]), by2 = sy(pts[bi][1]);

      // Offset PERPENDICULAR to the run. Always offsetting upward puts the
      // label straight down the middle of a vertical wire, in the wire's own
      // colour, where it cannot be read at all.
      var qx = -(by2 - ay), qy = (bx2 - ax);
      var qlen = Math.hypot(qx, qy) || 1;
      qx /= qlen; qy /= qlen;
      if (qy > 0.01) { qx = -qx; qy = -qy; }              // prefer above
      else if (Math.abs(qy) <= 0.01 && qx < 0) { qx = -qx; qy = -qy; }   // else right

      var off = Math.max(1.5, w.od * view.scale) / 2 + 9;
      var tx = (ax + bx2) / 2 + qx * off, ty = (ay + by2) / 2 + qy * off;

      ctx.font = '10px ui-monospace, Menlo, Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // A halo, so the name reads over its own wire, a component, or the grid.
      ctx.lineJoin = 'round';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(13,13,18,0.9)';
      ctx.strokeText(w.name, tx, ty);
      ctx.lineWidth = 1;
      ctx.fillStyle = w.colour;
      ctx.fillText(w.name, tx, ty);
    }
  }
}

function textBox(x) {
  var w = textWidth(x.text, x.size);
  var left = x.align === 'centre' ? x.at[0] - w / 2 : x.at[0];
  return { x: left, y: x.at[1], w: w, h: x.size };
}

function drawTexts() {
  for (var i = 0; i < doc.texts.length; i++) {
    var x = doc.texts[i];
    var box = textBox(x);
    var strokes = textStrokes(x.text, x.size);

    ctx.strokeStyle = COL.text;
    ctx.lineWidth = Math.max(1, x.stroke * view.scale);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (var k = 0; k < strokes.length; k++) {
      var line = strokes[k];
      if (line.length < 2) continue;
      ctx.beginPath();
      ctx.moveTo(sx(box.x + line[0][0]), sy(box.y + line[0][1]));
      for (var m = 1; m < line.length; m++) {
        ctx.lineTo(sx(box.x + line[m][0]), sy(box.y + line[m][1]));
      }
      ctx.stroke();
    }
    ctx.lineWidth = 1;
  }
}

function textAt(p) {
  var wx1 = wx(p.x), wy1 = wy(p.y);
  for (var i = doc.texts.length - 1; i >= 0; i--) {
    var b = textBox(doc.texts[i]);
    if (wx1 >= b.x && wx1 <= b.x + b.w && wy1 >= b.y && wy1 <= b.y + b.h) return doc.texts[i];
  }
  return null;
}

function drawSelection() {
  var xt = selectedText();
  if (xt) {
    var tb = textBox(xt);
    ctx.strokeStyle = COL.select;
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.strokeRect(crisp(sx(tb.x) - 2), crisp(sy(tb.y + tb.h) - 2),
                   Math.round(tb.w * view.scale) + 4, Math.round(tb.h * view.scale) + 4);
    ctx.setLineDash([]);
    return;
  }

  var w = selectedWire();
  if (w && w.path.length) {
    for (var i = 0; i < w.path.length; i++) {
      var px = sx(w.path[i].at[0]), py = sy(w.path[i].at[1]);
      ctx.fillStyle = COL.bg;
      ctx.fillRect(px - HANDLE / 2, py - HANDLE / 2, HANDLE, HANDLE);
      ctx.strokeStyle = COL.select;
      ctx.lineWidth = 1;
      ctx.strokeRect(crisp(px - HANDLE / 2), crisp(py - HANDLE / 2), HANDLE, HANDLE);
    }
    return;
  }

  var b = selectedBoss();
  if (b) {
    var bx = sx(b.at[0]), by = sy(b.at[1]);
    var rad = bossOuterDia(b) / 2 * view.scale + 4;
    ctx.strokeStyle = COL.select;
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.arc(bx, by, rad, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    return;
  }

  var c = selectedComponent();
  if (!c) return;
  var r = compRectPx(c);

  ctx.strokeStyle = COL.select;
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  ctx.strokeRect(crisp(r.x), crisp(r.y), Math.round(r.w), Math.round(r.h));
  ctx.setLineDash([]);

  var hs = handlesOf(c);
  for (var i = 0; i < hs.length; i++) {
    ctx.fillStyle = COL.bg;
    ctx.fillRect(hs[i].x - HANDLE / 2, hs[i].y - HANDLE / 2, HANDLE, HANDLE);
    ctx.strokeStyle = COL.select;
    ctx.strokeRect(crisp(hs[i].x - HANDLE / 2), crisp(hs[i].y - HANDLE / 2), HANDLE, HANDLE);
  }
}


/* --------------------------------------------------------------------------
   Canvas plumbing
   -------------------------------------------------------------------------- */
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var W = 0, H = 0;         // CSS pixels
var pending = false;

function draw() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(function () { pending = false; render(); });
}

/* Match the drawing surface to the element it is drawn into. Returns true if
   anything changed.

   This is checked at the start of every render rather than only when a
   ResizeObserver fires, because those callbacks are delivered as part of a
   rendering update -- a window that is not painting can hold them back
   indefinitely, and the canvas would keep drawing at yesterday's width. The
   ruler would then be quietly wrong, which is the one thing this tool cannot
   afford. A rect read per frame is cheap; a lying ruler is not.

   The CANVAS rect, not the stage's: the stage has a 1px border and a
   scrollbar may come and go beside it, so the two boxes differ. */
function syncSize() {
  var rect = cv.getBoundingClientRect();
  var w = Math.max(1, Math.round(rect.width));
  var h = Math.max(1, Math.round(rect.height));
  if (w === W && h === H) return false;

  var dpr = window.devicePixelRatio || 1;
  W = w;
  H = h;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // draw in CSS px, render at device px
  plot.x1 = W;
  plot.y1 = H;
  return true;
}

// These only ask for a redraw; the redraw works out the new size for itself.
if (window.ResizeObserver) new ResizeObserver(draw).observe(cv);
window.addEventListener('resize', draw);


/* --------------------------------------------------------------------------
   Drawing
   -------------------------------------------------------------------------- */
var COL = {
  bg: '#14141a',
  plate: '#1e1e28',
  gridDim: 'rgba(255,255,255,0.045)',
  gridDimMajor: 'rgba(255,255,255,0.085)',
  grid: 'rgba(255,255,255,0.075)',
  gridMajor: 'rgba(255,255,255,0.16)',
  plateEdge: '#6f6f80',
  axis: '#4dd8ff',
  ruler: '#101016',
  rulerEdge: '#2b2b36',
  tick: '#4a4a58',
  label: '#8a8a96',
  guide: '#ffb648',
  measure: '#4dd8ff',
  select: '#f4f4f2',
  align: '#5ee88f',
  boss: '#c8c6c9',
  text: '#e8e6e3',
  crosshair: 'rgba(244,244,242,0.30)'
};

/* A "nice" step is one a person reads without counting: 1, 2, 5 and their
   decades. Pick the smallest one that leaves at least minPx between lines. */
function niceStep(minPx) {
  var steps = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];
  for (var i = 0; i < steps.length; i++) {
    if (steps[i] * view.scale >= minPx) return steps[i];
  }
  return steps[steps.length - 1];
}

function line(x1, y1, x2, y2) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

/* Half-pixel offset so a 1px line lands on one row of pixels instead of
   straddling two and coming out grey and fat. */
function crisp(v) { return Math.round(v) + 0.5; }

/* Below this, grid lines are closer together than they are wide and the grid
   turns into a grey wash, so that density is dropped. 3.5px rather than a
   rounder 5: a 120mm plate fitted to a laptop window lands at about 5 px/mm,
   and a 1mm grid that disappears exactly when you first open the tool is a
   poor way to introduce it. */
var MIN_GRID_PX = 3.5;

function drawGridLines(minor, major, dimColour, majorColour) {
  var left = wx(plot.x0), right = wx(plot.x1);
  var bottom = wy(plot.y1), top = wy(plot.y0);
  var i, v;

  ctx.lineWidth = 1;

  if (minor * view.scale >= MIN_GRID_PX) {
    ctx.strokeStyle = dimColour;
    ctx.beginPath();
    for (i = Math.ceil(left / minor); i * minor <= right; i++) {
      v = crisp(sx(i * minor));
      ctx.moveTo(v, plot.y0); ctx.lineTo(v, plot.y1);
    }
    for (i = Math.ceil(bottom / minor); i * minor <= top; i++) {
      v = crisp(sy(i * minor));
      ctx.moveTo(plot.x0, v); ctx.lineTo(plot.x1, v);
    }
    ctx.stroke();
  }

  if (major * view.scale >= MIN_GRID_PX) {
    ctx.strokeStyle = majorColour;
    ctx.beginPath();
    for (i = Math.ceil(left / major); i * major <= right; i++) {
      v = crisp(sx(i * major));
      ctx.moveTo(v, plot.y0); ctx.lineTo(v, plot.y1);
    }
    for (i = Math.ceil(bottom / major); i * major <= top; i++) {
      v = crisp(sy(i * major));
      ctx.moveTo(plot.x0, v); ctx.lineTo(plot.x1, v);
    }
    ctx.stroke();
  }
}

function drawGrid() {
  var minor = gridPitch || 10;
  var major = minor * 10;

  // Dim everywhere, bright inside the plate. The plate is where the work
  // happens; outside it the grid is context, not a working surface.
  drawGridLines(minor, major, COL.gridDim, COL.gridDimMajor);

  ctx.save();
  ctx.beginPath();
  ctx.rect(plot.x0, plot.y0, plot.x1 - plot.x0, plot.y1 - plot.y0);
  ctx.clip();
  ctx.beginPath();
  ctx.rect(sx(0), sy(doc.plate.h), doc.plate.w * view.scale, doc.plate.h * view.scale);
  ctx.clip();
  drawGridLines(minor, major, COL.grid, COL.gridMajor);
  ctx.restore();
}

function drawPlate() {
  var x = sx(0), y = sy(doc.plate.h);
  var w = doc.plate.w * view.scale, h = doc.plate.h * view.scale;

  ctx.fillStyle = COL.plate;
  ctx.fillRect(x, y, w, h);

  ctx.strokeStyle = COL.plateEdge;
  ctx.lineWidth = 1;
  ctx.strokeRect(crisp(x), crisp(y), Math.round(w), Math.round(h));

  // The origin corner, marked so the coordinate convention is visible rather
  // than something you have to remember.
  ctx.strokeStyle = COL.axis;
  ctx.lineWidth = 2;
  var ox = sx(0), oy = sy(0), arm = Math.min(18, w * 0.4, h * 0.4);
  line(ox, oy, ox + arm, oy);
  line(ox, oy, ox, oy - arm);
  ctx.fillStyle = COL.axis;
  ctx.font = '10px ui-monospace, Menlo, Consolas, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('0,0', ox + 4, oy + 4);
}

function drawGuides() {
  ctx.lineWidth = 1;
  ctx.strokeStyle = COL.guide;
  ctx.setLineDash([4, 4]);
  for (var i = 0; i < doc.guides.length; i++) {
    var g = doc.guides[i];
    if (g.axis === 'x') {
      var px = crisp(sx(g.v));
      if (px >= plot.x0 && px <= plot.x1) line(px, plot.y0, px, plot.y1);
    } else {
      var py = crisp(sy(g.v));
      if (py >= plot.y0 && py <= plot.y1) line(plot.x0, py, plot.x1, py);
    }
  }
  ctx.setLineDash([]);
}

function drawRulers() {
  var step = niceStep(56);          // labelled ticks
  var minor = step / 5;
  var i, p;

  ctx.fillStyle = COL.ruler;
  ctx.fillRect(0, 0, W, RULER);
  ctx.fillRect(0, 0, RULER, H);

  ctx.strokeStyle = COL.rulerEdge;
  ctx.lineWidth = 1;
  line(0, crisp(RULER), W, crisp(RULER));
  line(crisp(RULER), 0, crisp(RULER), H);

  ctx.font = '9px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = COL.label;

  // Top ruler: X
  ctx.strokeStyle = COL.tick;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  var left = wx(plot.x0), right = wx(plot.x1);
  ctx.beginPath();
  for (i = Math.ceil(left / minor); i * minor <= right; i++) {
    p = crisp(sx(i * minor));
    ctx.moveTo(p, RULER - 4); ctx.lineTo(p, RULER);
  }
  ctx.stroke();
  for (i = Math.ceil(left / step); i * step <= right; i++) {
    p = sx(i * step);
    ctx.strokeStyle = COL.label;
    line(crisp(p), RULER - 8, crisp(p), RULER);
    ctx.fillText(mm(i * step, step < 1 ? 1 : 0), p + 3, 3);
  }

  // Left ruler: Y. Numbers increase upward, which is the whole point of
  // choosing the modelling convention — the ruler reads like a ruler.
  ctx.strokeStyle = COL.tick;
  var bottom = wy(plot.y1), top = wy(plot.y0);
  ctx.beginPath();
  for (i = Math.ceil(bottom / minor); i * minor <= top; i++) {
    p = crisp(sy(i * minor));
    ctx.moveTo(RULER - 4, p); ctx.lineTo(RULER, p);
  }
  ctx.stroke();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  for (i = Math.ceil(bottom / step); i * step <= top; i++) {
    p = sy(i * step);
    ctx.strokeStyle = COL.label;
    line(RULER - 8, crisp(p), RULER, crisp(p));
    ctx.save();
    ctx.translate(3, p - 3);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'left';
    ctx.fillText(mm(i * step, step < 1 ? 1 : 0), 0, 10);
    ctx.restore();
  }

  // Where the pointer is, marked on both rulers. The crosshair says where you
  // are; this says what that is on the scale beside it.
  if (crosshair && cursor) {
    ctx.fillStyle = COL.axis;
    var cxp = sx(cursor.x), cyp = sy(cursor.y);
    if (cxp >= RULER && cxp <= W) ctx.fillRect(Math.round(cxp) - 1, 0, 2, RULER);
    if (cyp >= RULER && cyp <= H) ctx.fillRect(0, Math.round(cyp) - 1, RULER, 2);
  }

  ctx.fillStyle = COL.ruler;
  ctx.fillRect(0, 0, RULER, RULER);
  ctx.strokeStyle = COL.rulerEdge;
  ctx.strokeRect(0.5, 0.5, RULER - 1, RULER - 1);
  ctx.fillStyle = COL.label;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('mm', RULER / 2, RULER / 2);
}

/* A small plaque of text with a dark backing, so it stays readable over the
   grid, over a component, or over nothing. */
function plaque(lines, x, y, colour, swatch) {
  ctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';

  var padX = 6, padY = 4, lineH = 14, w = 0, i;
  var dot = swatch ? 13 : 0;     // room for the colour marker on its line
  for (i = 0; i < lines.length; i++) {
    var lw = ctx.measureText(lines[i]).width + (swatch && swatch.line === i ? dot : 0);
    w = Math.max(w, lw);
  }
  var boxW = w + padX * 2, boxH = lines.length * lineH + padY * 2;

  // Keep it inside the drawing rather than half off the edge.
  x = Math.min(Math.max(x, plot.x0 + 2), plot.x1 - boxW - 2);
  y = Math.min(Math.max(y, plot.y0 + 2), plot.y1 - boxH - 2);

  ctx.fillStyle = 'rgba(13,13,18,0.88)';
  ctx.fillRect(x, y, boxW, boxH);
  ctx.strokeStyle = colour || COL.measure;
  ctx.lineWidth = 1;
  ctx.strokeRect(crisp(x), crisp(y), Math.round(boxW), Math.round(boxH));

  for (i = 0; i < lines.length; i++) {
    var ty = y + padY + i * lineH;
    var tx = x + padX;
    if (swatch && swatch.line === i) {
      // A filled marker in the thing's own colour, so the identification is
      // not only a name but the same colour you are looking at on the plate.
      ctx.fillStyle = swatch.colour;
      ctx.beginPath();
      ctx.arc(tx + 4, ty + 6, 4, 0, Math.PI * 2);
      ctx.fill();
      tx += dot;
    }
    ctx.fillStyle = '#f4f4f2';
    ctx.fillText(lines[i], tx, ty);
  }
}

/* What the pointer is over, if anything. Resolved in the same order a click
   resolves, so the readout names whatever a click would pick. */
function hoverTarget(p) {
  var b = bossAt(p);
  if (b) {
    var text = sizeLabel(b.size) + ' ' + t(b.fixing);
    var host = b.of ? findIn(doc.components, b.of) : null;
    if (host && host.name) text += ' \u00b7 ' + host.name;
    return { text: text, colour: COL.boss };
  }
  var w = wireAt(p);
  if (w) return { text: w.name || t('wires'), colour: w.colour };
  var xt = textAt(p);
  if (xt) return { text: xt.text, colour: COL.text };
  var c = componentAt(p);
  if (c) return { text: c.name || t('components'), colour: c.colour };
  return null;
}

/* The pointer's position, where the pointer is.

   The status bar still carries X and Y, and it stays: it is always visible and
   does not depend on the pointer being over the drawing. But it is a strip
   below the canvas, which is not where you are looking while you place a part
   -- the same complaint the measure tool earned, one layer down. With no
   component library the coordinate readout is how parts get placed, so it is
   the number read most often and it belongs under the eye. */
var crosshair = true;
var showDims = false;   // off by default: it is a lot of ink on a busy plate
var alignSnap = true;
var alignHints = [];    // drawn only while a boss is being dragged

function drawCursor() {
  if (!crosshair || !cursor) return;

  var px = sx(cursor.x), py = sy(cursor.y);

  ctx.strokeStyle = COL.crosshair;
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 4]);
  line(crisp(px), plot.y0, crisp(px), plot.y1);
  line(plot.x0, crisp(py), plot.x1, crisp(py));
  ctx.setLineDash([]);

  var lines = ['(' + mm(cursor.x, 2) + ', ' + mm(cursor.y, 2) + ')'];
  var over = hoverTarget({ x: px, y: py });
  if (over) lines.push(over.text);

  plaque(lines, px + 14, py + 14, null,
         over ? { colour: over.colour, line: 1 } : null);
}

/* The ruler between a dragged boss and the sibling it just snapped to. The
   line says "these two agree"; the number is the hole spacing, which is the
   measurement you took with calipers in the first place. */
function drawAlignHints() {
  for (var i = 0; i < alignHints.length; i++) {
    var h = alignHints[i];
    var ax = sx(h.from[0]), ay = sy(h.from[1]);
    var bx = sx(h.to[0]), by = sy(h.to[1]);

    ctx.strokeStyle = COL.align;
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 3]);
    line(ax, ay, bx, by);
    ctx.setLineDash([]);

    // End ticks, so it reads as a dimension rather than a stray line.
    var vx = bx - ax, vy = by - ay;
    var len = Math.hypot(vx, vy) || 1;
    var px = -vy / len * 4, py = vx / len * 4;
    line(ax - px, ay - py, ax + px, ay + py);
    line(bx - px, by - py, bx + px, by + py);

    var d = Math.hypot(h.to[0] - h.from[0], h.to[1] - h.from[1]);
    plaque([mm(d, 2) + ' mm'], (ax + bx) / 2 + 8, (ay + by) / 2 + 8, COL.align);
  }
}

function drawMeasure() {
  if (!measure.a) return;
  var b = measure.b || measure.live;
  if (!b) return;

  var ax = sx(measure.a.x), ay = sy(measure.a.y);
  var bx = sx(b.x), by = sy(b.y);

  ctx.strokeStyle = COL.measure;
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  line(ax, ay, bx, by);
  ctx.setLineDash([]);

  ctx.fillStyle = COL.measure;
  ctx.beginPath(); ctx.arc(ax, ay, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(bx, by, 3, 0, Math.PI * 2); ctx.fill();

  // The reading goes next to the line. It was in the status bar, which is the
  // wrong place twice over: it is not where you are looking, and it shares
  // that strip with the hints, so selecting anything replaced it.
  var dx = b.x - measure.a.x, dy = b.y - measure.a.y;
  plaque(
    [t('dist') + ' ' + mm(Math.sqrt(dx * dx + dy * dy), 2) + ' mm',
     '\u0394x ' + mm(dx, 2) + '   \u0394y ' + mm(dy, 2)],
    (ax + bx) / 2 + 10, (ay + by) / 2 + 10
  );
}

function render() {
  // Until you pan or zoom, the plate stays fitted through every layout change
  // -- the window resizing, a scrollbar appearing, the panel reflowing. After
  // that the view is yours and a resize leaves it alone.
  if (syncSize() && !userAdjusted) fit();

  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.beginPath();
  ctx.rect(plot.x0, plot.y0, plot.x1 - plot.x0, plot.y1 - plot.y0);
  ctx.clip();

  drawPlate();
  drawGrid();
  drawComponents();
  drawBosses();
  drawWires();
  drawTexts();
  drawGuides();
  drawSelection();
  drawCursor();
  drawAlignHints();
  drawMeasure();

  ctx.restore();

  drawRulers();
  updateStatus();
}


/* --------------------------------------------------------------------------
   Status bar
   -------------------------------------------------------------------------- */
var cursor = null;        // world coords, or null when off the plot area
var measure = { a: null, b: null, live: null };

/* What a click on the drawing means. Two booleans were enough for one mode;
   a third would have meant remembering to turn each of the others off at
   every entry point, which is how modes quietly overlap. */
var tool = 'select';        // 'select' | 'measure' | 'wire'

function setTool(next) {
  tool = (tool === next) ? 'select' : next;
  measure.a = measure.b = measure.live = null;
  if (tool !== 'wire') cancelWire();
  if (tool !== 'select') deselect();
  measureBtn.classList.toggle('active', tool === 'measure');
  wireBtn.classList.toggle('active', tool === 'wire');
  syncControls();
  draw();
}

function updateStatus() {
  document.getElementById('curX').textContent = cursor ? mm(cursor.x, 2) : '—';
  document.getElementById('curY').textContent = cursor ? mm(cursor.y, 2) : '—';
  document.getElementById('zoomLabel').textContent =
    t('zoom') + ' ' + mm(view.scale, 2) + ' px/mm';

  var hint = document.getElementById('hint');
  if (tool === 'measure' && measure.a && !measure.b) {
    hint.textContent = t('hintMeasureEnd');
  } else if (tool === 'measure' && !measure.a) {
    hint.textContent = t('hintMeasureStart');
  } else if (drag && drag.kind === 'guide') {
    hint.textContent = t('hintGuide');
  } else if (tool === 'wire') {
    hint.textContent = t('hintWire');
  } else if (sel.kind === 'text') {
    hint.textContent = t('hintText');
  } else if (sel.kind === 'wire') {
    hint.textContent = t('hintWireSel');
  } else if (sel.kind === 'boss') {
    hint.textContent = t('hintBoss');
  } else if (hasSelection()) {
    hint.textContent = t('hintComponent');
  } else {
    hint.textContent = t('hintIdle');
  }
}


/* --------------------------------------------------------------------------
   View control
   -------------------------------------------------------------------------- */
function fit() {
  var padPx = 26;
  var availW = Math.max(40, (plot.x1 - plot.x0) - padPx * 2);
  var availH = Math.max(40, (plot.y1 - plot.y0) - padPx * 2);
  view.scale = Math.min(availW / doc.plate.w, availH / doc.plate.h);
  // Centre the plate: put its middle at the middle of the plot area.
  view.x0 = doc.plate.w / 2 - (plot.x1 - plot.x0) / 2 / view.scale;
  view.y0 = doc.plate.h / 2 - (plot.y1 - plot.y0) / 2 / view.scale;
}

function zoomAt(px, py, factor) {
  userAdjusted = true;
  var before = { x: wx(px), y: wy(py) };
  view.scale = Math.max(0.4, Math.min(80, view.scale * factor));
  // Keep the world point under the pointer exactly where it was.
  view.x0 = before.x - (px - plot.x0) / view.scale;
  view.y0 = before.y - (plot.y1 - py) / view.scale;
  draw();
}


/* --------------------------------------------------------------------------
   Pointer handling
   -------------------------------------------------------------------------- */
var drag = null;
var userAdjusted = false; // has the user taken control of the view?
var pointers = {};        // active pointers, for pinch
var pinchStart = null;

function localPoint(e) {
  var r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function zoneOf(p) {
  if (p.x < RULER && p.y < RULER) return 'corner';
  if (p.y < RULER) return 'rulerTop';
  if (p.x < RULER) return 'rulerLeft';
  return 'plot';
}

function guideAt(p) {
  var tol = 4;
  for (var i = 0; i < doc.guides.length; i++) {
    var g = doc.guides[i];
    if (g.axis === 'x' && Math.abs(sx(g.v) - p.x) <= tol) return g;
    if (g.axis === 'y' && Math.abs(sy(g.v) - p.y) <= tol) return g;
  }
  return null;
}

cv.addEventListener('pointerdown', function (e) {
  // Capture keeps a drag alive when the pointer leaves the canvas. It is a
  // convenience, not a requirement -- but an exception here would abort the
  // whole handler and the gesture would do nothing at all, which looks
  // exactly like the tool being broken.
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* carry on */ }
  pointers[e.pointerId] = localPoint(e);

  var ids = Object.keys(pointers);
  if (ids.length === 2) {
    var a = pointers[ids[0]], b = pointers[ids[1]];
    pinchStart = { dist: Math.hypot(a.x - b.x, a.y - b.y), scale: view.scale };
    drag = null;
    return;
  }

  var p = localPoint(e);
  var zone = zoneOf(p);

  if (zone === 'rulerTop') {
    // Dragging down from the top ruler produces a horizontal guide: one
    // constant Y. Same convention as every drawing program.
    var gy = { axis: 'y', v: snap(wy(p.y)) };
    doc.guides.push(gy);
    drag = { kind: 'guide', guide: gy };
  } else if (zone === 'rulerLeft') {
    var gx = { axis: 'x', v: snap(wx(p.x)) };
    doc.guides.push(gx);
    drag = { kind: 'guide', guide: gx };
  } else if (zone === 'plot') {
    if (tool === 'wire') {
      if (!wireDraw) startWire(wx(p.x), wy(p.y));
      else addWirePoint(wx(p.x), wy(p.y));
      syncControls();
      scheduleSave();
      draw();
      return;
    }

    if (tool === 'measure') {
      if (!measure.a || measure.b) {
        measure.a = { x: snap(wx(p.x)), y: snap(wy(p.y)) };
        measure.b = null;
      } else {
        measure.b = { x: snap(wx(p.x)), y: snap(wy(p.y)) };
      }
      draw();
      return;
    }
    // Order matters: a resize grip sits on top of its own component, and a
    // component may sit on top of a guide. Pick the smallest target first.
    var vtx = wireVertexAt(p);
    if (vtx) {
      snapshot();
      drag = { kind: 'moveVertex', id: vtx.wire.id, index: vtx.index };
      draw();
      return;
    }

    var grip = handleAt(p);
    if (grip) {
      var sel = selectedComponent();
      snapshot();
      drag = {
        kind: 'resize', grip: grip, id: sel.id,
        at: sel.at.slice(), size: sel.size.slice()
      };
      draw();
      return;
    }

    // Bosses are picked before components. A boss usually sits on top of the
    // component it holds down, and the small target has to win or it can never
    // be clicked at all.
    var onText = textAt(p);
    if (onText) {
      select('text', onText.id);
      snapshot();
      drag = { kind: 'moveText', id: onText.id, from: p, at: onText.at.slice() };
      syncControls();
      draw();
      return;
    }

    var onWire = wireAt(p);
    if (onWire && !bossAt(p)) {
      select('wire', onWire.id);
      syncControls();
      draw();
      return;
    }

    var boss = bossAt(p);
    if (boss) {
      select('boss', boss.id);
      snapshot();
      drag = { kind: 'moveBoss', id: boss.id, from: p, at: boss.at.slice() };
      syncControls();
      draw();
      return;
    }

    var comp = componentAt(p);
    if (comp) {
      select('component', comp.id);
      snapshot();
      drag = {
        kind: 'move', id: comp.id, from: p, at: comp.at.slice(),
        // Bosses that belong to this component travel with it.
        carried: carriedBosses(comp.id),
        carriedPts: carriedPoints(comp.id)
      };
      syncControls();
      draw();
      return;
    }

    var hit = guideAt(p);
    if (hit) {
      snapshot();
      drag = { kind: 'guide', guide: hit };
    } else {
      deselect();
      syncControls();
      drag = { kind: 'pan', from: p, x0: view.x0, y0: view.y0 };
    }
  }
  draw();
});

cv.addEventListener('pointermove', function (e) {
  var p = localPoint(e);
  if (pointers[e.pointerId]) pointers[e.pointerId] = p;

  var ids = Object.keys(pointers);
  if (ids.length === 2 && pinchStart) {
    var a = pointers[ids[0]], b = pointers[ids[1]];
    var dist = Math.hypot(a.x - b.x, a.y - b.y);
    var mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (pinchStart.dist > 0) {
      var target = pinchStart.scale * (dist / pinchStart.dist);
      zoomAt(mid.x, mid.y, target / view.scale);
    }
    return;
  }

  cursor = zoneOf(p) === 'plot' ? { x: wx(p.x), y: wy(p.y) } : null;

  if (drag && drag.kind === 'move') {
    var moving = selectedComponent();
    if (moving) {
      var was0 = moving.at[0], was1 = moving.at[1];
      moving.at[0] = snap(drag.at[0] + (p.x - drag.from.x) / view.scale);
      moving.at[1] = snap(drag.at[1] - (p.y - drag.from.y) / view.scale);
      shiftBosses(drag.carried, moving.at[0] - was0, moving.at[1] - was1);
      shiftPoints(drag.carriedPts, moving.at[0] - was0, moving.at[1] - was1);
      syncControls();
      scheduleSave();
    }
  } else if (drag && drag.kind === 'moveVertex') {
    var vw = findIn(doc.wires, drag.id);
    if (vw && vw.path[drag.index]) {
      var prev = vw.path[drag.index - 1];
      var raw = [wx(p.x), wy(p.y)];
      // A vertex being dragged squares up against its neighbour, the same way
      // it would have if it had been placed there in the first place.
      var placed = prev ? snapAngle(prev.at, raw[0], raw[1]) : [snap(raw[0]), snap(raw[1])];
      var a = anchorFor(placed[0], placed[1]);
      if (a) { vw.path[drag.index] = { at: a.at, of: a.of }; }
      else { vw.path[drag.index] = { at: placed }; }
      syncControls();
      scheduleSave();
    }
  } else if (drag && drag.kind === 'moveText') {
    var mt = selectedText();
    if (mt) {
      mt.at = [snap(drag.at[0] + (p.x - drag.from.x) / view.scale),
               snap(drag.at[1] - (p.y - drag.from.y) / view.scale)];
      syncControls();
      scheduleSave();
    }
  } else if (drag && drag.kind === 'moveBoss') {
    var mb = selectedBoss();
    if (mb) {
      mb.at = alignBoss(mb,
        drag.at[0] + (p.x - drag.from.x) / view.scale,
        drag.at[1] - (p.y - drag.from.y) / view.scale);
      syncControls();
      scheduleSave();
    }
  } else if (drag && drag.kind === 'resize') {
    resizeTo(p);
  } else if (drag && drag.kind === 'guide') {
    drag.guide.v = snap(drag.guide.axis === 'x' ? wx(p.x) : wy(p.y));
    scheduleSave();
  } else if (drag && drag.kind === 'pan') {
    userAdjusted = true;
    view.x0 = drag.x0 - (p.x - drag.from.x) / view.scale;
    view.y0 = drag.y0 + (p.y - drag.from.y) / view.scale;
  } else if (wireDraw) {
    var dw = drawingWire();
    if (dw && dw.path.length) {
      wireDraw.live = snapAngle(dw.path[dw.path.length - 1].at, wx(p.x), wy(p.y));
    }
  } else if (tool === 'measure' && measure.a && !measure.b) {
    measure.live = { x: snap(wx(p.x)), y: snap(wy(p.y)) };
  } else {
    var grip = handleAt(p);
    if (grip) cv.style.cursor = gripCursor(grip.id);
    else if (bossAt(p) || textAt(p) || componentAt(p) || guideAt(p)) cv.style.cursor = 'move';
    else cv.style.cursor = 'default';
  }
  draw();
});

function endPointer(e) {
  delete pointers[e.pointerId];
  if (Object.keys(pointers).length < 2) pinchStart = null;

  if (drag && drag.kind === 'guide') {
    // Dropped back over its own ruler: the standard way to throw a guide away.
    var p = localPoint(e);
    var zone = zoneOf(p);
    var onItsRuler = (drag.guide.axis === 'x' && zone === 'rulerLeft')
                  || (drag.guide.axis === 'y' && zone === 'rulerTop');
    if (onItsRuler || zone === 'corner') removeGuide(drag.guide);
  }
  drag = null;
  alignHints = [];
  draw();
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

cv.addEventListener('pointerleave', function () {
  cursor = null;
  draw();
});

cv.addEventListener('dblclick', function (e) {
  if (wireDraw) {
    var w = drawingWire();
    // The second click of the double already placed a point on top of the
    // first one's; drop it rather than leaving a zero-length segment.
    if (w && w.path.length > 2) {
      var a = w.path[w.path.length - 1].at, b = w.path[w.path.length - 2].at;
      if (Math.abs(a[0] - b[0]) < 1e-9 && Math.abs(a[1] - b[1]) < 1e-9) w.path.pop();
    }
    finishWire();
    draw();
    return;
  }
  var g = guideAt(localPoint(e));
  if (g) { removeGuide(g); draw(); }
});

cv.addEventListener('wheel', function (e) {
  e.preventDefault();
  var p = localPoint(e);
  zoomAt(p.x, p.y, e.deltaY < 0 ? 1.12 : 1 / 1.12);
}, { passive: false });

/* --------------------------------------------------------------------------
   Drawing a wire
   --------------------------------------------------------------------------
   Click to place a point, double-click to finish, Escape to abandon.

   Between clicks the next point is pulled onto a horizontal, a vertical or a
   45-degree diagonal from the point before it, because that is what wiring
   actually looks like when it is done tidily -- and because a run that is one
   degree off square is invisible on screen and obvious on the plate.

   The angle snap is checked BEFORE the grid, then the result is re-snapped
   along the locked axis. Doing it the other way round lets the grid pull a
   point a fraction off the line it was just locked to.
   -------------------------------------------------------------------------- */
var ANGLE_TOL_PX = 10;
var wireDraw = null;    // { wire: <wire>, live: [x,y] } while drawing

function snapAngle(from, x, y) {
  var tol = ANGLE_TOL_PX / view.scale;
  var dx = x - from[0], dy = y - from[1];

  if (Math.abs(dx) <= tol && Math.abs(dy) <= tol) return [from[0], from[1]];
  if (Math.abs(dx) <= tol) return [from[0], snap(y)];
  if (Math.abs(dy) <= tol) return [snap(x), from[1]];

  if (Math.abs(Math.abs(dx) - Math.abs(dy)) <= tol) {
    // Lock to 45 degrees by taking the longer run and mirroring it.
    var run = snap(Math.max(Math.abs(dx), Math.abs(dy)));
    return [from[0] + (dx < 0 ? -run : run), from[1] + (dy < 0 ? -run : run)];
  }
  return [snap(x), snap(y)];
}

/* Where a wire meets a component: the nearest point on its outline. Starting
   or ending a run on a board should attach to the board, so that moving the
   board later takes the wire with it rather than stranding it. */
function anchorFor(x, y) {
  var best = null;
  for (var i = 0; i < doc.components.length; i++) {
    var c = doc.components[i];
    var x0 = c.at[0], y0 = c.at[1], x1 = x0 + c.size[0], y1 = y0 + c.size[1];
    if (x < x0 || x > x1 || y < y0 || y > y1) continue;

    // Inside it: push out to whichever edge is closest.
    var dl = x - x0, dr = x1 - x, db = y - y0, dt = y1 - y;
    var m = Math.min(dl, dr, db, dt);
    var at = (m === dl) ? [x0, y] : (m === dr) ? [x1, y] : (m === db) ? [x, y0] : [x, y1];
    if (!best || m < best.d) best = { d: m, of: c.id, at: at };
  }
  return best ? { of: best.of, at: [snap(best.at[0]), snap(best.at[1])] } : null;
}

function startWire(x, y) {
  snapshot();
  var taken = {};
  var i;
  for (i = 0; i < doc.components.length; i++) taken[doc.components[i].id] = true;
  for (i = 0; i < doc.bosses.length; i++) taken[doc.bosses[i].id] = true;
  for (i = 0; i < doc.wires.length; i++) taken[doc.wires[i].id] = true;

  var w = normWire({ colour: WIRE_PALETTE[doc.wires.length % WIRE_PALETTE.length] },
                   taken, makeIdSet(doc.components));
  var a = anchorFor(x, y);
  w.path = [a ? { at: a.at, of: a.of } : { at: [snap(x), snap(y)] }];
  doc.wires.push(w);
  wireDraw = { id: w.id, live: w.path[0].at.slice() };
  select('wire', w.id);
}

function addWirePoint(x, y) {
  var w = drawingWire();
  if (!w) return;
  var last = w.path[w.path.length - 1].at;
  var pt = snapAngle(last, x, y);
  if (Math.abs(pt[0] - last[0]) < 1e-9 && Math.abs(pt[1] - last[1]) < 1e-9) return;

  var a = anchorFor(pt[0], pt[1]);
  w.path.push(a ? { at: a.at, of: a.of } : { at: pt });
}

function drawingWire() {
  return wireDraw ? findIn(doc.wires, wireDraw.id) : null;
}

/* A wire needs two points to be a wire. One point is an abandoned gesture, so
   finishing on one throws it away rather than leaving a dot on the plate. */
function finishWire() {
  var w = drawingWire();
  wireDraw = null;
  if (!w) return;
  if (w.path.length < 2) {
    doc.wires.splice(doc.wires.indexOf(w), 1);
    deselect();
  }
  syncControls();
  scheduleSave();
}

function cancelWire() {
  var w = drawingWire();
  wireDraw = null;
  if (w) {
    doc.wires.splice(doc.wires.indexOf(w), 1);
    deselect();
  }
}

/* Snap a dragged boss onto the centre line of a boss holding the same thing.

   Mounting holes on one board are a pattern -- a rectangle, a row -- so a new
   hole almost always shares an X or a Y with one already placed. Holes on a
   DIFFERENT component share nothing, which is why `of` has to match: bosses
   under the ESP32 must not drag on bosses under the buzzer. Free-standing
   bosses form their own group, since scattered ones still want to line up.

   Three things this gets right that a naive version would not:

   - The tolerance is in SCREEN pixels, converted to mm here. In mm it would
     feel sticky zoomed in and be unreachable zoomed out.
   - Alignment beats the grid. Snapping to a sibling's X only to have a 1 mm
     grid pull you straight back off it would make the feature useless.
   - The axes are independent. The fourth hole of a four-hole rectangle lines
     up with one sibling across and a different one down, so both can snap at
     once and both say so.
*/
var ALIGN_TOL_PX = 6;

function alignBoss(boss, x, y) {
  alignHints = [];
  if (!alignSnap) return [snap(x), snap(y)];

  var tol = ALIGN_TOL_PX / view.scale;
  var bestX = null, bestY = null;

  for (var i = 0; i < doc.bosses.length; i++) {
    var o = doc.bosses[i];
    if (o === boss || o.of !== boss.of) continue;

    var dx = Math.abs(o.at[0] - x);
    if (dx <= tol) {
      // Closest alignment wins; among equals, the nearest sibling, because
      // that is the spacing you are actually setting.
      var awayX = Math.abs(o.at[1] - y);
      if (!bestX || dx < bestX.d - 1e-9 || (Math.abs(dx - bestX.d) < 1e-9 && awayX < bestX.away)) {
        bestX = { o: o, d: dx, away: awayX };
      }
    }

    var dy = Math.abs(o.at[1] - y);
    if (dy <= tol) {
      var awayY = Math.abs(o.at[0] - x);
      if (!bestY || dy < bestY.d - 1e-9 || (Math.abs(dy - bestY.d) < 1e-9 && awayY < bestY.away)) {
        bestY = { o: o, d: dy, away: awayY };
      }
    }
  }

  var outX = bestX ? bestX.o.at[0] : snap(x);
  var outY = bestY ? bestY.o.at[1] : snap(y);

  if (bestX) alignHints.push({ from: [outX, outY], to: bestX.o.at.slice() });
  if (bestY) alignHints.push({ from: [outX, outY], to: bestY.o.at.slice() });

  return [outX, outY];
}

/* Bosses belonging to a component, captured at the start of a drag so the
   list is not rebuilt on every pointer move. */
function carriedBosses(componentId) {
  var out = [];
  for (var i = 0; i < doc.bosses.length; i++) {
    if (doc.bosses[i].of === componentId) out.push(doc.bosses[i]);
  }
  return out;
}

function shiftBosses(list, dx, dy) {
  if (!list || (!dx && !dy)) return;
  for (var i = 0; i < list.length; i++) {
    list[i].at[0] += dx;
    list[i].at[1] += dy;
  }
}

/* Wire ends attached to a component, captured when its drag starts. */
function carriedPoints(componentId) {
  var out = [];
  for (var i = 0; i < doc.wires.length; i++) {
    var path = doc.wires[i].path;
    for (var k = 0; k < path.length; k++) {
      if (path[k].of === componentId) out.push(path[k]);
    }
  }
  return out;
}

function shiftPoints(list, dx, dy) {
  if (!list || (!dx && !dy)) return;
  for (var i = 0; i < list.length; i++) {
    list[i].at[0] += dx;
    list[i].at[1] += dy;
  }
}

/* An attached boss is as tall as the standoff of the component it holds.
   Called wherever either number could have changed. */
function syncBossHeights() {
  for (var i = 0; i < doc.bosses.length; i++) {
    var b = doc.bosses[i];
    if (!b.of) continue;
    var c = findIn(doc.components, b.of);
    if (c) b.height = c.standoff;
  }
}

var CURSORS = {
  n: 'ns-resize', s: 'ns-resize', e: 'ew-resize', w: 'ew-resize',
  ne: 'nesw-resize', sw: 'nesw-resize', nw: 'nwse-resize', se: 'nwse-resize'
};
function gripCursor(id) { return CURSORS[id] || 'move'; }

/* Drag one edge (or two, at a corner) and leave the opposite edge where it is.
   The grip carries ex/ey: -1 moves the low edge, +1 the high edge, 0 leaves
   that axis alone. The dragged edge snaps to the grid -- not the size -- so a
   component you line up against a guide stays lined up against it. */
function resizeTo(p) {
  var c = selectedComponent();
  if (!c) return;
  var g = drag.grip;

  var lo = [drag.at[0], drag.at[1]];
  var hi = [drag.at[0] + drag.size[0], drag.at[1] + drag.size[1]];
  var world = [snap(wx(p.x)), snap(wy(p.y))];
  var e = [g.ex, g.ey];

  for (var a = 0; a < 2; a++) {
    if (e[a] < 0) lo[a] = Math.min(world[a], hi[a] - MIN_COMP);
    else if (e[a] > 0) hi[a] = Math.max(world[a], lo[a] + MIN_COMP);
  }

  c.at = [lo[0], lo[1]];
  c.size = [hi[0] - lo[0], hi[1] - lo[1]];
  syncControls();
  scheduleSave();
}

function removeGuide(g) {
  var i = doc.guides.indexOf(g);
  if (i >= 0) doc.guides.splice(i, 1);
}

function typingInAField(e) {
  var tag = (e.target && e.target.tagName) || '';
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
}

window.addEventListener('keydown', function (e) {
  var mod = e.ctrlKey || e.metaKey;

  if (mod && (e.key === 'z' || e.key === 'Z')) {
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
    return;
  }
  if (mod && (e.key === 'y' || e.key === 'Y')) {
    e.preventDefault();
    redo();
    return;
  }

  if (e.key === 'Escape') {
    measure.a = measure.b = measure.live = null;
    if (tool !== 'select') setTool('select');
    deselect();
    syncControls();
    draw();
    return;
  }

  // Delete only bites on the canvas. In a text box it is just a backspace.
  if ((e.key === 'Delete' || e.key === 'Backspace') && !typingInAField(e)) {
    e.preventDefault();
    deleteSelected();
  }
});


/* --------------------------------------------------------------------------
   Controls
   -------------------------------------------------------------------------- */
function num(el, fallback) {
  var v = parseFloat(el.value);      // always a decimal point, never a comma
  return isFinite(v) ? v : fallback;
}

var plateW = document.getElementById('plateW');
var plateH = document.getElementById('plateH');
var plateT = document.getElementById('plateT');

function readPlate() {
  doc.plate.w = Math.max(10, num(plateW, doc.plate.w));
  doc.plate.h = Math.max(10, num(plateH, doc.plate.h));
  doc.plate.thickness = Math.max(1, num(plateT, doc.plate.thickness));
  if (!userAdjusted) fit();
  scheduleSave();
  draw();
}
plateW.addEventListener('input', readPlate);
plateH.addEventListener('input', readPlate);
plateT.addEventListener('input', readPlate);

var gridSel = document.getElementById('gridSel');
gridSel.addEventListener('change', function () {
  gridPitch = parseFloat(gridSel.value) || 0;
  store.set('gridPitch', gridPitch);
  draw();
});

document.getElementById('fitBtn').onclick = function () {
  userAdjusted = false;   // hand the view back, so it tracks layout again
  fit();
  draw();
};

var measureBtn = document.getElementById('measureBtn');
measureBtn.onclick = function () { setTool('measure'); };
wireBtn.onclick = function () { setTool('wire'); };

var dimsBtn = document.getElementById('dimsBtn');
dimsBtn.onclick = function () {
  showDims = !showDims;
  dimsBtn.classList.toggle('active', showDims);
  store.set('showDims', showDims);
  draw();
};

var alignBtn = document.getElementById('alignBtn');
alignBtn.onclick = function () {
  alignSnap = !alignSnap;
  alignBtn.classList.toggle('active', alignSnap);
  store.set('alignSnap', alignSnap);
  draw();
};

var crosshairBtn = document.getElementById('crosshairBtn');
crosshairBtn.onclick = function () {
  crosshair = !crosshair;
  crosshairBtn.classList.toggle('active', crosshair);
  store.set('crosshair', crosshair);
  draw();
};

document.getElementById('clearGuidesBtn').onclick = function () {
  if (!doc.guides.length) return;
  snapshot();
  doc.guides.length = 0;
  scheduleSave();
  draw();
};


/* --------------------------------------------------------------------------
   The project panel, the component panel, and the file
   -------------------------------------------------------------------------- */
var docName = document.getElementById('docName');
var compFields = document.getElementById('compFields');
var compEmpty = document.getElementById('compEmpty');
var F = {
  name: document.getElementById('compName'),
  x: document.getElementById('compX'),
  y: document.getElementById('compY'),
  w: document.getElementById('compW'),
  h: document.getElementById('compH'),
  standoff: document.getElementById('compStandoff'),
  board: document.getElementById('compBoard'),
  body: document.getElementById('compBody'),
  colour: document.getElementById('compColour')
};

/* Push the document into the controls. Called after anything that changes the
   document from outside the panel -- a drag, an undo, opening a file -- so the
   numbers you read are always the numbers the drawing is using. */
var syncing = false;
function syncControls() {
  syncing = true;

  docName.value = doc.name;
  plateW.value = doc.plate.w;
  plateH.value = doc.plate.h;
  plateT.value = doc.plate.thickness;

  var c = selectedComponent();
  compFields.hidden = !c;
  compEmpty.hidden = !!c;
  syncBossControls();
  syncWireControls();
  syncTextControls();
  if (c) {
    F.name.value = c.name;
    F.x.value = round2(c.at[0]);
    F.y.value = round2(c.at[1]);
    F.w.value = round2(c.size[0]);
    F.h.value = round2(c.size[1]);
    F.standoff.value = c.standoff;
    F.board.value = c.board;
    F.body.value = c.body;
    F.colour.value = c.colour;
  }

  syncing = false;
  if (typeof syncExport === 'function') syncExport();
}

/* Number inputs show a rounded value, but the drawing keeps full precision --
   so writing the box back into the document on every sync would quietly round
   a 43.75 you typed down to 43.75 and a dragged 12.3333 to 12.33. Rounding
   only on display keeps the document honest. */
function round2(v) { return Math.round(v * 100) / 100; }

function onCompField() {
  if (syncing) return;
  var c = selectedComponent();
  if (!c) return;
  c.name = F.name.value.slice(0, 40);
  c.at = [num(F.x, c.at[0]), num(F.y, c.at[1])];
  c.size = [Math.max(MIN_COMP, num(F.w, c.size[0])), Math.max(MIN_COMP, num(F.h, c.size[1]))];
  c.standoff = Math.max(0, num(F.standoff, c.standoff));
  c.board = Math.max(0, num(F.board, c.board));
  c.body = Math.max(0, num(F.body, c.body));
  c.colour = colourOr(F.colour.value, c.colour);
  syncBossHeights();
  scheduleSave();
  draw();
}

for (var fieldKey in F) {
  if (Object.prototype.hasOwnProperty.call(F, fieldKey)) {
    F[fieldKey].addEventListener('input', onCompField);
  }
}

// Typing in a box is one undoable act, not one per keystroke.
for (var focusKey in F) {
  if (Object.prototype.hasOwnProperty.call(F, focusKey)) {
    F[focusKey].addEventListener('focus', snapshot);
  }
}

docName.addEventListener('input', function () {
  if (syncing) return;
  doc.name = docName.value.slice(0, 60);
  scheduleSave();
});
docName.addEventListener('focus', snapshot);

/* A new component lands in the middle of what you are looking at, at a size
   you will immediately retype anyway -- the point is to give the calipers
   somewhere to go. */
var PALETTE = ['#4dd8ff', '#5ee88f', '#ffb648', '#ff5cd6', '#b45cff', '#ff4d5e'];

function occupied(at) {
  for (var i = 0; i < doc.components.length; i++) {
    var c = doc.components[i];
    if (Math.abs(c.at[0] - at[0]) < 0.01 && Math.abs(c.at[1] - at[1]) < 0.01) return true;
  }
  return false;
}

document.getElementById('addCompBtn').onclick = function () {
  snapshot();
  var mid = { x: wx((plot.x0 + plot.x1) / 2), y: wy((plot.y0 + plot.y1) / 2) };
  var taken = {};
  for (var i = 0; i < doc.components.length; i++) taken[doc.components[i].id] = true;
  var at = [snap(mid.x - 12.5), snap(mid.y - 10)];
  // Cascade off anything already sitting exactly there. Three components
  // stacked on the same square look like one, and only the top one can be
  // grabbed.
  var step = gridPitch ? Math.max(gridPitch, 2) : 3;
  for (var guard = 0; guard < 40 && occupied(at); guard++) {
    at = [at[0] + step, at[1] - step];
  }

  var c = normComponent({
    at: at,
    size: [25, 20],
    colour: PALETTE[doc.components.length % PALETTE.length]
  }, taken);
  doc.components.push(c);
  select('component', c.id);
  syncControls();
  scheduleSave();
  draw();
  F.name.focus();
  F.name.select();
};

document.getElementById('dupCompBtn').onclick = function () {
  var c = selectedComponent();
  if (!c) return;
  snapshot();
  var taken = {};
  for (var i = 0; i < doc.components.length; i++) taken[doc.components[i].id] = true;
  var copy = normComponent(copyInto({}, c), taken);
  copy.id = nextId(taken);
  copy.at = [snap(c.at[0] + 5), snap(c.at[1] - 5)];
  doc.components.push(copy);
  select('component', copy.id);
  syncControls();
  scheduleSave();
  draw();
};

function deleteSelected() {
  if (sel.kind === 'boss') { deleteBoss(); return; }
  if (sel.kind === 'wire') { deleteWire(); return; }
  if (sel.kind === 'text') { deleteText(); return; }
  var c = selectedComponent();
  if (!c) return;
  snapshot();
  doc.components.splice(doc.components.indexOf(c), 1);
  // Its bosses lose what they were holding; they stay, as free-standing
  // bosses, because the holes are still in the plate you are about to print.
  for (var i = 0; i < doc.bosses.length; i++) {
    if (doc.bosses[i].of === c.id) doc.bosses[i].of = null;
  }
  // Wire ends stay exactly where they are and simply stop following anything,
  // which is why the path holds world coordinates rather than local offsets.
  for (var k = 0; k < doc.wires.length; k++) {
    var path = doc.wires[k].path;
    for (var m = 0; m < path.length; m++) {
      if (path[m].of === c.id) delete path[m].of;
    }
  }
  deselect();
  syncControls();
  scheduleSave();
  draw();
}

var bossEmpty = document.getElementById('bossEmpty');

function fillSelect(el, values, labelFor, current) {
  el.innerHTML = '';
  for (var i = 0; i < values.length; i++) {
    var o = document.createElement('option');
    o.value = values[i] === null ? '' : values[i];
    o.textContent = labelFor(values[i]);
    el.appendChild(o);
  }
  el.value = current === null ? '' : current;
}

function syncBossControls() {
  var b = selectedBoss();
  bossFields.hidden = !b;
  bossEmpty.hidden = !!b;

  fillSelect(B.size, SIZES, sizeLabel, b ? b.size : 'M3');
  fillSelect(B.fixing, FIXINGS, function (f) { return t(f); }, b ? b.fixing : 'selftap');

  // "Holds" lists the components, plus nothing.
  var ids = [null];
  for (var i = 0; i < doc.components.length; i++) ids.push(doc.components[i].id);
  fillSelect(B.of, ids, function (id) {
    if (id === null) return t('bossNone');

    B.y.value = round2(b.at[1]);

    profHole.value = round2(holeDia(b));

/* A new boss lands on the selected component if there is one -- that is what
