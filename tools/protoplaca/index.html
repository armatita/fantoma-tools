<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Protoplaca</title>
<meta name="description" content="Design a printed plate that replaces a breadboard: components, bosses and wire retainers.">
<meta name="theme-color" content="#0d0d12">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: #0d0d12;
    color: #f4f4f2;
    font-family: 'Courier New', ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex;
    justify-content: center;
    padding: 18px 14px 40px;
  }
  .wrap { width: 100%; max-width: 1180px; }

  h1 {
    font-size: 15px; font-weight: 700; letter-spacing: 0.08em;
    margin: 0; text-transform: uppercase; color: #4dd8ff; display: inline-block;
  }
  .headrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .sub { font-size: 11px; color: #6b6b76; margin: 4px 0 14px; }

  .cols { display: block; }
  @media (min-width: 880px) {
    .cols { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 18px; align-items: start; }
  }

  /* The canvas draws its own rulers, so there is nothing to keep in sync
     with a separate element -- the ruler strips are just an inset of the
     same drawing surface. */
  #stage {
    position: relative; width: 100%; height: 62vh; min-height: 380px;
    border: 1px solid #2b2b36; border-radius: 8px; overflow: hidden;
    background: #14141a; touch-action: none; user-select: none;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }

  .statusbar {
    display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center;
    font-size: 11px; color: #9a9aa4; margin-top: 8px; min-height: 18px;
  }
  .statusbar b { color: #f4f4f2; font-weight: 400; }
  .statusbar .sep { color: #2b2b36; }
  .statusbar .hint { color: #6b6b76; }

  .panel { border: 1px solid #2b2b36; border-radius: 8px; padding: 12px; margin-top: 14px; }
  @media (min-width: 880px) { .panel:first-child { margin-top: 0; } }
  .panel h2 {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: #4dd8ff; margin: 0 0 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; cursor: pointer; user-select: none;
  }
  .panel h2:focus-visible { outline: 1px solid #4dd8ff; outline-offset: 3px; }
  .panel h2 .chev {
    font-size: 9px; color: #6b6b76; transition: transform 0.15s ease;
  }
  .panel.closed h2 { margin-bottom: 0; }
  .panel.closed .pbody { display: none; }
  .panel.closed h2 .chev { transform: rotate(-90deg); }
  .field { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: #9a9aa4; }
  .field label { flex: 1; }
  .field input[type=number], .field select {
    width: 92px; background: #17171f; border: 1px solid #2b2b36; border-radius: 6px;
    color: #f4f4f2; padding: 6px 8px; font-size: 12px; font-family: inherit;
  }
  .field select { width: 150px; }   /* fits "Heat-set insert" and "Inserto térmico" */
  .field input[type=text] { width: 120px; }
  .field input[type=color] {
    width: 44px; height: 28px; padding: 2px; background: #17171f;
    border: 1px solid #2b2b36; border-radius: 6px; cursor: pointer;
  }
  .field .unit { color: #6b6b76; width: 18px; }
  /* A field whose value is derived from somewhere else should look as though
     it cannot be typed in, not merely refuse to be typed in. */
  .field input:disabled { opacity: 0.45; cursor: not-allowed; }
  .field.narrow input[type=number] { width: 70px; }

  .row { display: flex; gap: 6px; margin-top: 10px; }
  button {
    border: 1px solid #2b2b36; background: #17171f; color: #f4f4f2;
    border-radius: 6px; padding: 7px 10px; font-size: 12px; letter-spacing: 0.03em;
    cursor: pointer; font-family: inherit; flex: 1;
  }
  button:active { transform: translateY(1px); }
  button.active { background: #4dd8ff; color: #0d0d12; border-color: #4dd8ff; }

  /* The things you reach for while drawing live above the drawing, where
     taking one does not cost you sight of it. */
  .toolbar { display: flex; gap: 4px; align-items: center; margin-bottom: 6px; }
  .toolbar .tool {
    flex: 0 0 auto; width: 32px; height: 32px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .toolbar .tool svg { width: 18px; height: 18px; display: block; }
  .toolbar .tool.active { background: #4dd8ff; color: #0d0d12; border-color: #4dd8ff; }
  .toolbar .gap { width: 1px; height: 20px; background: #2b2b36; margin: 0 5px; }

  .langswitch { display: flex; gap: 4px; }
  .langswitch button { padding: 4px 8px; font-size: 10px; flex: 0 0 auto; letter-spacing: 0.1em; }

  .note { font-size: 11px; color: #6b6b76; line-height: 1.55; margin-top: 10px; }
  /* A note explains; a warning says the output is not what you asked for.
     They should not look the same. */
  .src { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
  .src.measured { color: #5ee88f; }
  .src.standard { color: #9a9aa4; }
  .src.assumed  { color: #ffb648; }

  .note.warn {
    color: #ffb648; border-left: 2px solid #ffb648; padding-left: 8px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="headrow">
    <h1>Protoplaca</h1>
    <div class="langswitch">
      <button type="button" id="langEn">EN</button>
      <button type="button" id="langPt">PT</button>
    </div>
  </div>
  <div class="sub" id="subtitle"></div>

  <div class="cols">
    <div>
      <div class="toolbar" id="toolbar">
        <button type="button" class="tool" id="fitBtn">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V3h4M17 7V3h-4M3 13v4h4M17 13v4h-4"/><rect x="7" y="7" width="6" height="6"/></svg>
        </button>
        <button type="button" class="tool" id="crosshairBtn">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5v5M10 12.5v5M2.5 10h5M12.5 10h5"/><circle cx="10" cy="10" r="2.4"/></svg>
        </button>
        <button type="button" class="tool" id="dimsBtn">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.5" width="12" height="7"/><path d="M4 14.5h12M4 13v3M16 13v3"/></svg>
        </button>
        <button type="button" class="tool" id="alignBtn">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="4.2" r="2.1"/><circle cx="10" cy="15.8" r="2.1"/><path d="M10 6.8v6.4" stroke-dasharray="2 1.6"/><path d="M5.5 4.2h2M12.5 4.2h2M5.5 15.8h2M12.5 15.8h2"/></svg>
        </button>
        <span class="gap"></span>
        <button type="button" class="tool" id="wireBtn">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15h4l3-10h4l3 5"/><circle cx="3" cy="15" r="1.6"/><circle cx="17" cy="10" r="1.6"/></svg>
        </button>
        <button type="button" class="tool" id="measureBtn">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 14.5L14.5 5.5"/><circle cx="5" cy="15" r="1.7"/><circle cx="15" cy="5" r="1.7"/></svg>
        </button>
        <button type="button" class="tool" id="clearGuidesBtn">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5h14M7.5 3v14" stroke-dasharray="2.5 2"/><path d="M12.5 12.5l4.5 4.5M17 12.5l-4.5 4.5"/></svg>
        </button>
      </div>
      <div id="stage"><canvas id="cv"></canvas></div>
      <div class="statusbar">
        <span>X <b id="curX">—</b></span>
        <span>Y <b id="curY">—</b></span>
        <span class="sep">|</span>
        <span id="zoomLabel"></span>
        <span class="sep">|</span>
        <span class="hint" id="hint"></span>
      </div>
    </div>

    <div>
      <section class="panel" id="projectPanel">
        <h2><span id="ttProject"></span></h2>
        <div class="field">
          <label for="docName" id="lbDocName"></label>
          <input type="text" id="docName" maxlength="60">
        </div>
        <div class="row">
          <button type="button" id="newBtn"></button>
          <button type="button" id="openBtn"></button>
          <button type="button" id="saveBtn"></button>
        </div>
        <div class="row">
          <button type="button" id="couponBtn"></button>
        </div>
        <div class="note" id="projectNote"></div>
      </section>

      <section class="panel" id="platePanel">
        <h2><span id="ttPlate"></span></h2>
        <div class="field">
          <label for="plateW" id="lbW"></label>
          <input type="number" id="plateW" inputmode="decimal" min="10" max="500" step="1" value="120">
          <span class="unit">mm</span>
        </div>
        <div class="field">
          <label for="plateH" id="lbH"></label>
          <input type="number" id="plateH" inputmode="decimal" min="10" max="500" step="1" value="80">
          <span class="unit">mm</span>
        </div>
        <div class="field">
          <label for="plateT" id="lbT"></label>
          <input type="number" id="plateT" inputmode="decimal" min="1" max="20" step="0.2" value="3">
          <span class="unit">mm</span>
        </div>
      </section>

      <section class="panel" id="compPanel">
        <h2><span id="ttComponents"></span></h2>
        <div class="row">
          <button type="button" id="addCompBtn"></button>
        </div>
        <div class="note" id="compEmpty"></div>
        <div id="compFields" hidden>
          <div class="field">
            <label for="compName" id="lbCompName"></label>
            <input type="text" id="compName" maxlength="40">
          </div>
          <div class="field narrow">
            <label for="compX">X</label>
            <input type="number" id="compX" inputmode="decimal" step="1">
            <span class="unit">mm</span>
          </div>
          <div class="field narrow">
            <label for="compY">Y</label>
            <input type="number" id="compY" inputmode="decimal" step="1">
            <span class="unit">mm</span>
          </div>
          <div class="field narrow">
            <label for="compW" id="lbCompW"></label>
            <input type="number" id="compW" inputmode="decimal" step="1" min="1">
            <span class="unit">mm</span>
          </div>
          <div class="field narrow">
            <label for="compH" id="lbCompH"></label>
            <input type="number" id="compH" inputmode="decimal" step="1" min="1">
            <span class="unit">mm</span>
          </div>
          <div class="field narrow">
            <label for="compStandoff" id="lbStandoff"></label>
            <input type="number" id="compStandoff" inputmode="decimal" step="0.5" min="0">
            <span class="unit">mm</span>
          </div>
          <div class="field narrow">
            <label for="compBoard" id="lbBoard"></label>
            <input type="number" id="compBoard" inputmode="decimal" step="0.1" min="0">
            <span class="unit">mm</span>
          </div>
          <div class="field narrow">
            <label for="compBody" id="lbBody"></label>
            <input type="number" id="compBody" inputmode="decimal" step="0.5" min="0">
            <span class="unit">mm</span>
          </div>
          <div class="field">
            <label for="compColour" id="lbColour"></label>
            <input type="color" id="compColour">
          </div>
          <div class="row">
            <button type="button" id="dupCompBtn"></button>
            <button type="button" id="delCompBtn"></button>
          </div>
        </div>
        <div class="note" id="compNote"></div>
      </section>

      <section class="panel" id="bossPanel">
        <h2><span id="ttBosses"></span></h2>
        <div class="row">
          <button type="button" id="addBossBtn"></button>
        </div>
        <div class="note" id="bossEmpty"></div>
        <div id="bossFields" hidden>
          <div class="field narrow">
            <label for="bossX">X</label>
            <input type="number" id="bossX" inputmode="decimal" step="1">
            <span class="unit">mm</span>
          </div>
          <div class="field narrow">
            <label for="bossY">Y</label>
            <input type="number" id="bossY" inputmode="decimal" step="1">
            <span class="unit">mm</span>
          </div>
          <div class="field">
            <label for="bossSize" id="lbBossSize"></label>
            <select id="bossSize"></select>
          </div>
          <div class="field">
            <label for="bossFixing" id="lbBossFixing"></label>
            <select id="bossFixing"></select>
          </div>
          <div class="field">
            <label for="bossOf" id="lbBossOf"></label>
            <select id="bossOf"></select>
          </div>
          <div class="field narrow">
            <label for="bossHeight" id="lbBossHeight"></label>
            <input type="number" id="bossHeight" inputmode="decimal" step="0.5" min="0.4">
            <span class="unit">mm</span>
          </div>
          <div class="note" id="bossDerived"></div>
          <div class="row">
            <button type="button" id="dupBossBtn"></button>
            <button type="button" id="delBossBtn"></button>
          </div>
        </div>
        <div class="note" id="bossNote"></div>
      </section>

      <section class="panel" id="wirePanel">
        <h2><span id="ttWires"></span></h2>
        <div class="note" id="wireEmpty"></div>
        <div id="wireFields" hidden>
          <div class="field">
            <label for="wireName" id="lbWireName"></label>
            <input type="text" id="wireName" maxlength="40">
          </div>
          <div class="field">
            <label for="wireAwg" id="lbAwg"></label>
            <select id="wireAwg"></select>
          </div>
          <div class="field narrow">
            <label for="wireOd" id="lbOd"></label>
            <input type="number" id="wireOd" inputmode="decimal" step="0.1" min="0.1">
            <span class="unit">mm</span>
          </div>
          <div class="field narrow">
            <label for="wireSlack" id="lbSlack"></label>
            <input type="number" id="wireSlack" inputmode="decimal" step="5" min="0">
            <span class="unit">mm</span>
          </div>
          <div class="field">
            <label for="wireColour" id="lbWireColour"></label>
            <input type="color" id="wireColour">
          </div>
          <div class="note" id="lengthBreakdown"></div>
          <div class="row">
            <button type="button" id="delWireBtn"></button>
          </div>
        </div>
        <div class="note" id="wireNote"></div>
      </section>

      <section class="panel" id="textPanel">
        <h2><span id="ttTexts"></span></h2>
        <div class="row">
          <button type="button" id="addTextBtn"></button>
        </div>
        <div class="note" id="textEmpty"></div>
        <div id="textFields" hidden>
          <div class="field">
            <label for="txtString" id="lbTxtString"></label>
            <input type="text" id="txtString" maxlength="40">
          </div>
          <div class="field narrow">
            <label for="txtX">X</label>
            <input type="number" id="txtX" inputmode="decimal" step="1">
            <span class="unit">mm</span>
          </div>
          <div class="field narrow">
            <label for="txtY">Y</label>
            <input type="number" id="txtY" inputmode="decimal" step="1">
            <span class="unit">mm</span>
          </div>
          <div class="field narrow">
            <label for="txtSize" id="lbTxtSize"></label>
            <input type="number" id="txtSize" inputmode="decimal" step="0.5" min="1">
            <span class="unit">mm</span>
          </div>
          <div class="field narrow">
            <label for="txtStroke" id="lbTxtStroke"></label>
            <input type="number" id="txtStroke" inputmode="decimal" step="0.1" min="0.2">
            <span class="unit">mm</span>
          </div>
          <div class="field narrow">
            <label for="txtHeight" id="lbTxtHeight"></label>
            <input type="number" id="txtHeight" inputmode="decimal" step="0.2" min="0.1">
            <span class="unit">mm</span>
          </div>
          <div class="row">
            <button type="button" id="delTextBtn"></button>
          </div>
        </div>
        <div class="note" id="textNote"></div>
      </section>

      <section class="panel" id="profilePanel">
        <h2><span id="ttProfile"></span></h2>
        <div class="field narrow">
          <label for="profWall" id="lbWall"></label>
          <input type="number" id="profWall" inputmode="decimal" step="0.1" min="0.4">
          <span class="unit">mm</span>
        </div>
        <div class="field narrow">
          <label for="profMinHole" id="lbMinHole"></label>
          <input type="number" id="profMinHole" inputmode="decimal" step="0.1" min="0.1">
          <span class="unit">mm</span>
        </div>
        <div class="field narrow">
          <label for="profHole" id="lbHoleDia"></label>
          <input type="number" id="profHole" inputmode="decimal" step="0.1" min="0.2">
          <span class="unit">mm</span>
        </div>
        <div class="field">
          <label id="lbSource"></label>
          <span class="src" id="holeSrc">—</span>
        </div>
        <div class="row">
          <button type="button" id="promoteBtn"></button>
        </div>
        <div class="note warn" id="holeSmallWarn" hidden></div>
        <div class="field">
          <label for="profSource" id="lbProfSource"></label>
        </div>
        <input type="text" id="profSource" maxlength="80" style="width:100%">
        <div class="note" id="profileNote"></div>
      </section>

      <section class="panel" id="exportPanel">
        <h2><span id="ttExport"></span></h2>
        <div class="field">
          <label id="lbTriangles"></label>
          <span class="unit" style="width:auto" id="triCount">—</span>
        </div>
        <div class="row">
          <button type="button" id="stlBtn"></button>
        </div>
        <div class="note warn" id="clearanceWarn" hidden></div>
        <div class="note warn" id="smallHoleWarn" hidden></div>
        <div class="note" id="exportNote"></div>
      </section>

      <section class="panel" id="viewPanel">
        <h2><span id="ttView"></span></h2>
        <div class="field">
          <label for="gridSel" id="lbGrid"></label>
          <select id="gridSel">
            <option value="1">1 mm</option>
            <option value="2.54">2.54 mm</option>
            <option value="5">5 mm</option>
            <option value="0" id="optNoGrid"></option>
          </select>
        </div>
        <div class="note" id="viewNote"></div>
      </section>
    </div>
  </div>

  <div id="dataPanelHost"></div>

</div>

<script src="../../shared/storage.js"></script>
<script src="../../shared/app.js"></script>
<script>
'use strict';

/* ==========================================================================
   Protoplaca — steps 1 and 2.

   The drawing surface: plate, grid, rulers, pan and zoom, guides, measuring.
   The document: components, and the .protoplaca.json file that holds them.

   Nothing generated lives here yet -- bosses are step 3 and the mesh is step
   4. See DESIGN.md for why the steps are cut this way, and for the decisions
   the code below is an implementation of rather than an argument for.
   ========================================================================== */


/* --------------------------------------------------------------------------
   Language
   --------------------------------------------------------------------------
   Every user-visible string lives here, from the first commit, because
   retrofitting i18n is miserable and doing it from the start costs nothing.
   Portuguese here is European Portuguese, not Brazilian.
   -------------------------------------------------------------------------- */
var STRINGS = {
  en: {
    subtitle: 'step 2 — components and the project file',
    project: 'Project',
    docName: 'Name',
    untitled: 'untitled',
    newDoc: 'New',
    open: 'Open',
    save: 'Save',
    projectNote: 'Kept in this browser as you work. Save to a file to keep a real '
      + 'copy, or to move the project to another machine.',
    components: 'Components',
    bosses: 'Bosses',
    wires: 'Wires',
    texts: 'Text',
    addText: 'Add text',
    txtString: 'Text',
    txtSize: 'Height',
    txtStroke: 'Pen',
    txtRaise: 'Raised',
    noText: 'Nothing selected. Add a label, or click one on the plate.',
    textNote: 'Raised lettering, drawn with a single pen stroke. Keep the pen at '
      + 'two nozzle widths or more \u2014 0.8 mm on a 0.4 mm nozzle \u2014 or it comes '
      + 'out as a broken line.',
    hintText: 'drag to move \u00b7 Delete removes it',
    wireName: 'Name',
    awg: 'AWG',
    od: 'Outside \u00f8',
    slack: 'Slack',
    noWire: 'Nothing selected. Pick the wire tool and click along the route, or '
      + 'click a wire on the plate.',
    wireNote: 'Start or end a run on a component and the wire attaches to it, so '
      + 'moving the board takes the wire with it. AWG sets a default outside '
      + 'diameter, but the jacket decides it \u2014 measure yours if it matters.',
    hintWire: 'click to place a point \u00b7 double-click to finish \u00b7 Esc to abandon',
    hintWireSel: 'drag a square to move it \u00b7 Delete removes the wire',
    lenFlat: 'flat run',
    lenClimb: 'standoff climbs',
    lenSlack: 'slack',
    lenTotal: 'at least',
    lenPending: 'Retainer climbs are not in this yet \u2014 they arrive with phase 3, '
      + 'and they can only make it longer.',
    exportTitle: 'Print',
    triangles: 'Triangles',
    downloadStl: 'Download STL',
    coupon: 'Calibration coupon',
    // One letter per fixing, in the order of FIXINGS, and the key that
    // explains them. Both are written out rather than taken from the first
    // letter of the fixing's name, which gave a row marked H against a key
    // that said I.
    couponRows: 'SHC',
    couponKey: 'S=SELF-TAP  H=HEAT-SET  C=CLEARANCE',
    couponConfirm: 'Replace the current project with a calibration coupon? '
      + 'Anything not saved to a file is lost.',
    exportNote: 'The plate and its bosses, in millimetres. Self-tapping and '
      + 'heat-set bosses get a blind hole, which is what they want; clearance '
      + 'bosses are cut through the plate so a screw can pass and take a nut.',
    clearanceWarn: 'Some clearance holes were left out: a hole has to sit '
      + 'clear of the plate edge and of every other hole, or there is not '
      + 'enough material left between them to cut.',
    meshBroken: 'The mesh did not come out closed, so nothing was exported. '
      + 'This is a bug — please report what is on the plate.',
    addBoss: 'Add boss',
