<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Protoplaca</title>
<meta name="description" content="Design a printed plate that replaces a breadboard: components, bosses and wire retainers.">
<meta name="theme-color" content="#0d0d12">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: #0d0d12;
    color: #f4f4f2;
    font-family: 'Courier New', ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex;
    justify-content: center;
    padding: 18px 14px 40px;
  }
  .wrap { width: 100%; max-width: 1180px; }

  h1 {
    font-size: 15px; font-weight: 700; letter-spacing: 0.08em;
    margin: 0; text-transform: uppercase; color: #4dd8ff; display: inline-block;
  }
  .headrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .sub { font-size: 11px; color: #6b6b76; margin: 4px 0 14px; }

  .cols { display: block; }
  @media (min-width: 880px) {
    .cols { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 18px; align-items: start; }
  }

  /* The canvas draws its own rulers, so there is nothing to keep in sync
     with a separate element -- the ruler strips are just an inset of the
     same drawing surface. */
  #stage {
    position: relative; width: 100%; height: 62vh; min-height: 380px;
    border: 1px solid #2b2b36; border-radius: 8px; overflow: hidden;
    background: #14141a; touch-action: none; user-select: none;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }

  .statusbar {
    display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center;
    font-size: 11px; color: #9a9aa4; margin-top: 8px; min-height: 18px;
  }
  .statusbar b { color: #f4f4f2; font-weight: 400; }
  .statusbar .sep { color: #2b2b36; }
  .statusbar .hint { color: #6b6b76; }

  .panel { border: 1px solid #2b2b36; border-radius: 8px; padding: 12px; margin-top: 14px; }
  @media (min-width: 880px) { .panel:first-child { margin-top: 0; } }
  .panel h2 {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: #4dd8ff; margin: 0 0 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; cursor: pointer; user-select: none;
  }
  .panel h2:focus-visible { outline: 1px solid #4dd8ff; outline-offset: 3px; }
  .panel h2 .chev {
    font-size: 9px; color: #6b6b76; transition: transform 0.15s ease;
  }
  .panel.closed h2 { margin-bottom: 0; }
  .panel.closed .pbody { display: none; }
  .panel.closed h2 .chev { transform: rotate(-90deg); }
  .field { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: #9a9aa4; }
  .field label { flex: 1; }
  .field input[type=number], .field select {
    width: 92px; background: #17171f; border: 1px solid #2b2b36; border-radius: 6px;
    color: #f4f4f2; padding: 6px 8px; font-size: 12px; font-family: inherit;
  }
  .field select { width: 110px; }
  .field input[type=text] { width: 120px; }
  .field input[type=color] {
    width: 44px; height: 28px; padding: 2px; background: #17171f;
    border: 1px solid #2b2b36; border-radius: 6px; cursor: pointer;
  }
  .field .unit { color: #6b6b76; width: 18px; }
  .field.narrow input[type=number] { width: 70px; }

  .row { display: flex; gap: 6px; margin-top: 10px; }
  button {
    border: 1px solid #2b2b36; background: #17171f; color: #f4f4f2;
    border-radius: 6px; padding: 7px 10px; font-size: 12px; letter-spacing: 0.03em;
    cursor: pointer; font-family: inherit; flex: 1;
  }
  button:active { transform: translateY(1px); }
  button.active { background: #4dd8ff; color: #0d0d12; border-color: #4dd8ff; }

  .langswitch { display: flex; gap: 4px; }
  .langswitch button { padding: 4px 8px; font-size: 10px; flex: 0 0 auto; letter-spacing: 0.1em; }

  .note { font-size: 11px; color: #6b6b76; line-height: 1.55; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="headrow">
    <h1>Protoplaca</h1>
    <div class="langswitch">
      <button type="button" id="langEn">EN</button>
      <button type="button" id="langPt">PT</button>
    </div>
  </div>
  <div class="sub" id="subtitle"></div>

  <div class="cols">
    <div>
      <div id="stage"><canvas id="cv"></canvas></div>
      <div class="statusbar">
        <span>X <b id="curX">—</b></span>
        <span>Y <b id="curY">—</b></span>
        <span class="sep">|</span>
        <span id="zoomLabel"></span>
        <span class="sep">|</span>
        <span class="hint" id="hint"></span>
      </div>
    </div>

    <div>
      <section class="panel" id="projectPanel">
        <h2><span id="ttProject"></span></h2>
        <div class="field">
          <label for="docName" id="lbDocName"></label>
          <input type="text" id="docName" maxlength="60">
        </div>
        <div class="row">
          <button type="button" id="newBtn"></button>
          <button type="button" id="openBtn"></button>
          <button type="button" id="saveBtn"></button>
        </div>
        <div class="note" id="projectNote"></div>
      </section>

      <section class="panel" id="platePanel">
        <h2><span id="ttPlate"></span></h2>
        <div class="field">
          <label for="plateW" id="lbW"></label>
          <input type="number" id="plateW" inputmode="decimal" min="10" max="500" step="1" value="120">
          <span class="unit">mm</span>
        </div>
        <div class="field">
          <label for="plateH" id="lbH"></label>
          <input type="number" id="plateH" inputmode="decimal" min="10" max="500" step="1" value="80">
          <span class="unit">mm</span>
        </div>
        <div class="field">
          <label for="plateT" id="lbT"></label>
          <input type="number" id="plateT" inputmode="decimal" min="1" max="20" step="0.2" value="3">
          <span class="unit">mm</span>
        </div>
      </section>

      <section class="panel" id="compPanel">
        <h2><span id="ttComponents"></span></h2>
        <div class="row">
          <button type="button" id="addCompBtn"></button>
        </div>
        <div class="note" id="compEmpty"></div>
        <div id="compFields" hidden>
          <div class="field">
            <label for="compName" id="lbCompName"></label>
            <input type="text" id="compName" maxlength="40">
          </div>
          <div class="field narrow">
            <label for="compX">X</label>
            <input type="number" id="compX" inputmode="decimal" step="1">
            <span class="unit">mm</span>
          </div>
          <div class="field narrow">
            <label for="compY">Y</label>
            <input type="number" id="compY" inputmode="decimal" step="1">
            <span class="unit">mm</span>
          </div>
          <div class="field narrow">
            <label for="compW" id="lbCompW"></label>
            <input type="number" id="compW" inputmode="decimal" step="1" min="1">
            <span class="unit">mm</span>
          </div>
          <div class="field narrow">
            <label for="compH" id="lbCompH"></label>
            <input type="number" id="compH" inputmode="decimal" step="1" min="1">
            <span class="unit">mm</span>
          </div>
          <div class="field narrow">
            <label for="compStandoff" id="lbStandoff"></label>
            <input type="number" id="compStandoff" inputmode="decimal" step="0.5" min="0">
            <span class="unit">mm</span>
          </div>
          <div class="field narrow">
            <label for="compBoard" id="lbBoard"></label>
            <input type="number" id="compBoard" inputmode="decimal" step="0.1" min="0">
            <span class="unit">mm</span>
          </div>
          <div class="field narrow">
            <label for="compBody" id="lbBody"></label>
            <input type="number" id="compBody" inputmode="decimal" step="0.5" min="0">
            <span class="unit">mm</span>
          </div>
          <div class="field">
            <label for="compColour" id="lbColour"></label>
            <input type="color" id="compColour">
          </div>
          <div class="row">
            <button type="button" id="dupCompBtn"></button>
            <button type="button" id="delCompBtn"></button>
          </div>
        </div>
        <div class="note" id="compNote"></div>
      </section>

      <section class="panel" id="viewPanel">
        <h2><span id="ttView"></span></h2>
        <div class="field">
          <label for="gridSel" id="lbGrid"></label>
          <select id="gridSel">
            <option value="1">1 mm</option>
            <option value="2.54">2.54 mm</option>
            <option value="5">5 mm</option>
            <option value="0" id="optNoGrid"></option>
          </select>
        </div>
        <div class="row">
          <button type="button" id="fitBtn"></button>
          <button type="button" id="measureBtn"></button>
        </div>
        <div class="row">
          <button type="button" id="crosshairBtn"></button>
          <button type="button" id="clearGuidesBtn"></button>
        </div>
        <div class="note" id="viewNote"></div>
      </section>
    </div>
  </div>

  <div id="dataPanelHost"></div>

</div>

<script src="../../shared/storage.js"></script>
<script src="../../shared/app.js"></script>
<script>
'use strict';

/* ==========================================================================
   Protoplaca — steps 1 and 2.

   The drawing surface: plate, grid, rulers, pan and zoom, guides, measuring.
   The document: components, and the .protoplaca.json file that holds them.

   Nothing generated lives here yet -- bosses are step 3 and the mesh is step
   4. See DESIGN.md for why the steps are cut this way, and for the decisions
   the code below is an implementation of rather than an argument for.
   ========================================================================== */


/* --------------------------------------------------------------------------
   Language
   --------------------------------------------------------------------------
   Every user-visible string lives here, from the first commit, because
   retrofitting i18n is miserable and doing it from the start costs nothing.
   Portuguese here is European Portuguese, not Brazilian.
   -------------------------------------------------------------------------- */
var STRINGS = {
  en: {
    subtitle: 'step 2 — components and the project file',
    project: 'Project',
    docName: 'Name',
    untitled: 'untitled',
    newDoc: 'New',
    open: 'Open',
    save: 'Save',
    projectNote: 'Kept in this browser as you work. Save to a file to keep a real '
      + 'copy, or to move the project to another machine.',
    components: 'Components',
    addComp: 'Add component',
    duplicate: 'Duplicate',
    remove: 'Delete',
    compName: 'Name',
    compW: 'Width',
    compH: 'Height',
    standoff: 'Standoff',
    board: 'Board',
    body: 'Body',
    colour: 'Colour',
    noSelection: 'Nothing selected. Add a component, or click one on the plate.',
    compNote: 'Standoff is the clear space under the board — wires run through it. '
      + 'Board is the PCB itself, body is whatever stands on top of it.',
    hintComponent: 'drag to move · corners and edges to resize · Delete removes it',
    confirmNew: 'Start a new project? Anything not saved to a file is lost.',
    errNotProject: 'That file is not a Protoplaca project.',
    newerFile: 'Saved by a newer Protoplaca. What this version does not understand '
      + 'is kept in the file, but not shown.',
    opened: 'Opened.',
    saved: 'Saved.',
    plate: 'Plate',
    width: 'Width',
    height: 'Height',
    thickness: 'Thickness',
    view: 'View',
    grid: 'Grid',
    noGrid: 'off',
    fit: 'Fit',
    measure: 'Measure',
    crosshair: 'Crosshair',
    clearGuides: 'Clear guides',
    zoom: 'Zoom',
    hintIdle: 'drag to pan · wheel to zoom · drag off a ruler for a guide',
    hintGuide: 'drop it back on the ruler to delete it',
    hintMeasureStart: 'click the first point',
    hintMeasureEnd: 'click the second point · Esc to cancel',
    viewNote: 'Origin 0,0 is the bottom-left corner of the plate. X runs right, '
      + 'Y runs up. Drag down from the top ruler or right from the left ruler '
      + 'to place a guide; double-click a guide to remove it.',
    dist: 'distance'
  },
  pt: {
    subtitle: 'passo 2 — componentes e o ficheiro do projeto',
    project: 'Projeto',
    docName: 'Nome',
    untitled: 'sem título',
    newDoc: 'Novo',
    open: 'Abrir',
    save: 'Guardar',
    projectNote: 'Fica guardado neste navegador enquanto trabalha. Guarde num '
      + 'ficheiro para ter uma cópia a sério, ou para levar o projeto para outra '
      + 'máquina.',
    components: 'Componentes',
    addComp: 'Adicionar componente',
    duplicate: 'Duplicar',
    remove: 'Apagar',
    compName: 'Nome',
    compW: 'Largura',
    compH: 'Altura',
    standoff: 'Espaçador',
    board: 'PCB',
    body: 'Corpo',
    colour: 'Cor',
    noSelection: 'Nada selecionado. Adicione um componente, ou clique num que esteja na placa.',
    compNote: 'O espaçador é o vão livre por baixo da PCB — é por aí que passam os '
      + 'fios. A PCB é a placa de circuito, o corpo é o que fica por cima dela.',
    hintComponent: 'arraste para mover · cantos e arestas para redimensionar · Delete apaga',
    confirmNew: 'Começar um projeto novo? Tudo o que não esteja guardado num ficheiro perde-se.',
    errNotProject: 'Esse ficheiro não é um projeto Protoplaca.',
    newerFile: 'Guardado por um Protoplaca mais recente. O que esta versão não '
      + 'percebe fica no ficheiro, mas não é mostrado.',
    opened: 'Aberto.',
    saved: 'Guardado.',
    plate: 'Placa',
    width: 'Largura',
    height: 'Altura',
    thickness: 'Espessura',
    view: 'Vista',
    grid: 'Grelha',
    noGrid: 'desligada',
    fit: 'Ajustar',
    measure: 'Medir',
    crosshair: 'Mira',
    clearGuides: 'Limpar guias',
    zoom: 'Ampliação',
    hintIdle: 'arraste para deslocar · roda para ampliar · arraste de uma régua para uma guia',
    hintGuide: 'largue-a sobre a régua para a apagar',
    hintMeasureStart: 'clique no primeiro ponto',
    hintMeasureEnd: 'clique no segundo ponto · Esc para cancelar',
    viewNote: 'A origem 0,0 é o canto inferior esquerdo da placa. X cresce para a '
      + 'direita, Y para cima. Arraste da régua de cima para baixo, ou da régua '
      + 'da esquerda para a direita, para colocar uma guia; duplo clique numa '
      + 'guia remove-a.',
    dist: 'distância'
  }
};

var lang = 'en';
function t(key) { return STRINGS[lang][key]; }

/* Numbers are always formatted with a decimal POINT, in both languages.
   toFixed does that regardless of locale; toLocaleString would not. */
function mm(value, places) {
  return value.toFixed(places === undefined ? 1 : places);
}


/* --------------------------------------------------------------------------
   The document, so far
   -------------------------------------------------------------------------- */
var DOC_VERSION = 1;

/* The whole project is this one object, and it is what a .protoplaca.json file
   contains. Nothing derived lives in it -- no mesh, no screen coordinates --
   so the file cannot ever disagree with itself.

   Components are a position and a size rather than an outline polygon. You
   arrive at a component by measuring a real part with calipers, and what you
   read off is a width and a height; an outline is not something anyone types.
   Outlines stay possible later for the odd L-shaped board without changing
   what is already written here. */
function blankDoc() {
  return {
    format: 'protoplaca',
    version: DOC_VERSION,
    units: 'mm',
    name: '',
    plate: { w: 120, h: 80, thickness: 3 },
    components: [],       // see normComponent for the fields
    guides: []            // { axis: 'x' | 'y', v: mm }
  };
}

var doc = blankDoc();

/* Selection is held as an id, not as a reference to the object. Undo replaces
   the whole document with a fresh parse, so any object reference kept across
   it would point at a component that is no longer in the drawing. */
var selectedId = null;

/* The grid pitch is how you are working, not what you designed, so it is a
   preference of this browser rather than part of the document. */
var gridPitch = 1;        // mm; 0 means no grid and no snapping

function selectedComponent() {
  for (var i = 0; i < doc.components.length; i++) {
    if (doc.components[i].id === selectedId) return doc.components[i];
  }
  return null;
}


/* --------------------------------------------------------------------------
   Coordinates
   --------------------------------------------------------------------------
   World coordinates are millimetres with 0,0 at the plate's bottom-left
   corner, X right and Y up — the modelling convention, chosen so the mesh
   generator never has to flip an axis. The screen has Y increasing downward,
   so the flip happens HERE and in no other place in the program. If a part
   ever comes out mirrored, these four lines are the entire suspect list.
   -------------------------------------------------------------------------- */
var RULER = 22;           // px: width of the left ruler, height of the top one

var view = { scale: 4, x0: -10, y0: -10 };   // px per mm, and the world point
                                             // at the plot area's bottom-left

var plot = { x0: RULER, y0: RULER, x1: 0, y1: 0 };   // px, filled in on resize

function sx(wx) { return plot.x0 + (wx - view.x0) * view.scale; }
function sy(wy) { return plot.y1 - (wy - view.y0) * view.scale; }
function wx(px) { return view.x0 + (px - plot.x0) / view.scale; }
function wy(py) { return view.y0 + (plot.y1 - py) / view.scale; }

function snap(value) {
  if (!gridPitch) return value;
  return Math.round(value / gridPitch) * gridPitch;
}


/* --------------------------------------------------------------------------
   Reading a document
   --------------------------------------------------------------------------
   Everything that enters the program from outside -- a file you opened, or
   what this browser remembered from last time -- comes through here first.
   Both routes use the same code, so a bug in one cannot hide in the other.

   Unknown fields are carried through untouched. A file written by a later
   version of Protoplaca will contain sections this build has never heard of;
   dropping them on load would mean that merely opening a project quietly
   destroyed part of it.
   -------------------------------------------------------------------------- */
var MIN_COMP = 1;         // mm: anything smaller is a mis-drag, not a part
var idSeq = 0;

function copyInto(target, source) {
  for (var k in source) {
    if (Object.prototype.hasOwnProperty.call(source, k)) target[k] = source[k];
  }
  return target;
}

function numOr(value, fallback, lo, hi) {
  var v = typeof value === 'number' ? value : parseFloat(value);
  if (!isFinite(v)) return fallback;
  if (lo !== undefined) v = Math.max(lo, v);
  if (hi !== undefined) v = Math.min(hi, v);
  return v;
}

function pairOr(value, fallback, lo) {
  if (!value || typeof value.length !== 'number' || value.length < 2) return fallback.slice();
  return [numOr(value[0], fallback[0], lo), numOr(value[1], fallback[1], lo)];
}

function colourOr(value, fallback) {
  return (typeof value === 'string' && /^#[0-9a-fA-F]{6}$/.test(value)) ? value : fallback;
}

function nextId(taken) {
  var id;
  do { id = 'c' + (++idSeq); } while (taken && taken[id]);
  return id;
}

function normComponent(raw, taken) {
  var c = copyInto({}, raw && typeof raw === 'object' ? raw : {});
  c.id = (typeof c.id === 'string' && c.id && !taken[c.id]) ? c.id : nextId(taken);
  taken[c.id] = true;
  c.name = typeof c.name === 'string' ? c.name.slice(0, 40) : '';
  c.at = pairOr(c.at, [0, 0]);
  c.size = pairOr(c.size, [20, 20], MIN_COMP);
  c.colour = colourOr(c.colour, '#4dd8ff');
  c.standoff = numOr(c.standoff, 6, 0, 200);    // clear space under the board
  c.board = numOr(c.board, 1.6, 0, 50);         // the PCB itself
  c.body = numOr(c.body, 10, 0, 300);           // whatever stands on top of it
  return c;
}

function normGuide(raw) {
  if (!raw || typeof raw !== 'object') return null;
  if (raw.axis !== 'x' && raw.axis !== 'y') return null;
  var v = numOr(raw.v, NaN);
  return isFinite(v) ? { axis: raw.axis, v: v } : null;
}

/* Returns { doc: <document>, newer: <bool> }, or throws with a message meant
   to be read by a person. */
function normDoc(raw) {
  if (!raw || typeof raw !== 'object' || raw.format !== 'protoplaca') {
    throw new Error(t('errNotProject'));
  }
  var out = copyInto({}, raw);
  var fileVersion = numOr(raw.version, DOC_VERSION);

  out.format = 'protoplaca';
  // Keep a newer file's own version number. This build preserved the parts it
  // did not understand, so calling the result version 1 would be a lie.
  out.version = Math.max(fileVersion, DOC_VERSION);
  out.units = 'mm';
  out.name = typeof raw.name === 'string' ? raw.name.slice(0, 60) : '';

  var rawPlate = raw.plate && typeof raw.plate === 'object' ? raw.plate : {};
  out.plate = copyInto({}, rawPlate);
  out.plate.w = numOr(rawPlate.w, 120, 10, 2000);
  out.plate.h = numOr(rawPlate.h, 80, 10, 2000);
  out.plate.thickness = numOr(rawPlate.thickness, 3, 0.4, 100);

  var taken = {};
  var list = (raw.components && raw.components.length) ? raw.components : [];
  out.components = [];
  for (var i = 0; i < list.length; i++) out.components.push(normComponent(list[i], taken));

  var gs = (raw.guides && raw.guides.length) ? raw.guides : [];
  out.guides = [];
  for (var j = 0; j < gs.length; j++) {
    var g = normGuide(gs[j]);
    if (g) out.guides.push(g);
  }

  return { doc: out, newer: fileVersion > DOC_VERSION };
}


/* --------------------------------------------------------------------------
   Undo
   --------------------------------------------------------------------------
   The document is small enough that a snapshot is just its JSON, so undo is a
   stack of strings rather than a pile of inverse operations with bugs of
   their own.

   It exists because the tool saves as you work. Without autosave a deletion
   costs nothing -- you close without saving. With it, the previous state is
   already overwritten, so undo is not a convenience here, it is the only way
   back.
   -------------------------------------------------------------------------- */
var undoStack = [];
var redoStack = [];
var UNDO_LIMIT = 60;

function snapshot() {
  undoStack.push(JSON.stringify(doc));
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack.length = 0;
}

function restore(from, to) {
  if (!from.length) return;
  to.push(JSON.stringify(doc));
  doc = JSON.parse(from.pop());
  if (!selectedComponent()) selectedId = null;
  syncControls();
  scheduleSave();
  draw();
}

function undo() { restore(undoStack, redoStack); }
function redo() { restore(redoStack, undoStack); }


/* --------------------------------------------------------------------------
   Components on the canvas
   -------------------------------------------------------------------------- */
var HANDLE = 7;           // px, square side

function withAlpha(hex, alpha) {
  var n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + alpha + ')';
}

function compRectPx(c) {
  return {
    x: sx(c.at[0]),
    y: sy(c.at[1] + c.size[1]),           // screen y of the TOP edge
    w: c.size[0] * view.scale,
    h: c.size[1] * view.scale
  };
}

/* The eight grips of a selection box, in screen pixels. Each carries which
   world edges it moves -- ex/ey of -1, 0 or 1 for the low edge, neither, or
   the high edge -- so one piece of arithmetic drives all eight. */
function handlesOf(c) {
  var r = compRectPx(c);
  var mx = r.x + r.w / 2, my = r.y + r.h / 2;
  return [
    { id: 'nw', x: r.x,       y: r.y,       ex: -1, ey:  1 },
    { id: 'n',  x: mx,        y: r.y,       ex:  0, ey:  1 },
    { id: 'ne', x: r.x + r.w, y: r.y,       ex:  1, ey:  1 },
    { id: 'e',  x: r.x + r.w, y: my,        ex:  1, ey:  0 },
    { id: 'se', x: r.x + r.w, y: r.y + r.h, ex:  1, ey: -1 },
    { id: 's',  x: mx,        y: r.y + r.h, ex:  0, ey: -1 },
    { id: 'sw', x: r.x,       y: r.y + r.h, ex: -1, ey: -1 },
    { id: 'w',  x: r.x,       y: my,        ex: -1, ey:  0 }
  ];
}

function handleAt(p) {
  var c = selectedComponent();
  if (!c) return null;
  var hs = handlesOf(c);
  for (var i = 0; i < hs.length; i++) {
    if (Math.abs(hs[i].x - p.x) <= HANDLE && Math.abs(hs[i].y - p.y) <= HANDLE) return hs[i];
  }
  return null;
}

/* Topmost first: later components are drawn on top, so they are picked first. */
function componentAt(p) {
  var x = wx(p.x), y = wy(p.y);
  for (var i = doc.components.length - 1; i >= 0; i--) {
    var c = doc.components[i];
    if (x >= c.at[0] && x <= c.at[0] + c.size[0]
     && y >= c.at[1] && y <= c.at[1] + c.size[1]) return c;
  }
  return null;
}

function drawComponents() {
  ctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (var i = 0; i < doc.components.length; i++) {
    var c = doc.components[i];
    var r = compRectPx(c);

    ctx.fillStyle = withAlpha(c.colour, 0.22);
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = c.colour;
    ctx.lineWidth = 1;
    ctx.strokeRect(crisp(r.x), crisp(r.y), Math.round(r.w), Math.round(r.h));

    if (c.name && r.w > 34 && r.h > 14) {
      ctx.fillStyle = c.colour;
      var label = c.name;
      while (label.length > 1 && ctx.measureText(label).width > r.w - 8) {
        label = label.slice(0, -1);
      }
      ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2);
    }
  }
}

function drawSelection() {
  var c = selectedComponent();
  if (!c) return;
  var r = compRectPx(c);

  ctx.strokeStyle = COL.select;
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  ctx.strokeRect(crisp(r.x), crisp(r.y), Math.round(r.w), Math.round(r.h));
  ctx.setLineDash([]);

  var hs = handlesOf(c);
  for (var i = 0; i < hs.length; i++) {
    ctx.fillStyle = COL.bg;
    ctx.fillRect(hs[i].x - HANDLE / 2, hs[i].y - HANDLE / 2, HANDLE, HANDLE);
    ctx.strokeStyle = COL.select;
    ctx.strokeRect(crisp(hs[i].x - HANDLE / 2), crisp(hs[i].y - HANDLE / 2), HANDLE, HANDLE);
  }
}


/* --------------------------------------------------------------------------
   Canvas plumbing
   -------------------------------------------------------------------------- */
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var W = 0, H = 0;         // CSS pixels
var pending = false;

function draw() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(function () { pending = false; render(); });
}

/* Match the drawing surface to the element it is drawn into. Returns true if
   anything changed.

   This is checked at the start of every render rather than only when a
   ResizeObserver fires, because those callbacks are delivered as part of a
   rendering update -- a window that is not painting can hold them back
   indefinitely, and the canvas would keep drawing at yesterday's width. The
   ruler would then be quietly wrong, which is the one thing this tool cannot
   afford. A rect read per frame is cheap; a lying ruler is not.

   The CANVAS rect, not the stage's: the stage has a 1px border and a
   scrollbar may come and go beside it, so the two boxes differ. */
function syncSize() {
  var rect = cv.getBoundingClientRect();
  var w = Math.max(1, Math.round(rect.width));
  var h = Math.max(1, Math.round(rect.height));
  if (w === W && h === H) return false;

  var dpr = window.devicePixelRatio || 1;
  W = w;
  H = h;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // draw in CSS px, render at device px
  plot.x1 = W;
  plot.y1 = H;
  return true;
}

// These only ask for a redraw; the redraw works out the new size for itself.
if (window.ResizeObserver) new ResizeObserver(draw).observe(cv);
window.addEventListener('resize', draw);


/* --------------------------------------------------------------------------
   Drawing
   -------------------------------------------------------------------------- */
var COL = {
  bg: '#14141a',
  plate: '#1e1e28',
  gridDim: 'rgba(255,255,255,0.045)',
  gridDimMajor: 'rgba(255,255,255,0.085)',
  grid: 'rgba(255,255,255,0.075)',
  gridMajor: 'rgba(255,255,255,0.16)',
  plateEdge: '#6f6f80',
  axis: '#4dd8ff',
  ruler: '#101016',
  rulerEdge: '#2b2b36',
  tick: '#4a4a58',
  label: '#8a8a96',
  guide: '#ffb648',
  measure: '#4dd8ff',
  select: '#f4f4f2',
  crosshair: 'rgba(244,244,242,0.30)'
};

/* A "nice" step is one a person reads without counting: 1, 2, 5 and their
   decades. Pick the smallest one that leaves at least minPx between lines. */
function niceStep(minPx) {
  var steps = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];
  for (var i = 0; i < steps.length; i++) {
    if (steps[i] * view.scale >= minPx) return steps[i];
  }
  return steps[steps.length - 1];
}

function line(x1, y1, x2, y2) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

/* Half-pixel offset so a 1px line lands on one row of pixels instead of
   straddling two and coming out grey and fat. */
function crisp(v) { return Math.round(v) + 0.5; }

/* Below this, grid lines are closer together than they are wide and the grid
   turns into a grey wash, so that density is dropped. 3.5px rather than a
   rounder 5: a 120mm plate fitted to a laptop window lands at about 5 px/mm,
   and a 1mm grid that disappears exactly when you first open the tool is a
   poor way to introduce it. */
var MIN_GRID_PX = 3.5;

function drawGridLines(minor, major, dimColour, majorColour) {
  var left = wx(plot.x0), right = wx(plot.x1);
  var bottom = wy(plot.y1), top = wy(plot.y0);
  var i, v;

  ctx.lineWidth = 1;

  if (minor * view.scale >= MIN_GRID_PX) {
    ctx.strokeStyle = dimColour;
    ctx.beginPath();
    for (i = Math.ceil(left / minor); i * minor <= right; i++) {
      v = crisp(sx(i * minor));
      ctx.moveTo(v, plot.y0); ctx.lineTo(v, plot.y1);
    }
    for (i = Math.ceil(bottom / minor); i * minor <= top; i++) {
      v = crisp(sy(i * minor));
      ctx.moveTo(plot.x0, v); ctx.lineTo(plot.x1, v);
    }
    ctx.stroke();
  }

  if (major * view.scale >= MIN_GRID_PX) {
    ctx.strokeStyle = majorColour;
    ctx.beginPath();
    for (i = Math.ceil(left / major); i * major <= right; i++) {
      v = crisp(sx(i * major));
      ctx.moveTo(v, plot.y0); ctx.lineTo(v, plot.y1);
    }
    for (i = Math.ceil(bottom / major); i * major <= top; i++) {
      v = crisp(sy(i * major));
      ctx.moveTo(plot.x0, v); ctx.lineTo(plot.x1, v);
    }
    ctx.stroke();
  }
}

function drawGrid() {
  var minor = gridPitch || 10;
  var major = minor * 10;

  // Dim everywhere, bright inside the plate. The plate is where the work
  // happens; outside it the grid is context, not a working surface.
  drawGridLines(minor, major, COL.gridDim, COL.gridDimMajor);

  ctx.save();
  ctx.beginPath();
  ctx.rect(plot.x0, plot.y0, plot.x1 - plot.x0, plot.y1 - plot.y0);
  ctx.clip();
  ctx.beginPath();
  ctx.rect(sx(0), sy(doc.plate.h), doc.plate.w * view.scale, doc.plate.h * view.scale);
  ctx.clip();
  drawGridLines(minor, major, COL.grid, COL.gridMajor);
  ctx.restore();
}

function drawPlate() {
  var x = sx(0), y = sy(doc.plate.h);
  var w = doc.plate.w * view.scale, h = doc.plate.h * view.scale;

  ctx.fillStyle = COL.plate;
  ctx.fillRect(x, y, w, h);

  ctx.strokeStyle = COL.plateEdge;
  ctx.lineWidth = 1;
  ctx.strokeRect(crisp(x), crisp(y), Math.round(w), Math.round(h));

  // The origin corner, marked so the coordinate convention is visible rather
  // than something you have to remember.
  ctx.strokeStyle = COL.axis;
  ctx.lineWidth = 2;
  var ox = sx(0), oy = sy(0), arm = Math.min(18, w * 0.4, h * 0.4);
  line(ox, oy, ox + arm, oy);
  line(ox, oy, ox, oy - arm);
  ctx.fillStyle = COL.axis;
  ctx.font = '10px ui-monospace, Menlo, Consolas, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('0,0', ox + 4, oy + 4);
}

function drawGuides() {
  ctx.lineWidth = 1;
  ctx.strokeStyle = COL.guide;
  ctx.setLineDash([4, 4]);
  for (var i = 0; i < doc.guides.length; i++) {
    var g = doc.guides[i];
    if (g.axis === 'x') {
      var px = crisp(sx(g.v));
      if (px >= plot.x0 && px <= plot.x1) line(px, plot.y0, px, plot.y1);
    } else {
      var py = crisp(sy(g.v));
      if (py >= plot.y0 && py <= plot.y1) line(plot.x0, py, plot.x1, py);
    }
  }
  ctx.setLineDash([]);
}

function drawRulers() {
  var step = niceStep(56);          // labelled ticks
  var minor = step / 5;
  var i, p;

  ctx.fillStyle = COL.ruler;
  ctx.fillRect(0, 0, W, RULER);
  ctx.fillRect(0, 0, RULER, H);

  ctx.strokeStyle = COL.rulerEdge;
  ctx.lineWidth = 1;
  line(0, crisp(RULER), W, crisp(RULER));
  line(crisp(RULER), 0, crisp(RULER), H);

  ctx.font = '9px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = COL.label;

  // Top ruler: X
  ctx.strokeStyle = COL.tick;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  var left = wx(plot.x0), right = wx(plot.x1);
  ctx.beginPath();
  for (i = Math.ceil(left / minor); i * minor <= right; i++) {
    p = crisp(sx(i * minor));
    ctx.moveTo(p, RULER - 4); ctx.lineTo(p, RULER);
  }
  ctx.stroke();
  for (i = Math.ceil(left / step); i * step <= right; i++) {
    p = sx(i * step);
    ctx.strokeStyle = COL.label;
    line(crisp(p), RULER - 8, crisp(p), RULER);
    ctx.fillText(mm(i * step, step < 1 ? 1 : 0), p + 3, 3);
  }

  // Left ruler: Y. Numbers increase upward, which is the whole point of
  // choosing the modelling convention — the ruler reads like a ruler.
  ctx.strokeStyle = COL.tick;
  var bottom = wy(plot.y1), top = wy(plot.y0);
  ctx.beginPath();
  for (i = Math.ceil(bottom / minor); i * minor <= top; i++) {
    p = crisp(sy(i * minor));
    ctx.moveTo(RULER - 4, p); ctx.lineTo(RULER, p);
  }
  ctx.stroke();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  for (i = Math.ceil(bottom / step); i * step <= top; i++) {
    p = sy(i * step);
    ctx.strokeStyle = COL.label;
    line(RULER - 8, crisp(p), RULER, crisp(p));
    ctx.save();
    ctx.translate(3, p - 3);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'left';
    ctx.fillText(mm(i * step, step < 1 ? 1 : 0), 0, 10);
    ctx.restore();
  }

  // Where the pointer is, marked on both rulers. The crosshair says where you
  // are; this says what that is on the scale beside it.
  if (crosshair && cursor) {
    ctx.fillStyle = COL.axis;
    var cxp = sx(cursor.x), cyp = sy(cursor.y);
    if (cxp >= RULER && cxp <= W) ctx.fillRect(Math.round(cxp) - 1, 0, 2, RULER);
    if (cyp >= RULER && cyp <= H) ctx.fillRect(0, Math.round(cyp) - 1, RULER, 2);
  }

  ctx.fillStyle = COL.ruler;
  ctx.fillRect(0, 0, RULER, RULER);
  ctx.strokeStyle = COL.rulerEdge;
  ctx.strokeRect(0.5, 0.5, RULER - 1, RULER - 1);
  ctx.fillStyle = COL.label;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('mm', RULER / 2, RULER / 2);
}

/* A small plaque of text with a dark backing, so it stays readable over the
   grid, over a component, or over nothing. */
function plaque(lines, x, y) {
  ctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';

  var padX = 6, padY = 4, lineH = 14, w = 0, i;
  for (i = 0; i < lines.length; i++) w = Math.max(w, ctx.measureText(lines[i]).width);
  var boxW = w + padX * 2, boxH = lines.length * lineH + padY * 2;

  // Keep it inside the drawing rather than half off the edge.
  x = Math.min(Math.max(x, plot.x0 + 2), plot.x1 - boxW - 2);
  y = Math.min(Math.max(y, plot.y0 + 2), plot.y1 - boxH - 2);

  ctx.fillStyle = 'rgba(13,13,18,0.88)';
  ctx.fillRect(x, y, boxW, boxH);
  ctx.strokeStyle = COL.measure;
  ctx.lineWidth = 1;
  ctx.strokeRect(crisp(x), crisp(y), Math.round(boxW), Math.round(boxH));

  ctx.fillStyle = '#f4f4f2';
  for (i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], x + padX, y + padY + i * lineH);
  }
}

/* The pointer's position, where the pointer is.

   The status bar still carries X and Y, and it stays: it is always visible and
   does not depend on the pointer being over the drawing. But it is a strip
   below the canvas, which is not where you are looking while you place a part
   -- the same complaint the measure tool earned, one layer down. With no
   component library the coordinate readout is how parts get placed, so it is
   the number read most often and it belongs under the eye. */
var crosshair = true;

function drawCursor() {
  if (!crosshair || !cursor) return;

  var px = sx(cursor.x), py = sy(cursor.y);

  ctx.strokeStyle = COL.crosshair;
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 4]);
  line(crisp(px), plot.y0, crisp(px), plot.y1);
  line(plot.x0, crisp(py), plot.x1, crisp(py));
  ctx.setLineDash([]);

  plaque(['(' + mm(cursor.x, 2) + ', ' + mm(cursor.y, 2) + ')'], px + 14, py + 14);
}

function drawMeasure() {
  if (!measure.a) return;
  var b = measure.b || measure.live;
  if (!b) return;

  var ax = sx(measure.a.x), ay = sy(measure.a.y);
  var bx = sx(b.x), by = sy(b.y);

  ctx.strokeStyle = COL.measure;
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  line(ax, ay, bx, by);
  ctx.setLineDash([]);

  ctx.fillStyle = COL.measure;
  ctx.beginPath(); ctx.arc(ax, ay, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(bx, by, 3, 0, Math.PI * 2); ctx.fill();

  // The reading goes next to the line. It was in the status bar, which is the
  // wrong place twice over: it is not where you are looking, and it shares
  // that strip with the hints, so selecting anything replaced it.
  var dx = b.x - measure.a.x, dy = b.y - measure.a.y;
  plaque(
    [t('dist') + ' ' + mm(Math.sqrt(dx * dx + dy * dy), 2) + ' mm',
     '\u0394x ' + mm(dx, 2) + '   \u0394y ' + mm(dy, 2)],
    (ax + bx) / 2 + 10, (ay + by) / 2 + 10
  );
}

function render() {
  // Until you pan or zoom, the plate stays fitted through every layout change
  // -- the window resizing, a scrollbar appearing, the panel reflowing. After
  // that the view is yours and a resize leaves it alone.
  if (syncSize() && !userAdjusted) fit();

  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.beginPath();
  ctx.rect(plot.x0, plot.y0, plot.x1 - plot.x0, plot.y1 - plot.y0);
  ctx.clip();

  drawPlate();
  drawGrid();
  drawComponents();
  drawGuides();
  drawSelection();
  drawCursor();
  drawMeasure();

  ctx.restore();

  drawRulers();
  updateStatus();
}


/* --------------------------------------------------------------------------
   Status bar
   -------------------------------------------------------------------------- */
var cursor = null;        // world coords, or null when off the plot area
var measure = { on: false, a: null, b: null, live: null };

function updateStatus() {
  document.getElementById('curX').textContent = cursor ? mm(cursor.x, 2) : '—';
  document.getElementById('curY').textContent = cursor ? mm(cursor.y, 2) : '—';
  document.getElementById('zoomLabel').textContent =
    t('zoom') + ' ' + mm(view.scale, 2) + ' px/mm';

  var hint = document.getElementById('hint');
  if (measure.on && measure.a && !measure.b) {
    hint.textContent = t('hintMeasureEnd');
  } else if (measure.on && !measure.a) {
    hint.textContent = t('hintMeasureStart');
  } else if (drag && drag.kind === 'guide') {
    hint.textContent = t('hintGuide');
  } else if (selectedId) {
    hint.textContent = t('hintComponent');
  } else {
    hint.textContent = t('hintIdle');
  }
}


/* --------------------------------------------------------------------------
   View control
   -------------------------------------------------------------------------- */
function fit() {
  var padPx = 26;
  var availW = Math.max(40, (plot.x1 - plot.x0) - padPx * 2);
  var availH = Math.max(40, (plot.y1 - plot.y0) - padPx * 2);
  view.scale = Math.min(availW / doc.plate.w, availH / doc.plate.h);
  // Centre the plate: put its middle at the middle of the plot area.
  view.x0 = doc.plate.w / 2 - (plot.x1 - plot.x0) / 2 / view.scale;
  view.y0 = doc.plate.h / 2 - (plot.y1 - plot.y0) / 2 / view.scale;
}

function zoomAt(px, py, factor) {
  userAdjusted = true;
  var before = { x: wx(px), y: wy(py) };
  view.scale = Math.max(0.4, Math.min(80, view.scale * factor));
  // Keep the world point under the pointer exactly where it was.
  view.x0 = before.x - (px - plot.x0) / view.scale;
  view.y0 = before.y - (plot.y1 - py) / view.scale;
  draw();
}


/* --------------------------------------------------------------------------
   Pointer handling
   -------------------------------------------------------------------------- */
var drag = null;
var userAdjusted = false; // has the user taken control of the view?
var pointers = {};        // active pointers, for pinch
var pinchStart = null;

function localPoint(e) {
  var r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function zoneOf(p) {
  if (p.x < RULER && p.y < RULER) return 'corner';
  if (p.y < RULER) return 'rulerTop';
  if (p.x < RULER) return 'rulerLeft';
  return 'plot';
}

function guideAt(p) {
  var tol = 4;
  for (var i = 0; i < doc.guides.length; i++) {
    var g = doc.guides[i];
    if (g.axis === 'x' && Math.abs(sx(g.v) - p.x) <= tol) return g;
    if (g.axis === 'y' && Math.abs(sy(g.v) - p.y) <= tol) return g;
  }
  return null;
}

cv.addEventListener('pointerdown', function (e) {
  // Capture keeps a drag alive when the pointer leaves the canvas. It is a
  // convenience, not a requirement -- but an exception here would abort the
  // whole handler and the gesture would do nothing at all, which looks
  // exactly like the tool being broken.
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* carry on */ }
  pointers[e.pointerId] = localPoint(e);

  var ids = Object.keys(pointers);
  if (ids.length === 2) {
    var a = pointers[ids[0]], b = pointers[ids[1]];
    pinchStart = { dist: Math.hypot(a.x - b.x, a.y - b.y), scale: view.scale };
    drag = null;
    return;
  }

  var p = localPoint(e);
  var zone = zoneOf(p);

  if (zone === 'rulerTop') {
    // Dragging down from the top ruler produces a horizontal guide: one
    // constant Y. Same convention as every drawing program.
    var gy = { axis: 'y', v: snap(wy(p.y)) };
    doc.guides.push(gy);
    drag = { kind: 'guide', guide: gy };
  } else if (zone === 'rulerLeft') {
    var gx = { axis: 'x', v: snap(wx(p.x)) };
    doc.guides.push(gx);
    drag = { kind: 'guide', guide: gx };
  } else if (zone === 'plot') {
    if (measure.on) {
      if (!measure.a || measure.b) {
        measure.a = { x: snap(wx(p.x)), y: snap(wy(p.y)) };
        measure.b = null;
      } else {
        measure.b = { x: snap(wx(p.x)), y: snap(wy(p.y)) };
      }
      draw();
      return;
    }
    // Order matters: a resize grip sits on top of its own component, and a
    // component may sit on top of a guide. Pick the smallest target first.
    var grip = handleAt(p);
    if (grip) {
      var sel = selectedComponent();
      snapshot();
      drag = {
        kind: 'resize', grip: grip, id: sel.id,
        at: sel.at.slice(), size: sel.size.slice()
      };
      draw();
      return;
    }

    var comp = componentAt(p);
    if (comp) {
      selectedId = comp.id;
      snapshot();
      drag = { kind: 'move', id: comp.id, from: p, at: comp.at.slice() };
      syncControls();
      draw();
      return;
    }

    var hit = guideAt(p);
    if (hit) {
      snapshot();
      drag = { kind: 'guide', guide: hit };
    } else {
      selectedId = null;
      syncControls();
      drag = { kind: 'pan', from: p, x0: view.x0, y0: view.y0 };
    }
  }
  draw();
});

cv.addEventListener('pointermove', function (e) {
  var p = localPoint(e);
  if (pointers[e.pointerId]) pointers[e.pointerId] = p;

  var ids = Object.keys(pointers);
  if (ids.length === 2 && pinchStart) {
    var a = pointers[ids[0]], b = pointers[ids[1]];
    var dist = Math.hypot(a.x - b.x, a.y - b.y);
    var mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (pinchStart.dist > 0) {
      var target = pinchStart.scale * (dist / pinchStart.dist);
      zoomAt(mid.x, mid.y, target / view.scale);
    }
    return;
  }

  cursor = zoneOf(p) === 'plot' ? { x: wx(p.x), y: wy(p.y) } : null;

  if (drag && drag.kind === 'move') {
    var moving = selectedComponent();
    if (moving) {
      moving.at[0] = snap(drag.at[0] + (p.x - drag.from.x) / view.scale);
      moving.at[1] = snap(drag.at[1] - (p.y - drag.from.y) / view.scale);
      syncControls();
      scheduleSave();
    }
  } else if (drag && drag.kind === 'resize') {
    resizeTo(p);
  } else if (drag && drag.kind === 'guide') {
    drag.guide.v = snap(drag.guide.axis === 'x' ? wx(p.x) : wy(p.y));
    scheduleSave();
  } else if (drag && drag.kind === 'pan') {
    userAdjusted = true;
    view.x0 = drag.x0 - (p.x - drag.from.x) / view.scale;
    view.y0 = drag.y0 + (p.y - drag.from.y) / view.scale;
  } else if (measure.on && measure.a && !measure.b) {
    measure.live = { x: snap(wx(p.x)), y: snap(wy(p.y)) };
  } else {
    var grip = handleAt(p);
    if (grip) cv.style.cursor = gripCursor(grip.id);
    else if (componentAt(p) || guideAt(p)) cv.style.cursor = 'move';
    else cv.style.cursor = 'default';
  }
  draw();
});

function endPointer(e) {
  delete pointers[e.pointerId];
  if (Object.keys(pointers).length < 2) pinchStart = null;

  if (drag && drag.kind === 'guide') {
    // Dropped back over its own ruler: the standard way to throw a guide away.
    var p = localPoint(e);
    var zone = zoneOf(p);
    var onItsRuler = (drag.guide.axis === 'x' && zone === 'rulerLeft')
                  || (drag.guide.axis === 'y' && zone === 'rulerTop');
    if (onItsRuler || zone === 'corner') removeGuide(drag.guide);
  }
  drag = null;
  draw();
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

cv.addEventListener('pointerleave', function () {
  cursor = null;
  draw();
});

cv.addEventListener('dblclick', function (e) {
  var g = guideAt(localPoint(e));
  if (g) { removeGuide(g); draw(); }
});

cv.addEventListener('wheel', function (e) {
  e.preventDefault();
  var p = localPoint(e);
  zoomAt(p.x, p.y, e.deltaY < 0 ? 1.12 : 1 / 1.12);
}, { passive: false });

var CURSORS = {
  n: 'ns-resize', s: 'ns-resize', e: 'ew-resize', w: 'ew-resize',
  ne: 'nesw-resize', sw: 'nesw-resize', nw: 'nwse-resize', se: 'nwse-resize'
};
function gripCursor(id) { return CURSORS[id] || 'move'; }

/* Drag one edge (or two, at a corner) and leave the opposite edge where it is.
   The grip carries ex/ey: -1 moves the low edge, +1 the high edge, 0 leaves
   that axis alone. The dragged edge snaps to the grid -- not the size -- so a
   component you line up against a guide stays lined up against it. */
function resizeTo(p) {
  var c = selectedComponent();
  if (!c) return;
  var g = drag.grip;

  var lo = [drag.at[0], drag.at[1]];
  var hi = [drag.at[0] + drag.size[0], drag.at[1] + drag.size[1]];
  var world = [snap(wx(p.x)), snap(wy(p.y))];
  var e = [g.ex, g.ey];

  for (var a = 0; a < 2; a++) {
    if (e[a] < 0) lo[a] = Math.min(world[a], hi[a] - MIN_COMP);
    else if (e[a] > 0) hi[a] = Math.max(world[a], lo[a] + MIN_COMP);
  }

  c.at = [lo[0], lo[1]];
  c.size = [hi[0] - lo[0], hi[1] - lo[1]];
  syncControls();
  scheduleSave();
}

function removeGuide(g) {
  var i = doc.guides.indexOf(g);
  if (i >= 0) doc.guides.splice(i, 1);
}

function typingInAField(e) {
  var tag = (e.target && e.target.tagName) || '';
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
}

window.addEventListener('keydown', function (e) {
  var mod = e.ctrlKey || e.metaKey;

  if (mod && (e.key === 'z' || e.key === 'Z')) {
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
    return;
  }
  if (mod && (e.key === 'y' || e.key === 'Y')) {
    e.preventDefault();
    redo();
    return;
  }

  if (e.key === 'Escape') {
    measure.a = measure.b = measure.live = null;
    if (measure.on) {
      measure.on = false;
      measureBtn.classList.remove('active');
    }
    selectedId = null;
    syncControls();
    draw();
    return;
  }

  // Delete only bites on the canvas. In a text box it is just a backspace.
  if ((e.key === 'Delete' || e.key === 'Backspace') && !typingInAField(e)) {
    e.preventDefault();
    deleteSelected();
  }
});


/* --------------------------------------------------------------------------
   Controls
   -------------------------------------------------------------------------- */
function num(el, fallback) {
  var v = parseFloat(el.value);      // always a decimal point, never a comma
  return isFinite(v) ? v : fallback;
}

var plateW = document.getElementById('plateW');
var plateH = document.getElementById('plateH');
var plateT = document.getElementById('plateT');

function readPlate() {
  doc.plate.w = Math.max(10, num(plateW, doc.plate.w));
  doc.plate.h = Math.max(10, num(plateH, doc.plate.h));
  doc.plate.thickness = Math.max(1, num(plateT, doc.plate.thickness));
  if (!userAdjusted) fit();
  scheduleSave();
  draw();
}
plateW.addEventListener('input', readPlate);
plateH.addEventListener('input', readPlate);
plateT.addEventListener('input', readPlate);

var gridSel = document.getElementById('gridSel');
gridSel.addEventListener('change', function () {
  gridPitch = parseFloat(gridSel.value) || 0;
  store.set('gridPitch', gridPitch);
  draw();
});

document.getElementById('fitBtn').onclick = function () {
  userAdjusted = false;   // hand the view back, so it tracks layout again
  fit();
  draw();
};

var measureBtn = document.getElementById('measureBtn');
measureBtn.onclick = function () {
  measure.on = !measure.on;
  measure.a = measure.b = measure.live = null;
  if (measure.on) { selectedId = null; syncControls(); }
  measureBtn.classList.toggle('active', measure.on);
  draw();
};

var crosshairBtn = document.getElementById('crosshairBtn');
crosshairBtn.onclick = function () {
  crosshair = !crosshair;
  crosshairBtn.classList.toggle('active', crosshair);
  store.set('crosshair', crosshair);
  draw();
};

document.getElementById('clearGuidesBtn').onclick = function () {
  if (!doc.guides.length) return;
  snapshot();
  doc.guides.length = 0;
  scheduleSave();
  draw();
};


/* --------------------------------------------------------------------------
   The project panel, the component panel, and the file
   -------------------------------------------------------------------------- */
var docName = document.getElementById('docName');
var compFields = document.getElementById('compFields');
var compEmpty = document.getElementById('compEmpty');
var F = {
  name: document.getElementById('compName'),
  x: document.getElementById('compX'),
  y: document.getElementById('compY'),
  w: document.getElementById('compW'),
  h: document.getElementById('compH'),
  standoff: document.getElementById('compStandoff'),
  board: document.getElementById('compBoard'),
  body: document.getElementById('compBody'),
  colour: document.getElementById('compColour')
};

/* Push the document into the controls. Called after anything that changes the
   document from outside the panel -- a drag, an undo, opening a file -- so the
   numbers you read are always the numbers the drawing is using. */
var syncing = false;
function syncControls() {
  syncing = true;

  docName.value = doc.name;
  plateW.value = doc.plate.w;
  plateH.value = doc.plate.h;
  plateT.value = doc.plate.thickness;

  var c = selectedComponent();
  compFields.hidden = !c;
  compEmpty.hidden = !!c;
  if (c) {
    F.name.value = c.name;
    F.x.value = round2(c.at[0]);
    F.y.value = round2(c.at[1]);
    F.w.value = round2(c.size[0]);
    F.h.value = round2(c.size[1]);
    F.standoff.value = c.standoff;
    F.board.value = c.board;
    F.body.value = c.body;
    F.colour.value = c.colour;
  }

  syncing = false;
}

/* Number inputs show a rounded value, but the drawing keeps full precision --
   so writing the box back into the document on every sync would quietly round
   a 43.75 you typed down to 43.75 and a dragged 12.3333 to 12.33. Rounding
   only on display keeps the document honest. */
function round2(v) { return Math.round(v * 100) / 100; }

function onCompField() {
  if (syncing) return;
  var c = selectedComponent();
  if (!c) return;
  c.name = F.name.value.slice(0, 40);
  c.at = [num(F.x, c.at[0]), num(F.y, c.at[1])];
  c.size = [Math.max(MIN_COMP, num(F.w, c.size[0])), Math.max(MIN_COMP, num(F.h, c.size[1]))];
  c.standoff = Math.max(0, num(F.standoff, c.standoff));
  c.board = Math.max(0, num(F.board, c.board));
  c.body = Math.max(0, num(F.body, c.body));
  c.colour = colourOr(F.colour.value, c.colour);
  scheduleSave();
  draw();
}

for (var fieldKey in F) {
  if (Object.prototype.hasOwnProperty.call(F, fieldKey)) {
    F[fieldKey].addEventListener('input', onCompField);
  }
}

// Typing in a box is one undoable act, not one per keystroke.
for (var focusKey in F) {
  if (Object.prototype.hasOwnProperty.call(F, focusKey)) {
    F[focusKey].addEventListener('focus', snapshot);
  }
}

docName.addEventListener('input', function () {
  if (syncing) return;
  doc.name = docName.value.slice(0, 60);
  scheduleSave();
});
docName.addEventListener('focus', snapshot);

/* A new component lands in the middle of what you are looking at, at a size
   you will immediately retype anyway -- the point is to give the calipers
   somewhere to go. */
var PALETTE = ['#4dd8ff', '#5ee88f', '#ffb648', '#ff5cd6', '#b45cff', '#ff4d5e'];

function occupied(at) {
  for (var i = 0; i < doc.components.length; i++) {
    var c = doc.components[i];
    if (Math.abs(c.at[0] - at[0]) < 0.01 && Math.abs(c.at[1] - at[1]) < 0.01) return true;
  }
  return false;
}

document.getElementById('addCompBtn').onclick = function () {
  snapshot();
  var mid = { x: wx((plot.x0 + plot.x1) / 2), y: wy((plot.y0 + plot.y1) / 2) };
  var taken = {};
  for (var i = 0; i < doc.components.length; i++) taken[doc.components[i].id] = true;
  var at = [snap(mid.x - 12.5), snap(mid.y - 10)];
  // Cascade off anything already sitting exactly there. Three components
  // stacked on the same square look like one, and only the top one can be
  // grabbed.
  var step = gridPitch ? Math.max(gridPitch, 2) : 3;
  for (var guard = 0; guard < 40 && occupied(at); guard++) {
    at = [at[0] + step, at[1] - step];
  }

  var c = normComponent({
    at: at,
    size: [25, 20],
    colour: PALETTE[doc.components.length % PALETTE.length]
  }, taken);
  doc.components.push(c);
  selectedId = c.id;
  syncControls();
  scheduleSave();
  draw();
  F.name.focus();
  F.name.select();
};

document.getElementById('dupCompBtn').onclick = function () {
  var c = selectedComponent();
  if (!c) return;
  snapshot();
  var taken = {};
  for (var i = 0; i < doc.components.length; i++) taken[doc.components[i].id] = true;
  var copy = normComponent(copyInto({}, c), taken);
  copy.id = nextId(taken);
  copy.at = [snap(c.at[0] + 5), snap(c.at[1] - 5)];
  doc.components.push(copy);
  selectedId = copy.id;
  syncControls();
  scheduleSave();
  draw();
};

function deleteSelected() {
  var c = selectedComponent();
  if (!c) return;
  snapshot();
  doc.components.splice(doc.components.indexOf(c), 1);
  selectedId = null;
  syncControls();
  scheduleSave();
  draw();
}
document.getElementById('delCompBtn').onclick = deleteSelected;


/* --------------------------------------------------------------------------
   Saving
   --------------------------------------------------------------------------
   Two kinds, and they are not alternatives. The browser copy is a safety net
   against a closed tab; the file is the artefact you keep, copy to another
   machine, and put in version control. See DESIGN.md.
   -------------------------------------------------------------------------- */
var saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () { store.set('doc', doc); }, 400);
}

function say(text) {
  var note = document.getElementById('compNote');
  note.textContent = text;
  clearTimeout(say._t);
  say._t = setTimeout(function () { note.textContent = t('compNote'); }, 4000);
}

function adopt(raw) {
  var result = normDoc(raw);       // throws if it is not one of ours
  snapshot();
  doc = result.doc;
  selectedId = null;
  userAdjusted = false;            // frame the plate we just opened
  syncControls();
  scheduleSave();
  fit();
  draw();
  return result.newer;
}

function safeFileName() {
  var base = (doc.name || t('untitled')).toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
  return (base || 'protoplaca') + '-' + Fantoma.stamp() + '.protoplaca.json';
}

document.getElementById('saveBtn').onclick = function () {
  Fantoma.downloadJSON(safeFileName(), doc);
  say(t('saved'));
};

document.getElementById('openBtn').onclick = function () {
  Fantoma.readJSONFile().then(function (raw) {
    var newer = adopt(raw);
    say(newer ? t('newerFile') : t('opened'));
  }).catch(function (err) {
    if (err && err.message !== 'No file chosen.') say(err.message);
  });
};

document.getElementById('newBtn').onclick = function () {
  if (!confirm(t('confirmNew'))) return;
  snapshot();
  doc = blankDoc();
  selectedId = null;
  userAdjusted = false;
  syncControls();
  scheduleSave();
  fit();
  draw();
};


/* --------------------------------------------------------------------------
   Boot
   -------------------------------------------------------------------------- */
var store = Fantoma.store('protoplaca');

function applyLang() {
  document.documentElement.lang = (lang === 'pt' ? 'pt-PT' : 'en');
  document.getElementById('subtitle').textContent = t('subtitle');

  document.getElementById('ttProject').textContent = t('project');
  document.getElementById('lbDocName').textContent = t('docName');
  document.getElementById('docName').placeholder = t('untitled');
  document.getElementById('newBtn').textContent = t('newDoc');
  document.getElementById('openBtn').textContent = t('open');
  document.getElementById('saveBtn').textContent = t('save');
  document.getElementById('projectNote').textContent = t('projectNote');

  document.getElementById('ttComponents').textContent = t('components');
  document.getElementById('addCompBtn').textContent = t('addComp');
  document.getElementById('compEmpty').textContent = t('noSelection');
  document.getElementById('lbCompName').textContent = t('compName');
  document.getElementById('lbCompW').textContent = t('compW');
  document.getElementById('lbCompH').textContent = t('compH');
  document.getElementById('lbStandoff').textContent = t('standoff');
  document.getElementById('lbBoard').textContent = t('board');
  document.getElementById('lbBody').textContent = t('body');
  document.getElementById('lbColour').textContent = t('colour');
  document.getElementById('dupCompBtn').textContent = t('duplicate');
  document.getElementById('delCompBtn').textContent = t('remove');
  document.getElementById('compNote').textContent = t('compNote');

  document.getElementById('ttPlate').textContent = t('plate');
  document.getElementById('lbW').textContent = t('width');
  document.getElementById('lbH').textContent = t('height');
  document.getElementById('lbT').textContent = t('thickness');
  document.getElementById('ttView').textContent = t('view');
  document.getElementById('lbGrid').textContent = t('grid');
  document.getElementById('optNoGrid').textContent = t('noGrid');
  document.getElementById('fitBtn').textContent = t('fit');
  document.getElementById('measureBtn').textContent = t('measure');
  document.getElementById('crosshairBtn').textContent = t('crosshair');
  document.getElementById('clearGuidesBtn').textContent = t('clearGuides');
  document.getElementById('viewNote').textContent = t('viewNote');
  document.getElementById('langEn').classList.toggle('active', lang === 'en');
  document.getElementById('langPt').classList.toggle('active', lang === 'pt');
  draw();
}

function setLang(next) {
  lang = next;
  store.set('lang', next);      // a preference, not part of the document
  applyLang();
}
document.getElementById('langEn').onclick = function () { setLang('en'); };
document.getElementById('langPt').onclick = function () { setLang('pt'); };

lang = store.get('lang')
    || (String(navigator.language || '').toLowerCase().indexOf('pt') === 0 ? 'pt' : 'en');

gridPitch = numOr(store.get('gridPitch'), 1, 0, 10);
gridSel.value = String(gridPitch);

crosshair = store.get('crosshair') !== false;   // on unless turned off
crosshairBtn.classList.toggle('active', crosshair);

/* What this browser remembered goes through the same door as an opened file.
   If it is corrupt or from a version that never existed, we start clean rather
   than run on a half-understood document. */
var remembered = store.get('doc');
if (remembered) {
  try {
    doc = normDoc(remembered).doc;
  } catch (e) {
    console.warn('[protoplaca] ignoring unreadable saved project', e);
  }
}

applyLang();
syncControls();
render();     // synchronous, so the first paint is already the right size

/* --------------------------------------------------------------------------
   Collapsible panels
   --------------------------------------------------------------------------
   On a desk screen the panels are taller than the window, so reaching a
   control means scrolling the drawing out of sight -- which is the one thing
   you were looking at when you went for the control.

   The bodies are wrapped here rather than in the markup so that a panel added
   later collapses too, without anyone having to remember to wrap it.

   Defaults: the panels you set once (Plate, View) start closed, the ones you
   work in stay open. After that your own choice is remembered.
   -------------------------------------------------------------------------- */
var panelState = store.get('panels') || {};

function makeCollapsible(id, openByDefault) {
  var section = document.getElementById(id);
  var head = section.querySelector('h2');

  // The heading's text lives in a span of its own, because applyLang writes
  // that text on every language switch -- writing it on the h2 itself would
  // take the chevron with it.
  var body = document.createElement('div');
  body.className = 'pbody';
  while (head.nextSibling) body.appendChild(head.nextSibling);
  section.appendChild(body);

  var chev = document.createElement('span');
  chev.className = 'chev';
  chev.textContent = '\u25bc';
  head.appendChild(chev);

  head.setAttribute('role', 'button');
  head.tabIndex = 0;

  function apply(open) {
    section.classList.toggle('closed', !open);
    head.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  function toggle() {
    var open = section.classList.contains('closed');
    apply(open);
    panelState[id] = open;
    store.set('panels', panelState);
    // The canvas is sized by the layout, so a panel that changes the page
    // height can change it. Let the renderer notice.
    draw();
  }

  head.addEventListener('click', toggle);
  head.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
  });

  apply(typeof panelState[id] === 'boolean' ? panelState[id] : openByDefault);
}

makeCollapsible('projectPanel', true);
makeCollapsible('platePanel', false);
makeCollapsible('compPanel', true);
makeCollapsible('viewPanel', false);

FantomaApp.init({
  toolId: 'protoplaca',
  store: store,
  accent: '#4dd8ff',
  mountInto: document.getElementById('dataPanelHost'),
  onImport: function () { location.reload(); }
});
</script>
</body>
</html>
