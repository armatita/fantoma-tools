/* --------------------------------------------------------------------------
   The mesh
   --------------------------------------------------------------------------
   No CAD kernel and no boolean operations. Every solid here is a prism, and a
   boss with a hole is generated AS A TUBE rather than as a cylinder with a
   cylinder subtracted from it. Slicers accept overlapping closed volumes in
   one file and union them at slice time, so the parts do not even need
   merging -- which is what lets this be a few hundred lines of plain
   JavaScript instead of a WASM kernel.

   Triangles are flat arrays of nine numbers, [ax,ay,az, bx,by,bz, cx,cy,cz],
   wound counter-clockwise seen from outside.

   WHAT THIS DOES NOT DO YET: put a hole through the plate. A tube standing on
   a solid slab gives a BLIND hole, which is right for self-tapping screws and
   heat-set inserts. A clearance hole needs the slab's own faces to become
   rectangles-with-holes, which needs polygon-with-holes triangulation -- the
   same thing recessed text needs, and the reason both wait for one properly
   tested triangulator rather than two hacks. Until then the export says so.
   -------------------------------------------------------------------------- */

/* --------------------------------------------------------------------------
   Triangulating a polygon with holes
   --------------------------------------------------------------------------
   The one exception to "no booleans". A rectangle with circular holes in it,
   and later a plate face with glyph outlines punched through it, cannot be
   expressed as a union of prisms -- the face itself has to be cut up into
   triangles that avoid the holes.

   Ear clipping, with holes bridged into the outer ring first. Written here
   rather than pulled from a CDN because this page is self-contained and works
   offline, and a script tag would be the first thing to break that.

   The risk in hand-rolling it is a subtly wrong triangulation, which produces
   a mesh that slices wrong rather than one that fails loudly. That is answered
   by checking the output rather than trusting it: the triangles must sum to
   the polygon's own area, they must all wind the same way, and the solid built
   from them must still pass the closed-surface test before anything is written.
   -------------------------------------------------------------------------- */
var TRI_EPS = 1e-9;

function ringArea(r) {
  var a = 0;
  for (var i = 0; i < r.length; i++) {
    var p1 = r[i], p2 = r[(i + 1) % r.length];
    a += p1[0] * p2[1] - p2[0] * p1[1];
  }
  return a / 2;
}

/* Outer rings run counter-clockwise, holes clockwise. Getting this wrong makes
   a hole add material instead of removing it. */
function oriented(ring, wantCCW) {
  return ((ringArea(ring) < 0) === wantCCW) ? ring.slice().reverse() : ring.slice();
}

/* --------------------------------------------------------------------------
   Sweep the shape in horizontal bands.

   Take every y where any vertex sits, and consider the strips between
   consecutive ones. Inside a strip no vertex occurs, so every edge crossing it
   is a plain straight segment from top to bottom. Sort those crossings by x
   and pair them off: first-to-second is material, second-to-third is not,
   third-to-fourth is material again. Each pair is a trapezoid, and a trapezoid
   is two triangles.

   WHY THIS AND NOT EAR CLIPPING. Ear clipping needs the holes bridged into the
   outer ring first, and the bridges are where it goes wrong: two holes whose
   rays reach the same corner pinch the polygon there and the clipping stalls.
   The first attempt here did exactly that -- 70 triangles out of 106 on a
   four-hole plate. Giving each bridge its own landing point fixed that case
   and broke two holes sharing a horizontal line instead. That is the point at
   which a reference implementation reaches for intersection repair and
   recursive splitting, and this file would rather have an algorithm with no
   such cases at all.

   The sweep has none. It never asks whether a triangle is valid, so it cannot
   get that question wrong; it just slices the shape into strips. It produces
   more, thinner triangles than ear clipping, which matters for rendering and
   not at all for a slicer, which only reads the surface.
   -------------------------------------------------------------------------- */
/* Put a vertex on every ring wherever any ring has one.

   The sweep cuts the shape at every vertex height, so a face triangle can end
   up with a corner partway along an edge that the wall beside it treats as a
   single straight segment. Geometrically that is fine -- the volume comes out
   exact -- but the surface is not closed: the face has a vertex the wall does
   not, and the edges no longer pair up. A T-junction, and a crack.

   Splitting first means the faces and the walls are built from one and the
   same set of points, so nothing can be left unmatched. It also makes the
   sweep's interpolation land exactly on existing vertices rather than near
   them, which keeps the arithmetic exact rather than merely close.
*/
function splitRingsAtVertexHeights(rings) {
  var ys = [], i, k;
  for (i = 0; i < rings.length; i++) {
    for (k = 0; k < rings[i].length; k++) ys.push(rings[i][k][1]);
  }
  ys.sort(function (m, n) { return m - n; });

  var out = [];
  for (i = 0; i < rings.length; i++) {
    var r = rings[i], split = [];
    for (k = 0; k < r.length; k++) {
      var a = r[k], b = r[(k + 1) % r.length];
      split.push(a);
      if (a[1] === b[1]) continue;

      var lo = Math.min(a[1], b[1]), hi = Math.max(a[1], b[1]);
      var cuts = [];
      for (var j = 0; j < ys.length; j++) {
        if (ys[j] > lo + TRI_EPS && ys[j] < hi - TRI_EPS) {
          if (!cuts.length || Math.abs(cuts[cuts.length - 1] - ys[j]) > TRI_EPS) cuts.push(ys[j]);
        }
      }
      if (a[1] > b[1]) cuts.reverse();
      for (j = 0; j < cuts.length; j++) {
        var t = (cuts[j] - a[1]) / (b[1] - a[1]);
        split.push([a[0] + t * (b[0] - a[0]), cuts[j]]);
      }
    }
    out.push(split);
  }
  return out;
}

/* Triangulate a face. Rings must already have been through
   splitRingsAtVertexHeights, so every edge spans exactly one band.

   Two things have to be true of the result, and only the second is obvious.
   The triangles must cover the right area -- and they must CONFORM: no
   triangle may have a corner partway along another triangle's edge. A
   non-conforming face looks perfect and measures perfect, and still leaves the
   solid open, because an edge shared by three triangles instead of two is a
   crack. Both T-junctions this went through were found that way, by the
   closed-surface test rather than by looking. */
function triangulate(outer, holes) {
  var rings = [oriented(outer, true)];
  var i, k;
  for (i = 0; i < holes.length; i++) rings.push(oriented(holes[i], false));

  var edges = [], ys = [];
  for (i = 0; i < rings.length; i++) {
    var r = rings[i];
    for (k = 0; k < r.length; k++) {
      var a = r[k], b = r[(k + 1) % r.length];
      ys.push(a[1]);
      if (a[1] !== b[1]) edges.push([a, b]);       // horizontal edges cross nothing
    }
  }
  if (!edges.length) return null;
  ys.sort(function (m, n) { return m - n; });

  /* Every x at which anything meets this height. A band's floor and the band
     below it share this list, so their horizontal edges are cut identically
     and pair up instead of leaving a T. */
  function crossingsAt(y) {
    var xs = [];
    for (var e = 0; e < edges.length; e++) {
      var ay = edges[e][0][1], by = edges[e][1][1];
      if (Math.min(ay, by) > y + TRI_EPS || Math.max(ay, by) < y - TRI_EPS) continue;
      var t = (y - ay) / (by - ay);
      xs.push(edges[e][0][0] + t * (edges[e][1][0] - edges[e][0][0]));
    }
    xs.sort(function (m, n) { return m - n; });
    var uniq = [];
    for (var q = 0; q < xs.length; q++) {
      if (!uniq.length || xs[q] - uniq[uniq.length - 1] > TRI_EPS) uniq.push(xs[q]);
    }
    return uniq;
  }

  function chain(x0, x1, y, all) {
    var out = [[x0, y]];
    for (var q = 0; q < all.length; q++) {
      if (all[q] > x0 + TRI_EPS && all[q] < x1 - TRI_EPS) out.push([all[q], y]);
    }
    out.push([x1, y]);
    return out;
  }

  var tris = [];
  for (var band = 0; band < ys.length - 1; band++) {
    var y0 = ys[band], y1 = ys[band + 1];
    if (y1 - y0 <= TRI_EPS) continue;
    var ym = (y0 + y1) / 2;

    var spans = [];
    for (i = 0; i < edges.length; i++) {
      var ed = edges[i], eay = ed[0][1], eby = ed[1][1];
      if (Math.min(eay, eby) > ym || Math.max(eay, eby) < ym) continue;
      // Take the endpoint's own x when the band boundary IS the endpoint.
      // a + (b - a) is not always exactly b in floating point, and one ulp of
      // disagreement between a face vertex and the wall vertex beside it is a
      // crack as far as a strict check is concerned.
      var dy = eby - eay;
      spans.push([
        (eay === y0) ? ed[0][0] : (eby === y0) ? ed[1][0]
          : ed[0][0] + (y0 - eay) / dy * (ed[1][0] - ed[0][0]),
        (eby === y1) ? ed[1][0] : (eay === y1) ? ed[0][0]
          : ed[0][0] + (y1 - eay) / dy * (ed[1][0] - ed[0][0])
      ]);
    }
    if (spans.length < 2) continue;
    spans.sort(function (m, n) { return (m[0] + m[1]) - (n[0] + n[1]); });

    var lowXs = crossingsAt(y0), highXs = crossingsAt(y1);

    for (i = 0; i + 1 < spans.length; i += 2) {
      var L = spans[i], R = spans[i + 1];
      var bot = chain(L[0], R[0], y0, lowXs);
      var top = chain(L[1], R[1], y1, highXs);

      // Zip the two chains into a strip, always advancing whichever side is
      // behind, so no triangle straddles a vertex on the other side.
      var bi = 0, ti = 0;
      while (bi < bot.length - 1 || ti < top.length - 1) {
        var useBottom;
        if (ti >= top.length - 1) useBottom = true;
        else if (bi >= bot.length - 1) useBottom = false;
        else useBottom = bot[bi + 1][0] <= top[ti + 1][0];

        var t3;
        if (useBottom) { t3 = [bot[bi], bot[bi + 1], top[ti]]; bi++; }
        else { t3 = [bot[bi], top[ti + 1], top[ti]]; ti++; }
        if (ringArea(t3) > TRI_EPS) tris.push(t3);
      }
    }
  }

  /* The pieces must add up to the whole: outer area minus the holes, against
     the sum of the triangles. */
  var want = Math.abs(ringArea(oriented(outer, true)));
  for (i = 0; i < holes.length; i++) want -= Math.abs(ringArea(holes[i]));

  var got = 0;
  for (i = 0; i < tris.length; i++) got += Math.abs(ringArea(tris[i]));
  if (Math.abs(got - want) > Math.max(1e-6, want * 1e-6)) return null;

  return tris;
}

function circleRing(cx, cy, r, segments) {
  var out = [];
  for (var i = 0; i < segments; i++) {
    var a = i / segments * Math.PI * 2;
    out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return out;
}

/* Sunk slightly into the plate rather than resting exactly on it. Coincident
   coplanar faces are a classic source of slicer artefacts, and 0.2 mm of
   overlap makes the union unambiguous. The boss still stands `height` proud of
   the plate, which is the number that matters. */
var WELD = 0.2;

function tri(out, ax, ay, az, bx, by, bz, cx, cy, cz) {
  out.push([ax, ay, az, bx, by, bz, cx, cy, cz]);
}

function quad(out, a, b, c, d) {
  tri(out, a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
  tri(out, a[0], a[1], a[2], c[0], c[1], c[2], d[0], d[1], d[2]);
}

function boxMesh(out, x0, y0, z0, x1, y1, z1) {
  var v = [
    [x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0],
    [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]
  ];
  quad(out, v[4], v[5], v[6], v[7]);   // top,    +Z
  quad(out, v[3], v[2], v[1], v[0]);   // bottom, -Z
  quad(out, v[0], v[1], v[5], v[4]);   // front,  -Y
  quad(out, v[2], v[3], v[7], v[6]);   // back,   +Y
  quad(out, v[1], v[2], v[6], v[5]);   // right,  +X
  quad(out, v[3], v[0], v[4], v[7]);   // left,   -X
}

/* How many segments a circle of this radius needs so the flats are invisible.
   Held to a sagitta of 0.05 mm, which is well under what a 0.4 mm nozzle can
   resolve, and clamped so a tiny M1.4 hole is still round and a big boss does
   not cost thousands of triangles. */
function segmentsFor(radius) {
  var tol = 0.05;
  if (radius <= tol) return 12;
  var n = Math.ceil(Math.PI / Math.acos(1 - tol / radius));
  return Math.max(16, Math.min(96, n));
}

/* An annular prism: the wall of a boss, with the hole already in it. */
function tubeMesh(out, cx, cy, z0, z1, rIn, rOut) {
  var n = segmentsFor(rOut);
  var i, a0, a1;
  var oi = [], oo = [], ii = [], io = [];   // inner/outer rings, bottom/top

  for (i = 0; i < n; i++) {
    var a = i / n * Math.PI * 2;
    var co = Math.cos(a), si = Math.sin(a);
    oi.push([cx + rOut * co, cy + rOut * si, z0]);
    oo.push([cx + rOut * co, cy + rOut * si, z1]);
    ii.push([cx + rIn * co, cy + rIn * si, z0]);
    io.push([cx + rIn * co, cy + rIn * si, z1]);
  }

  for (i = 0; i < n; i++) {
    var j = (i + 1) % n;
    quad(out, oi[i], oi[j], oo[j], oo[i]);   // outer wall, facing out
    quad(out, ii[j], ii[i], io[i], io[j]);   // inner wall, facing in
    quad(out, io[i], oo[i], oo[j], io[j]);   // top annulus,    +Z
    quad(out, ii[i], ii[j], oi[j], oi[i]);   // bottom annulus, -Z
  }
}

function bossHeightOf(b) {
  // An attached boss follows its component, which is also what the file says;
  // read the component anyway so a hand-edited file cannot print a lie.
  if (b.of) {
    var c = findIn(doc.components, b.of);
    if (c) return c.standoff;
  }
  return b.height;
}

/* Clearance holes that can actually be cut: inside the plate with a little
   material left around them, and not touching each other. A hole that fails
   either test is skipped rather than allowed to produce a broken face, and the
   export panel says how many. */
var HOLE_MARGIN = 0.5;

function plateHoles() {
  var out = [], skipped = 0, i, k;
  for (i = 0; i < doc.bosses.length; i++) {
    var b = doc.bosses[i];
    if (b.fixing !== 'clearance') continue;
    var r = holeDia(b) / 2;
    var x = b.at[0], y = b.at[1];

    var ok = x - r > HOLE_MARGIN && y - r > HOLE_MARGIN
          && x + r < doc.plate.w - HOLE_MARGIN && y + r < doc.plate.h - HOLE_MARGIN;

    for (k = 0; ok && k < out.length; k++) {
      var o = out[k];
      if (Math.hypot(o.x - x, o.y - y) < o.r + r + HOLE_MARGIN) ok = false;
    }
    if (ok) out.push({ x: x, y: y, r: r });
    else skipped++;
  }
  out.skipped = skipped;
  return out;
}

/* The plate. A plain box while nothing goes through it; a pair of triangulated
   faces with walls down each hole once something does. */
function plateMesh(out) {
  var t = doc.plate.thickness, w = doc.plate.w, h = doc.plate.h;
  var holes = plateHoles();

  if (!holes.length) { boxMesh(out, 0, 0, 0, w, h, t); return true; }

  var rings = [], i, k;
  for (i = 0; i < holes.length; i++) {
    rings.push(circleRing(holes[i].x, holes[i].y, holes[i].r, segmentsFor(holes[i].r)));
  }

  // Every ring gains a vertex wherever any ring has one, so the faces and the
  // walls below are cut from an identical set of points.
  var all = splitRingsAtVertexHeights(
    [oriented([[0, 0], [w, 0], [w, h], [0, h]], true)].concat(rings));
  var outerRing = all[0];
  var holeRings = all.slice(1);

  var faces = triangulate(outerRing, holeRings);
  if (!faces) return false;                  // refused; caller must not export

  for (i = 0; i < faces.length; i++) {
    var f = faces[i];
    tri(out, f[0][0], f[0][1], t, f[1][0], f[1][1], t, f[2][0], f[2][1], t);   // top, +Z
    tri(out, f[0][0], f[0][1], 0, f[2][0], f[2][1], 0, f[1][0], f[1][1], 0);   // bottom, -Z
  }

  // The outside of the plate, from the same split ring the faces used.
  var oring = oriented(outerRing, true);
  for (k = 0; k < oring.length; k++) {
    var a1 = oring[k], a2 = oring[(k + 1) % oring.length];
    quad(out, [a1[0], a1[1], 0], [a2[0], a2[1], 0], [a2[0], a2[1], t], [a1[0], a1[1], t]);
  }

  // The bore through the plate. Its normals face the axis, because the hole is
  // where the material is not.
  for (i = 0; i < holeRings.length; i++) {
    var ring = oriented(holeRings[i], false);   // clockwise seen from above
    for (k = 0; k < ring.length; k++) {
      var p1 = ring[k], p2 = ring[(k + 1) % ring.length];
      quad(out, [p1[0], p1[1], 0], [p2[0], p2[1], 0], [p2[0], p2[1], t], [p1[0], p1[1], t]);
    }
  }
  return true;
}

function buildMesh() {
  var out = [];
  var t = doc.plate.thickness;

  if (!plateMesh(out)) return null;

  for (var x = 0; x < doc.texts.length; x++) textMesh(out, doc.texts[x]);

  for (var i = 0; i < doc.bosses.length; i++) {
    var b = doc.bosses[i];
    var h = bossHeightOf(b);

    /* A blind boss is sunk 0.2 mm into the plate: those faces end up strictly
       inside solid material, which is harmless and makes the union unambiguous.

       A clearance boss must not be. Sinking it would put its bore wall inside
       the HOLE, where it would duplicate the wall the plate already owns --
       two coincident surfaces facing the same way, which is a real degeneracy
       rather than a harmless internal face. So the plate owns the bore from 0
       to the plate top, and the tube owns it from there up; they meet exactly. */
    var z0 = (b.fixing === 'clearance') ? t : t - WELD;
    tubeMesh(out, b.at[0], b.at[1], z0, t + h, holeDia(b) / 2, bossOuterDia(b) / 2);
  }
  return out;
}

/* --------------------------------------------------------------------------
   A stroke font, and text made of prisms
   --------------------------------------------------------------------------
   Each glyph is a few polylines drawn with a single pen, on a box 6 wide and
   10 tall with the baseline at 0. Rendering one means laying a rectangle along
   every stroke and standing it up off the plate -- so text is a union of
   boxes, which is the same geometry as everything else here and needs nothing
   the mesh cannot already do.

   RAISED, not engraved. Engraved text means punching the glyph's outline
   through the plate's top face, which needs the outline of a stroke rather
   than the stroke itself, and the triangulator. Raised text needs neither, it
   stays legible after handling, and it does not collect the dust and stringing
   that a fine groove does. Engraved text is still worth having later, for
   labelling a plate that something sits on top of.

   The font is here rather than fetched because this page works offline, and a
   web font would be the first thing to break that. It only has to be legible
   at 3 mm on a printed coupon, which is a much easier job than reading well.
   -------------------------------------------------------------------------- */
var GLYPH_W = 6, GLYPH_H = 10, GLYPH_GAP = 2;

var FONT = {
  'A': [[[0,0],[3,10],[6,0]], [[1.2,3.5],[4.8,3.5]]],
  'B': [[[0,0],[0,10],[4,10],[5.5,8.5],[4,5.5],[0,5.5]], [[4,5.5],[5.5,3],[4,0],[0,0]]],
  'C': [[[6,8.5],[4.5,10],[1.5,10],[0,8.5],[0,1.5],[1.5,0],[4.5,0],[6,1.5]]],
  'D': [[[0,0],[0,10],[4,10],[6,8],[6,2],[4,0],[0,0]]],
  'E': [[[6,10],[0,10],[0,0],[6,0]], [[0,5],[4.5,5]]],
  'F': [[[6,10],[0,10],[0,0]], [[0,5],[4.5,5]]],
  'G': [[[6,8.5],[4.5,10],[1.5,10],[0,8.5],[0,1.5],[1.5,0],[4.5,0],[6,1.5],[6,4.5],[3.5,4.5]]],
  'H': [[[0,0],[0,10]], [[6,0],[6,10]], [[0,5],[6,5]]],
  'I': [[[1,10],[5,10]], [[3,10],[3,0]], [[1,0],[5,0]]],
  'J': [[[5,10],[5,2],[3.5,0],[1.5,0],[0,2]]],
  'K': [[[0,0],[0,10]], [[6,10],[0,4.5]], [[2,6.2],[6,0]]],
  'L': [[[0,10],[0,0],[6,0]]],
  'M': [[[0,0],[0,10],[3,5],[6,10],[6,0]]],
  'N': [[[0,0],[0,10],[6,0],[6,10]]],
  'O': [[[1.5,0],[4.5,0],[6,1.5],[6,8.5],[4.5,10],[1.5,10],[0,8.5],[0,1.5],[1.5,0]]],
  'P': [[[0,0],[0,10],[4.5,10],[6,8.5],[6,6.5],[4.5,5],[0,5]]],
  'Q': [[[1.5,0],[4.5,0],[6,1.5],[6,8.5],[4.5,10],[1.5,10],[0,8.5],[0,1.5],[1.5,0]], [[3.5,2.5],[6,0]]],
  'R': [[[0,0],[0,10],[4.5,10],[6,8.5],[6,6.5],[4.5,5],[0,5]], [[3,5],[6,0]]],
  'S': [[[6,8.5],[4.5,10],[1.5,10],[0,8.5],[0,6.5],[1.5,5],[4.5,5],[6,3.5],[6,1.5],[4.5,0],[1.5,0],[0,1.5]]],
  'T': [[[0,10],[6,10]], [[3,10],[3,0]]],
  'U': [[[0,10],[0,2],[1.5,0],[4.5,0],[6,2],[6,10]]],
  'V': [[[0,10],[3,0],[6,10]]],
  'W': [[[0,10],[1.5,0],[3,6],[4.5,0],[6,10]]],
  'X': [[[0,0],[6,10]], [[0,10],[6,0]]],
  'Y': [[[0,10],[3,5],[6,10]], [[3,5],[3,0]]],
  'Z': [[[0,10],[6,10],[0,0],[6,0]]],
  '0': [[[1.5,0],[4.5,0],[6,1.5],[6,8.5],[4.5,10],[1.5,10],[0,8.5],[0,1.5],[1.5,0]], [[1.5,2],[4.5,8]]],
  '1': [[[1,8],[3,10],[3,0]], [[1,0],[5,0]]],
  '2': [[[0,8.5],[1.5,10],[4.5,10],[6,8.5],[6,7],[0,0],[6,0]]],
  '3': [[[0,10],[6,10],[3,5.5]], [[3,5.5],[4.5,5.5],[6,4],[6,1.5],[4.5,0],[1.5,0],[0,1.5]]],
  '4': [[[4.5,0],[4.5,10],[0,3],[6,3]]],
  '5': [[[6,10],[0,10],[0,5.5],[4.5,5.5],[6,4],[6,1.5],[4.5,0],[1.5,0],[0,1.5]]],
  '6': [[[5,10],[1.5,10],[0,8.5],[0,1.5],[1.5,0],[4.5,0],[6,1.5],[6,3.5],[4.5,5],[1.5,5],[0,3.5]]],
  '7': [[[0,10],[6,10],[2,0]]],
  '8': [[[1.5,5],[0,6.5],[0,8.5],[1.5,10],[4.5,10],[6,8.5],[6,6.5],[4.5,5],[1.5,5],[0,3.5],[0,1.5],[1.5,0],[4.5,0],[6,1.5],[6,3.5],[4.5,5]]],
  '9': [[[1,0],[4.5,0],[6,1.5],[6,8.5],[4.5,10],[1.5,10],[0,8.5],[0,6.5],[1.5,5],[4.5,5],[6,6.5]]],
  '.': [[[2.6,0],[3.4,0]]],
  ',': [[[3.4,0.8],[2.4,-1]]],
  '-': [[[1,5],[5,5]]],
  '+': [[[1,5],[5,5]], [[3,3],[3,7]]],
  '/': [[[0,0],[6,10]]],
  '=': [[[1,3.5],[5,3.5]], [[1,6.5],[5,6.5]]],
  ':': [[[2.6,2],[3.4,2]], [[2.6,7],[3.4,7]]],
  '(': [[[4.5,10],[2,7],[2,3],[4.5,0]]],
  ')': [[[1.5,10],[4,7],[4,3],[1.5,0]]],
  ' ': []
};

/* The strokes of a string, in millimetres, with its left edge at 0 and its
   baseline at 0. Anything the font does not have becomes a space rather than
   nothing, so a missing character leaves a visible gap instead of silently
   shortening the label. */
function textStrokes(str, size) {
  var k = size / GLYPH_H;
  var out = [], pen = 0;
  var text = String(str).toUpperCase();

  for (var i = 0; i < text.length; i++) {
    var g = FONT[text.charAt(i)];
    if (g) {
      for (var p1 = 0; p1 < g.length; p1++) {
        var line = [];
        for (var p2 = 0; p2 < g[p1].length; p2++) {
          line.push([(pen + g[p1][p2][0]) * k, g[p1][p2][1] * k]);
        }
        out.push(line);
      }
    }
    pen += GLYPH_W + GLYPH_GAP;
  }
  out.width = (pen - GLYPH_GAP) * k;
  return out;
}

function textWidth(str, size) {
  var n = String(str).length;
  return n ? ((n * (GLYPH_W + GLYPH_GAP)) - GLYPH_GAP) * size / GLYPH_H : 0;
}

/* One stroke, as a box standing on the plate.

   Each end is extended by half the pen width plus a hair. The half width makes
   a right-angled corner come out solid rather than nicked; the hair is what
   makes the two boxes OVERLAP there instead of meeting exactly. Meeting
   exactly puts a corner of one box on a corner of the other, and coincident
   edges are a degeneracy -- the same reason a blind boss is sunk into the
   plate rather than rested on it. Ten microns is far below anything a printer
   resolves and far above anything the closed-surface test rounds away. */
var JOIN_OVERLAP = 0.01;

function strokeBox(out, a, b, width, z0, z1) {
  var dx = b[0] - a[0], dy = b[1] - a[1];
  var len = Math.sqrt(dx * dx + dy * dy);
  if (len < 1e-9) { dx = 1; dy = 0; len = 1; }
  var ux = dx / len, uy = dy / len;
  // The hair goes on BOTH axes. Lengthwise it keeps a right-angled corner from
   // resting corner-on-corner; crosswise it keeps two parallel strokes exactly
   // one pen width apart -- a "0" beside an "O", say -- from meeting face to
   // face. Either way the rule is the same one the bosses follow: solids that
   // overlap are unambiguous, solids that merely touch are not.
  var hw = width / 2 + JOIN_OVERLAP;
  var reach = hw + JOIN_OVERLAP;

  var ax = a[0] - ux * reach, ay = a[1] - uy * reach;
  var bx = b[0] + ux * reach, by = b[1] + uy * reach;
  var px = -uy * hw, py = ux * hw;

  var c = [[ax + px, ay + py], [ax - px, ay - py], [bx - px, by - py], [bx + px, by + py]];
  if (ringArea(c) < 0) c.reverse();            // keep it counter-clockwise

  quad(out, [c[0][0], c[0][1], z1], [c[1][0], c[1][1], z1],
            [c[2][0], c[2][1], z1], [c[3][0], c[3][1], z1]);      // top
  quad(out, [c[3][0], c[3][1], z0], [c[2][0], c[2][1], z0],
            [c[1][0], c[1][1], z0], [c[0][0], c[0][1], z0]);      // bottom
  for (var i = 0; i < 4; i++) {
    var q1 = c[i], q2 = c[(i + 1) % 4];
    quad(out, [q1[0], q1[1], z0], [q2[0], q2[1], z0],
              [q2[0], q2[1], z1], [q1[0], q1[1], z1]);
  }
}

function textMesh(out, label) {
  var t = doc.plate.thickness;
  var strokes = textStrokes(label.text, label.size);
  var ox = label.at[0], oy = label.at[1];
  if (label.align === 'centre') ox -= strokes.width / 2;

  for (var i = 0; i < strokes.length; i++) {
    var line = strokes[i];
    for (var k = 1; k < line.length; k++) {
      strokeBox(out,
        [ox + line[k - 1][0], oy + line[k - 1][1]],
        [ox + line[k][0], oy + line[k][1]],
        label.stroke, t - WELD, t + label.height);
    }
    if (line.length === 1) {
      strokeBox(out, [ox + line[0][0], oy + line[0][1]],
                     [ox + line[0][0], oy + line[0][1]],
                     label.stroke, t - WELD, t + label.height);
    }
  }
}


/* --------------------------------------------------------------------------
   Is it actually closed?
   --------------------------------------------------------------------------
   Every edge of a closed surface is shared by exactly two triangles, and they
   traverse it in opposite directions. So each DIRECTED edge must appear
   exactly once across the whole soup. That one count catches holes, flipped
   winding and duplicated faces -- the three ways a generated mesh goes wrong
   -- and it catches them here rather than in the slicer.

   Overlapping solids are fine: each is closed on its own, so the union of
   their edge sets still balances.
   -------------------------------------------------------------------------- */
function meshProblems(tris) {
  var seen = {};
  var i, k;

  /* Vertices are matched to a nanometre rather than bit for bit. Two points a
     millionth of a millimetre apart are the same point by any physical
     standard -- the STL this becomes stores float32, which is far coarser --
     and holding the check to exact equality makes it report cracks that do not
     exist while adding nothing it would otherwise catch. */
  function q(v) { return Math.round(v * 1e6) / 1e6; }

  function key(t, a, b) {
    return q(t[a]) + ',' + q(t[a + 1]) + ',' + q(t[a + 2])
      + '|' + q(t[b]) + ',' + q(t[b + 1]) + ',' + q(t[b + 2]);
  }

  for (i = 0; i < tris.length; i++) {
    var t = tris[i];
    var edges = [key(t, 0, 3), key(t, 3, 6), key(t, 6, 0)];
    for (k = 0; k < 3; k++) {
      if (seen[edges[k]]) return { ok: false, reason: 'duplicate directed edge' };
      seen[edges[k]] = true;
    }
  }

  for (k in seen) {
    if (!Object.prototype.hasOwnProperty.call(seen, k)) continue;
    var parts = k.split('|');
    if (!seen[parts[1] + '|' + parts[0]]) return { ok: false, reason: 'unmatched edge' };
  }
  return { ok: true };
}


/* --------------------------------------------------------------------------
   Binary STL
   --------------------------------------------------------------------------
   80 bytes of header nobody reads, a triangle count, then 50 bytes per
   triangle. Binary rather than ASCII because ASCII is roughly five times the
   size for the same geometry and no more readable once it is past a few
   thousand facets.

   STL carries no units. Every slicer assumes millimetres, which is what we
   write.
   -------------------------------------------------------------------------- */
function stlBytes(tris) {
  var buf = new ArrayBuffer(84 + tris.length * 50);
  var view = new DataView(buf);
  var header = 'Protoplaca';
  for (var h = 0; h < header.length; h++) view.setUint8(h, header.charCodeAt(h));
  view.setUint32(80, tris.length, true);

  var off = 84;
  for (var i = 0; i < tris.length; i++) {
    var t = tris[i];
    var ux = t[3] - t[0], uy = t[4] - t[1], uz = t[5] - t[2];
    var vx = t[6] - t[0], vy = t[7] - t[1], vz = t[8] - t[2];
    var nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    var len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;

    view.setFloat32(off, nx / len, true);
    view.setFloat32(off + 4, ny / len, true);
    view.setFloat32(off + 8, nz / len, true);
    for (var k = 0; k < 9; k++) view.setFloat32(off + 12 + k * 4, t[k], true);
    view.setUint16(off + 48, 0, true);
    off += 50;
  }
  return buf;
}

function downloadBytes(filename, buffer, type) {
  var blob = new Blob([buffer], { type: type || 'application/octet-stream' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}


/* --------------------------------------------------------------------------
   Saving
   --------------------------------------------------------------------------
   Two kinds, and they are not alternatives. The browser copy is a safety net
   against a closed tab; the file is the artefact you keep, copy to another
   machine, and put in version control. See DESIGN.md.
   -------------------------------------------------------------------------- */
var saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () { store.set('doc', doc); }, 400);
}

function say(text) {
  var note = document.getElementById('compNote');
  note.textContent = text;
  clearTimeout(say._t);
  say._t = setTimeout(function () { note.textContent = t('compNote'); }, 4000);
}

function adopt(raw) {
  var result = normDoc(raw);       // throws if it is not one of ours
  snapshot();
  doc = result.doc;
  deselect();
  userAdjusted = false;            // frame the plate we just opened
  syncControls();
  scheduleSave();
  fit();
  draw();
  return result.newer;
}

function safeFileName() {
  var base = (doc.name || t('untitled')).toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
  return (base || 'protoplaca') + '-' + Fantoma.stamp() + '.protoplaca.json';
}

document.getElementById('saveBtn').onclick = function () {
  Fantoma.downloadJSON(safeFileName(), doc);
  say(t('saved'));
};

document.getElementById('openBtn').onclick = function () {
  Fantoma.readJSONFile().then(function (raw) {
    var newer = adopt(raw);
    say(newer ? t('newerFile') : t('opened'));
  }).catch(function (err) {
    if (err && err.message !== 'No file chosen.') say(err.message);
  });
};

document.getElementById('newBtn').onclick = function () {
  if (!confirm(t('confirmNew'))) return;
  snapshot();
  doc = blankDoc();
  deselect();
  userAdjusted = false;
  syncControls();
  scheduleSave();
  fit();
  draw();
};


/* --------------------------------------------------------------------------
   The wire panel
   -------------------------------------------------------------------------- */
var wireFields = document.getElementById('wireFields');
var wireEmpty = document.getElementById('wireEmpty');
var WF = {
  name: document.getElementById('wireName'),
  awg: document.getElementById('wireAwg'),
  od: document.getElementById('wireOd'),
  slack: document.getElementById('wireSlack'),
  colour: document.getElementById('wireColour')
};

/* --------------------------------------------------------------------------
   How long a wire actually needs to be
   --------------------------------------------------------------------------
   Reported as its parts rather than as one number, because the point of it is
   to tell you which jumper to reach for, and a total you cannot see inside is
   a total you cannot check.

   The flat run is the path on the plate. The climbs are the standoffs at each
   attached end -- the wire has to get up to a pin sitting that far above the
   plate. Slack is whatever you want spare.

   It is labelled "at least", and it means it: the climbs over retainers are
   not in here because retainers do not exist yet. They can only add. A
   readout that quietly under-reports is worse than none, because you would
   cut to it.
   -------------------------------------------------------------------------- */
function wireLength(w) {
  var flat = 0, i;
  for (i = 1; i < w.path.length; i++) {
    var a = w.path[i - 1].at, b = w.path[i].at;
    flat += Math.sqrt((b[0] - a[0]) * (b[0] - a[0]) + (b[1] - a[1]) * (b[1] - a[1]));
  }

  var climb = 0;
  for (i = 0; i < w.path.length; i++) {
    if (!w.path[i].of) continue;
    var c = findIn(doc.components, w.path[i].of);
    if (c) climb += c.standoff;
  }

  return { flat: flat, climb: climb, slack: w.slack, total: flat + climb + w.slack };
}

function syncWireControls() {
  var w = selectedWire();
  wireFields.hidden = !w;
  wireEmpty.hidden = !!w;

  fillSelect(WF.awg, AWGS, function (a) { return String(a); }, w ? w.awg : 24);
  if (!w) return;

  WF.name.value = w.name;
  WF.od.value = round2(w.od);
  WF.slack.value = w.slack;
  WF.colour.value = w.colour;

  var L = wireLength(w);
  document.getElementById('lengthBreakdown').innerHTML =
    '<b style="color:#f4f4f2">' + t('lenTotal') + ' ' + mm(L.total / 10, 1) + ' cm</b><br>'
    + t('lenFlat') + ' ' + mm(L.flat, 1) + ' \u00b7 '
    + t('lenClimb') + ' ' + mm(L.climb, 1) + ' \u00b7 '
    + t('lenSlack') + ' ' + mm(L.slack, 1) + ' mm<br>'
    + '<span style="color:#6b6b76">' + t('lenPending') + '</span>';
}

function onWireField() {
  if (syncing) return;
  var w = selectedWire();
  if (!w) return;
  var wasAwg = w.awg;
  w.name = WF.name.value.slice(0, 40);
  w.awg = AWGS.indexOf(parseInt(WF.awg.value, 10)) >= 0 ? parseInt(WF.awg.value, 10) : w.awg;
  // Changing the gauge offers its default diameter; typing a diameter keeps it.
  w.od = (w.awg !== wasAwg) ? odForAwg(w.awg) : Math.max(0.1, num(WF.od, w.od));
  w.slack = Math.max(0, num(WF.slack, w.slack));
  w.colour = colourOr(WF.colour.value, w.colour);
  syncControls();
  scheduleSave();
  draw();
}

for (var wKey in WF) {
  if (Object.prototype.hasOwnProperty.call(WF, wKey)) {
    WF[wKey].addEventListener('input', onWireField);
    WF[wKey].addEventListener('change', onWireField);
    WF[wKey].addEventListener('focus', snapshot);
  }

  height: document.getElementById('txtHeight')
};

function syncTextControls() {
  var x = selectedText();
  textFields.hidden = !x;
  textEmpty.hidden = !!x;
  if (!x) return;
  TX.text.value = x.text;
  TX.x.value = round2(x.at[0]);
  TX.y.value = round2(x.at[1]);
  TX.size.value = x.size;
  TX.stroke.value = x.stroke;
  TX.height.value = x.height;
}

function onTextField() {
  if (syncing) return;
  var x = selectedText();
  if (!x) return;
  x.text = TX.text.value.slice(0, 40);
  x.at = [num(TX.x, x.at[0]), num(TX.y, x.at[1])];
  x.size = Math.max(1, num(TX.size, x.size));
  x.stroke = Math.max(0.2, num(TX.stroke, x.stroke));
  x.height = Math.max(0.1, num(TX.height, x.height));
  syncControls();
  scheduleSave();
  draw();
}

for (var txKey in TX) {
  if (Object.prototype.hasOwnProperty.call(TX, txKey)) {
    TX[txKey].addEventListener('input', onTextField);
    TX[txKey].addEventListener('focus', snapshot);
  }
}

  }, taken);

   -------------------------------------------------------------------------- */
var triCount = document.getElementById('triCount');
var clearanceWarn = document.getElementById('clearanceWarn');

function hasClearance() {
  for (var i = 0; i < doc.bosses.length; i++) {
    if (doc.bosses[i].fixing === 'clearance') return true;
  }
  return false;
}

function anyHoleTooSmall() {
  for (var i = 0; i < doc.bosses.length; i++) {
    if (holeTooSmall(doc.bosses[i])) return true;
  }
  return false;
}

function syncExport() {
  var mesh = buildMesh();
  var tris = mesh ? mesh.length : 0;
  // 50 bytes a triangle plus an 84-byte header, so the size is exact rather
  // than an estimate.
  var kb = Math.round((84 + tris * 50) / 1024);
  triCount.textContent = tris + '  (' + kb + ' kB)';
  clearanceWarn.hidden = plateHoles().skipped === 0;
  document.getElementById('smallHoleWarn').hidden = !anyHoleTooSmall();
}

document.getElementById('stlBtn').onclick = function () {
  var mesh = buildMesh();
  if (!mesh) {
    console.error('[protoplaca] the plate face could not be triangulated');
    say(t('meshBroken'));
    return;
  }
  var check = meshProblems(mesh);
  if (!check.ok) {
    // Refuse rather than hand over something that will slice wrong. A broken
    // mesh discovered on the printer costs an hour; discovered here, nothing.
    console.error('[protoplaca] mesh not closed:', check.reason);
    say(t('meshBroken'));
    return;
  }
  var base = (doc.name || t('untitled')).toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  downloadBytes((base || 'protoplaca') + '-' + Fantoma.stamp() + '.stl',
                stlBytes(mesh), 'model/stl');
  say(t('saved'));
};

/* --------------------------------------------------------------------------
   The calibration coupon
   --------------------------------------------------------------------------
   It is an ordinary project, not a special export path. That means it uses the
   same geometry as everything else -- so it tests what you will actually print
   -- and it opens in the editor, where clicking a boss tells you what it is.
   The editor is the legend, which is what lets the coupon exist before there
   is any way to put text on a plate.

   A row per fixing, a column per screw size, tall enough to take an insert.
   -------------------------------------------------------------------------- */
function couponDoc() {
  var d = blankDoc();
  d.name = t('coupon');

  /* A column per screw size, a row per fixing, with room round the edges for
     the labels. The plate is sized from the layout rather than the other way
     round, so adding a screw size later widens the coupon instead of crowding
     it. */
  var pitch = 15;
  var left = 14, bottom = 14;             // to the first boss centre
  var rowLabelX = 5;                      // the S / I / C column
  var keyY = 3.5;                         // the key along the bottom
  var headGap = 4;                        // boss edge to column heading

  d.plate.w = left + (SIZES.length - 1) * pitch + left;
  d.plate.h = bottom + (FIXINGS.length - 1) * pitch + 12;

  var taken = {};
  var i, j;
  for (i = 0; i < SIZES.length; i++) {
    for (j = 0; j < FIXINGS.length; j++) {
      d.bosses.push(normBoss({
        at: [left + i * pitch, bottom + j * pitch],
        size: SIZES[i],
        fixing: FIXINGS[j],
        height: 8
      }, taken, {}));
    }
  }

  /* Labelled on the plate itself, which is what makes the coupon usable away
     from the screen. A heading per column, a letter per row, and a key along
     the bottom -- the fixing names are far too long to repeat eighteen times
     on a plate this size. */
  var prev = doc;
  doc = d;                                 // bossOuterDia reads the profile
  var widest = 0;
  for (i = 0; i < d.bosses.length; i++) {
    widest = Math.max(widest, bossOuterDia(d.bosses[i]) / 2);
  }
  doc = prev;

  var topRow = bottom + (FIXINGS.length - 1) * pitch;
  var headY = topRow + widest + headGap;
  var size = 2.6;

  for (i = 0; i < SIZES.length; i++) {
    d.texts.push(normText({
      text: sizeLabel(SIZES[i]),
      at: [left + i * pitch, headY],
      size: size, align: 'centre'
    }, taken));
  }
  for (j = 0; j < FIXINGS.length; j++) {
    d.texts.push(normText({
      text: t('couponRows').charAt(j) || String(j + 1),
      at: [rowLabelX, bottom + j * pitch - size / 2],
      size: size, align: 'centre'
    }, taken));
  }
  d.texts.push(normText({
    text: t('couponKey'),
    at: [d.plate.w / 2, keyY],
    size: 2.2, align: 'centre'
  }, taken));

  return d;
}

document.getElementById('couponBtn').onclick = function () {
  if (!confirm(t('couponConfirm'))) return;
  adopt(couponDoc());
};

/* --------------------------------------------------------------------------
   Collapsible panels
   --------------------------------------------------------------------------
   On a desk screen the panels are taller than the window, so reaching a
   control means scrolling the drawing out of sight -- which is the one thing
   you were looking at when you went for the control.

   The bodies are wrapped here rather than in the markup so that a panel added
   later collapses too, without anyone having to remember to wrap it.

   Defaults: the panels you set once (Plate, View) start closed, the ones you
   work in stay open. After that your own choice is remembered.
   -------------------------------------------------------------------------- */
var panelState = store.get('panels') || {};

function makeCollapsible(id, openByDefault) {
  var section = document.getElementById(id);
  var head = section.querySelector('h2');

  // The heading's text lives in a span of its own, because applyLang writes
  // that text on every language switch -- writing it on the h2 itself would
  // take the chevron with it.
  var body = document.createElement('div');
  body.className = 'pbody';
  while (head.nextSibling) body.appendChild(head.nextSibling);
  section.appendChild(body);

  var chev = document.createElement('span');
  chev.className = 'chev';
  chev.textContent = '\u25bc';
  head.appendChild(chev);

  head.setAttribute('role', 'button');
  head.tabIndex = 0;

  function apply(open) {
    section.classList.toggle('closed', !open);
    head.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  function toggle() {
    var open = section.classList.contains('closed');
    apply(open);
    panelState[id] = open;
    store.set('panels', panelState);
    // The canvas is sized by the layout, so a panel that changes the page
    // height can change it. Let the renderer notice.
    draw();
  }

  head.addEventListener('click', toggle);
  head.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
  });

  apply(typeof panelState[id] === 'boolean' ? panelState[id] : openByDefault);
}
